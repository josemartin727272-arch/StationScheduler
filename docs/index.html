/* A value's own reading direction, from its first letter: "13-D", "A-U" and
   plain numbers read left to right, a Hebrew value right to left. A select
   does not honour unicode-bidi, so the cell is told outright. */
/* what a stored value shows as in the current display language */
function valueLabel(v){
  if(!v||S.lang==="he") return v;
  const m=(CFG.value_labels||{})[v];
  return (m&&m[S.lang])||v;
}
/* every option value written in Hebrew — the ones that need a translation */
function hebrewValues(){
  const all=new Set();
  Object.values(CFG.options||{}).forEach(l=>(l||[]).forEach(v=>all.add(v)));
  hourOptions().forEach(v=>all.add(v));
  (CFG.extra_tasks||[]).forEach(e=>(e.options||[]).forEach(v=>all.add(v)));
  customRows().forEach(r=>(r.options||[]).forEach(v=>all.add(v)));
  all.add(CFG.special_values.holiday);
  return [...all].filter(v=>v&&/[\u0590-\u05FF]/.test(v));
}
function textDir(v){
  const m=String(v||"").match(/[A-Za-z\u00C0-\u024F]|[\u0590-\u08FF]/);
  if(m) return /[\u0590-\u08FF]/.test(m[0])?"rtl":"ltr";
  return /\d/.test(String(v||""))?"ltr":"";
}
function selCell(dk,field,options,val,cls,bg){
  let o=`<option value=""></option>`;
  const list=options.slice();
  if(val&&!list.includes(val)) list.push(val);
  list.forEach(v=>{ const lb=valueLabel(v), d=textDir(lb);
    o+=`<option value="${esc(v)}"${d?` dir="${d}"`:""} ${v===val?"selected":""}>${esc(lb)}</option>`; });
  const st=bg?` style="background:${esc(bg)}"`:"", d=textDir(valueLabel(val));
  const why=S.showWhy&&val&&S.why?S.why[dk+"|"+field]:"";
  return `<td class="${cls||""}"><select data-dk="${dk}" data-f="${field}"${d?` dir="${d}"`:""}${st}>${o}</select>`+
    (why?`<div class="why">${esc(why)}</div>`:"")+`</td>`;
}
function renderRow(rk,keys){
  const cr=customRows().find(r=>r.key===rk);
  const sx=sectionByRow(rk), ex=extraByRow(rk);
  let h=`<tr><td class="label">${esc(rowLabel(rk))}</td>`;
  for(let i=0;i<keys.length;i++){
    const dk=keys[i], day=S.days[dk];
    if(rk==="work_hours"){
      h+=selCell(dk,"work_hours",hourOptions(),day.work_hours);
    } else if(AWAY_ROWS.includes(rk)){
      h+=`<td class="away-cell"><div class="tagbox" data-dk="${dk}" data-away="${esc(rk)}">`+
         awayTags(dk,rk)+`</div></td>`;
    } else if(sx){
      const g=groupById(sx.sec.group_id);
      const away=awayToday(day);
      const avail=(g?groupEmps(g.id):allEmps()).filter(e=>!away.has(e));
      const size=sectionSize(sx.sec);
      const list=avail.slice();
      if(size>=2) list.push(...combos(avail,Math.min(size,avail.length)));
      h+=selCell(dk,rk,list,day[rk],"",g?g.color:"");
    } else if(ex){
      h+=selCell(dk,rk,(ex.options||[]).filter(Boolean),day[rk]);
    } else if(rk==="other_empl"){
      h+=selCell(dk,rk,allEmps(),day[rk]);
    } else if(TEXT_ROWS.has(rk)||(cr&&cr.input!=="select")){
      h+=`<td><input type="text" data-dk="${dk}" data-f="${rk}" value="${esc(day[rk]||"")}"></td>`;
    } else if(cr){
      h+=selCell(dk,rk,(cr.options||[]).filter(Boolean),day[rk]);
    } else if(rk==="axis_morning"||rk==="axis_noon"){
      /* only the axes this day's entry/exit actually permits */
      const kind=rk==="axis_morning"?"entry":"exit";
      const allowed=day[kind]?allowedAxesFor(kind,day[kind]):axisLetters();
      h+=selCell(dk,rk,axisValues().filter(v=>allowed.includes(axisLetterOf(v))),day[rk]);
    } else {
      const cls=(rk==="vehicle_morning"||rk==="vehicle_noon")&&day[rk]===CFG.special_values.vehicle_special?"cell-yellow":"";
      h+=selCell(dk,rk,opts(ROW_OPTS[rk]||""),day[rk],cls);
    }
  }
  return h+"</tr>";
}

/* rows renamed on the Labels tab: not sections (named by their workplace),
   not the extra task (its own tab), not custom rows (their own editor) */
/* Every schedule row, and what the Rows tab may do with it:
   "fixed"   — built in; labels editable, never deletable
   "section" — named by its workplace, "extra" — named by its task: both
               read-only here so the name keeps one home
   "custom"  — added by the user; fully editable and deletable */
function rowKind(k){
  if(customKeys().includes(k)) return "custom";
  if(sectionRowKeys().includes(k)) return "section";
  if(extraRowKeys().includes(k)) return "extra";
  return "fixed";
}
function labelledRowKeys(){ return naturalRowKeys(); }
/* every identifier a new row must not collide with */
function takenRowKeys(){
  const out=new Set(naturalRowKeys().concat(legacyVacFields(),
    ["dates","days","vacation","trip","date"]));
  Object.keys(I18N.he).forEach(k=>{ if(k.startsWith("row_")) out.add(k.slice(4)); });
  (CFG.custom_rows||[]).forEach(r=>{ if(r&&r.key) out.add(r.key); });
  return out;
}
function normalizeRowKey(v){
  return String(v||"").trim().toLowerCase()
    .replace(/[^a-z0-9_]+/g,"_")     // any run of stray characters becomes one _
    .replace(/_+/g,"_")
    .replace(/^_+|_+$/g,"");
}

function rowChoices(rk){
  const cr=customRows().find(r=>r.key===rk), sx=sectionByRow(rk), ex=extraByRow(rk);
  if(rk==="work_hours") return hourOptions();
  if(sx){ const g=groupById(sx.sec.group_id), pool=g?groupEmps(g.id):allEmps();
          const size=sectionSize(sx.sec);
          return size>=2?pool.concat(combos(pool,Math.min(size,pool.length))):pool.slice(); }
  if(ex) return (ex.options||[]).filter(Boolean);
  if(rk==="other_empl") return allEmps();
  if(cr) return cr.input==="select"?(cr.options||[]).filter(Boolean):[];
  if(rk==="axis_morning"||rk==="axis_noon") return axisValues();
  if(TEXT_ROWS.has(rk)) return [];
  return opts(ROW_OPTS[rk]||"");
}

      <button class="btn small" id="restoreNo">✗ ${t("no")}</button></div>`;
  h+=`<div class="card">`;
  if(!weeks.length) h+=`<div class="hint">${t("arch_empty")}</div>`;
  const months=[...new Set(weeks.map(w=>w.slice(0,7)))];
  months.forEach((ym,mi)=>{
    const mWeeks=weeks.filter(w=>w.startsWith(ym));
    h+=`<details data-month="${esc(ym)}" ${mi===0?"open":""}><summary style="cursor:pointer;padding:8px 0;font-weight:700;color:var(--primary)">📅 ${ym} (${mWeeks.length} ${t("st_weeks")})</summary>`;
    mWeeks.forEach(wk=>{
      const conf=S.pendingConfirm==="delarch_"+wk;
      h+=`<div class="arch-item"><span class="wk">${wk}</span>
        <button class="btn small primary" data-load="${wk}">${t("load")}</button>
        <button class="btn small" data-csv="${wk}">CSV</button>
        ${conf?`<span class="inline-confirm">${t("confirm_q")}
          <button class="btn small warn" data-delarch-yes="${wk}">✓</button>
          <button class="btn small" data-cancel-confirm="1">✗</button></span>`
        :`<button class="btn small warn" data-delarch="${wk}">🗑</button>`}
      </div>`;
    });
    h+=`</details>`;
  });
  return h+"</div>";
}

/* ═══════════════ screen 4: stats ═══════════════ */
function computeStats(schedules){
  const roles=sectionRowKeys();                 // one column per workplace role
  const emps=allEmps();
  const empC={}; emps.forEach(e=>{ empC[e]={}; roles.forEach(r=>empC[e][r]=0); });
  const vac={}, trip={}, oth={}; emps.forEach(e=>{vac[e]=0;trip[e]=0;oth[e]=0;});
  const fields=["entry","exit","escort_morning","escort_noon","arrival_point","theater",
    "vehicle_morning","axis_morning","wait_morning","taxi_apt","taxi_arrival",
    "vehicle_noon","axis_noon","wait_noon","taxi_emb","taxi_arrival_noon"]
    .concat(extraRowKeys())
    .concat(customRows().filter(r=>r.input==="select").map(r=>r.key));
  const fieldC={}; fields.forEach(f=>fieldC[f]={});
  let nd=0;
  schedules.forEach(days=>{ for(const dk in days){ const day=days[dk]; nd++;
    /* a section may hold a pair ("A+B") — credit both */
    roles.forEach(r=>String(day[r]||"").split("+").forEach(e=>{ if(e&&empC[e]) empC[e][r]++; }));
    fields.forEach(f=>{ const v=day[f]; if(v) fieldC[f][v]=(fieldC[f][v]||0)+1; });
    awayList(day,"vacation").forEach(e=>{ if(vac[e]!=null) vac[e]++; });
    awayList(day,"trip").forEach(e=>{ if(trip[e]!=null) trip[e]++; });
    const o=day.other_empl; if(o&&oth[o]!=null) oth[o]++;
  }});
  return {empC,fieldC,nd,vac,trip,oth,roles};
}
function viewStats(){
  const arch=loadArchive();
  const weeks=Object.keys(arch).sort();
  const months=[...new Set(weeks.map(w=>w.slice(0,7)))].reverse();
  const years=[...new Set(weeks.map(w=>w.slice(0,4)))].reverse();
  if(!S.statsMonth&&months.length) S.statsMonth=months[0];
  if(!S.statsYear&&years.length) S.statsYear=years[0];
  let h=`<h2>📊 ${t("nav_stats")}</h2><div class="card row-flex">
    <label>${t("st_period")}
    <select id="statsTab">
      <option value="week" ${S.statsTab==="week"?"selected":""}>${t("st_week")}</option>
      <option value="month" ${S.statsTab==="month"?"selected":""}>${t("st_month")}</option>
      <option value="year" ${S.statsTab==="year"?"selected":""}>${t("st_year")}</option>
    </select></label>`;
  if(S.statsTab==="month") h+=`<select id="statsMonth">${months.map(m=>`<option ${m===S.statsMonth?"selected":""}>${m}</option>`).join("")}</select>`;
  if(S.statsTab==="year") h+=`<select id="statsYear">${years.map(y=>`<option ${y===S.statsYear?"selected":""}>${y}</option>`).join("")}</select>`;
  h+=`</div>`;
  let schedules=[],label="";
  if(S.statsTab==="week"){ if(S.days) schedules=[S.days]; label=t("st_week"); }
  else if(S.statsTab==="month"){ schedules=weeks.filter(w=>w.startsWith(S.statsMonth)).map(w=>arch[w]); label=S.statsMonth; }
  else { schedules=weeks.filter(w=>w.startsWith(S.statsYear)).map(w=>arch[w]); label=S.statsYear; }
  if(!schedules.length) return h+`<div class="msg warn">${t("st_no_data")}</div>`;
  const st=computeStats(schedules);
  window.__statsExport={label,st};
  h+=`<div class="hint row-flex"><b>${esc(label)}</b> — ${schedules.length} ${t("st_weeks")} · ${st.nd} ${t("st_days")}
    <button class="btn small" id="btnStatsCsv">📤 ${t("export_csv")}</button></div>`;
  /* employees — totals column highlights anyone >20% away from the average */
  const totals={}; let sumTot=0;
  allEmps().forEach(e=>{ totals[e]=st.roles.reduce((s,r)=>s+(st.empC[e]?st.empC[e][r]:0),0); sumTot+=totals[e]; });
  const avgTot=allEmps().length?sumTot/allEmps().length:0;
  h+=`<div class="card"><h3>👤 ${t("st_employees")}</h3><div class="tbl-wrap"><table class="stats"><tr><th></th>`;
  st.roles.forEach(r=>h+=`<th>${esc(rowLabel(r))}</th>`);
  h+=`<th>${t("total_col")}</th><th>${t("st_vac_col")}</th><th>${t("row_trip")}</th>
    <th>${t("st_other")}</th></tr>`;
  allEmps().forEach(e=>{ h+=`<tr><th>${esc(e)}</th>`;
    st.roles.forEach(r=>{ const c=st.empC[e]?st.empC[e][r]:0; const p=st.nd?Math.round(c/st.nd*100):0;
      h+=`<td>${c} <small>(${p}%)</small></td>`; });
    const off=avgTot&&Math.abs(totals[e]-avgTot)>0.2*avgTot;
    h+=`<td style="${off?"color:var(--danger);font-weight:700":""}">${totals[e]}</td>`;
    h+=`<td>${st.vac[e]||0}</td><td>${(st.trip&&st.trip[e])||0}</td>
      <td>${st.oth[e]||0}</td></tr>`; });
  h+=`</table></div></div>`;
  /* vacation budget */
  h+=`<div class="card"><h3>🏖 ${t("st_vacation")}</h3><div class="tbl-wrap"><table class="stats">
    <tr><th></th><th>${t("st_used")}</th><th>${t("st_budget")}</th><th>%</th><th>${t("st_left")}</th><th></th></tr>`;
  allEmps().forEach(e=>{ const used=st.vac[e]||0;
    const bud=CFG.vacation_budget[e]!=null?CFG.vacation_budget[e]:0;
    const p=bud?Math.round(used/bud*100):0;
    h+=`<tr><th>${esc(e)}</th><td>${used}</td><td>${bud}</td><td>${p}%</td><td>${Math.max(bud-used,0)}</td>
      <td><div class="bar"><i style="width:${Math.min(p,100)}%"></i></div></td></tr>`; });
  h+=`</table></div></div>`;
  /* fields */
  h+=`<div class="card"><h3>📋 ${t("st_fields")}</h3>`;
  for(const f in st.fieldC){
    const counts=st.fieldC[f]; const total=Object.values(counts).reduce((a,b)=>a+b,0);
    if(!total) continue;
    h+=`<h3 style="font-size:.9rem">${esc(rowLabel(f))}</h3><div class="tbl-wrap"><table class="stats"><tr>`;
    const vals=Object.keys(counts).sort();
    vals.forEach(v=>h+=`<th>${esc(valueLabel(v))}</th>`); h+=`</tr><tr>`;
    vals.forEach(v=>{ const p=Math.round(counts[v]/total*100);
      h+=`<td>${counts[v]} <small>(${p}%)</small><div class="bar"><i style="width:${p}%"></i></div></td>`; });
    h+=`</tr></table></div>`;
  }
  return h+`</div>`;
}

function logCsv(){
  const q=v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`;
  const rows=[[t("log_time"),t("log_action"),t("log_details"),t("log_changes"),t("week_start")]];
  loadLog().forEach(r=>rows.push([fmtLogTime(r.timestamp), t("act_"+r.action),
    logDetails(r), r.changes||"", r.week||""]));
  return "\ufeff"+rows.map(r=>r.map(q).join(",")).join("\r\n");
}

    {he:"📁 ארכיון — כל השבועות השמורים, וגיבוי/שחזור לקובץ.", en:"📁 Archive — every saved week, plus backup/restore to a file.", es:"📁 Archivo — todas las semanas guardadas, y copia/restauración a un archivo."},
    {he:"📊 סטטיסטיקה — מי עשה מה, ניצול חופשות והתפלגות ערכים, לשבוע/חודש/שנה.", en:"📊 Statistics — who did what, vacation use and value spread, per week/month/year.", es:"📊 Estadísticas — quién hizo qué, uso de vacaciones y reparto de valores, por semana/mes/año."},
    {he:"📖 מדריך — הדף הזה. כל פרק נפתח ונסגר בלחיצה על הכותרת שלו.", en:"📖 Guide — this page. Each chapter opens and closes by tapping its title.", es:"📖 Guía — esta página. Cada capítulo se abre y cierra tocando su título."}]}
 ]},

{id:"setup", icon:"⚙️", title:{he:"הגדרות התחנה — פעם אחת בהתחלה", en:"Station settings — once at the start", es:"Ajustes de la estación — una vez al inicio"},
 blocks:[
  {p:{he:"כל קטע במסך ⚙️ הגדרות נפתח בלחיצה על הכותרת שלו. ברוב הקטעים צריך ללחוץ 💾 שמור הגדרות בסוף; גרירת סדר נשמרת מיד.",
      en:"Each section in ⚙️ Settings opens by tapping its title. Most sections need 💾 Save settings at the end; drag-reordering saves at once.",
      es:"Cada sección de ⚙️ Ajustes se abre tocando su título. La mayoría necesita 💾 Guardar ajustes al final; reordenar arrastrando se guarda al momento."}},
  {h:{he:"👤 קבוצות עובדים ותקציבי חופשה", en:"👤 Employee groups & vacation budgets", es:"👤 Grupos de empleados y presupuestos"}},
  {steps:[
    {he:"כל קבוצה היא צוות עם צבע משלו (עד חמש קבוצות). תן לה שם ובחר צבע.", en:"Each group is a team with its own colour (up to five). Give it a name and pick a colour.", es:"Cada grupo es un equipo con su color (hasta cinco). Dale un nombre y elige un color."},
    {he:"„שפת ההודעות לעובדים” — השפה שבה עובדי הקבוצה יקבלו את הוואטסאפ.", en:"“Language of workers' messages” — the language the group's workers get their WhatsApp in.", es:"“Idioma de los mensajes” — el idioma en que los trabajadores del grupo reciben su WhatsApp."},
    {he:"בתיבת העובדים — שם אחד בכל שורה.", en:"In the workers box — one name per line.", es:"En la caja de trabajadores — un nombre por línea."},
    {he:"תקציב חופשה שנתי (ימים) לכל עובד — משמש את הסטטיסטיקה.", en:"Annual vacation budget (days) per worker — used by the statistics.", es:"Presupuesto anual de vacaciones (días) por trabajador — lo usan las estadísticas."},
    {he:"מגבלת היעדרות יומית — כמה מותר שייעדרו באותו יום (חופשה + נסיעה). חריגה מוציאה הערה בלבד.", en:"Daily absence cap — how many may be away on one day (vacation + trip). Exceeding it only raises a note.", es:"Límite diario de ausencias — cuántos pueden faltar el mismo día (vacaciones + viaje). Superarlo solo genera una nota."},
    {he:"לחץ 💾 שמור הגדרות.", en:"Tap 💾 Save settings.", es:"Toca 💾 Guardar ajustes."}]},
  {h:{he:"✏️ שינוי שם עובד", en:"✏️ Renaming a worker", es:"✏️ Cambiar el nombre de un trabajador"}},
  {p:{he:"באותו קטע: בחר עובד, כתוב שם חדש, לחץ „שנה שם” ואשר. השם החדש לוקח איתו את כל ההיסטוריה — סידורים שמורים, תקציב, שיבוצים קבועים ולוח חופשות — והסטטיסטיקה תראה אדם אחד.",
      en:"In the same section: pick a worker, type the new name, tap “Rename” and confirm. The new name takes the whole history along — saved schedules, budget, fixed assignments and the calendar — and statistics show one person.",
      es:"En la misma sección: elige un trabajador, escribe el nombre nuevo, toca “Cambiar” y confirma. El nombre nuevo se lleva todo el historial — horarios, presupuesto, asignaciones fijas y calendario — y las estadísticas muestran una sola persona."}},
  {warn:{he:"אל תשנה שם ישירות ברשימת העובדים — זה יוצר עובד חדש בלי היסטוריה. עובד שעזב: מחק אותו מהרשימה; הסידורים הישנים נשארים.",
         en:"Do not rename directly in the workers list — that creates a new person with no history. Someone who left: delete them from the list; old schedules stay.",
         es:"No cambies el nombre directamente en la lista — eso crea una persona nueva sin historial. Alguien que se fue: bórralo de la lista; los horarios viejos quedan."}},
  {h:{he:"🏢 מקומות עבודה וסדר השיבוץ", en:"🏢 Workplaces and staffing order", es:"🏢 Lugares de trabajo y orden de asignación"}},
  {p:{he:"מקום עבודה (למשל EMB, R) מכיל תפקידים, ולכל תפקיד קבוצה שממנה לוקחים עובדים. לכל תפקיד: מספר עובדים לשיבוץ (0 מכבה את השורה, 2 שם שניים בתא עם +), מינימום יומי, וסימון „חובה לשיבוץ”. לכל מקום: סדר עדיפות ו„מינימום תפקידים מאוישים”.",
      en:"A workplace (e.g. EMB, R) holds roles, each drawing workers from one group. Per role: workers to place (0 switches the row off, 2 puts two in the cell joined by +), a daily minimum, and “required”. Per workplace: a priority and “at least N roles staffed”.",
      es:"Un lugar (p. ej. EMB, R) tiene puestos, cada uno toma trabajadores de un grupo. Por puesto: cuántos asignar (0 apaga la fila, 2 pone dos en la celda unidos con +), un mínimo diario y “obligatorio”. Por lugar: prioridad y “mínimo de puestos cubiertos”."}},
  {p:{he:"בראש הקטע — רשימת סדר השיבוץ. זה החוק עצמו: השיבוץ עובר מלמעלה למטה, וכל תפקיד מקבל עובד פנוי מהקבוצה שלו. ביום חסר-ידיים, התפקידים שבתחתית נשארים ריקים. גרור בידית ⠿ או בחצים ↑↓; נשמר מיד.",
      en:"At the top of the section is the staffing order. It is the rule itself: assignment goes top to bottom, and each role gets a free worker of its group. On a short day the roles at the bottom stay empty. Drag by ⠿ or use ↑↓; saved at once.",
      es:"Arriba de la sección está el orden de asignación. Es la regla misma: se asigna de arriba abajo y cada puesto recibe un trabajador libre de su grupo. En un día con poca gente, los de abajo quedan vacíos. Arrastra con ⠿ o usa ↑↓; se guarda al momento."}},
  {tip:{he:"מינימום, „חובה” ו„מינימום תפקידים” לא משנים את הסדר — הם רק מוציאים הערה ⚠️ כשמשהו לא הושג.",
        en:"Minimums, “required” and “at least N roles” do not change the order — they only raise a ⚠️ note when something was not met.",
        es:"Mínimos, “obligatorio” y “mínimo de puestos” no cambian el orden — solo generan una nota ⚠️ cuando algo no se cumplió."}},
  {h:{he:"📆 ימי עבודה ושעות", en:"📆 Work days and hours", es:"📆 Días y horarios"}},
  {p:{he:"סמן אילו ימים מופיעים בסידור, ושנה את שם היום אם רוצים (למשל „שישי 🕕”). בתיבת השעות — שעה אחת בכל שורה; אלה האפשרויות בשורת „שעות עבודה”. הערך „חג” נבחר ידנית: יום שמסומן חג — השיבוץ האוטומטי לא נוגע בו.",
      en:"Tick which days appear in the schedule, and rename a day if you like (e.g. “Friday 🕕”). In the hours box — one per line; these are the choices in the “Work hours” row. The “holiday” value is picked by hand: a day marked holiday is left alone by Auto Assign.",
      es:"Marca qué días aparecen en el horario y renombra un día si quieres. En la caja de horarios — uno por línea; son las opciones de la fila “Horario”. El valor “feriado” se elige a mano: un día marcado feriado no lo toca la asignación automática."}},
  {h:{he:"➕ משימה נוספת", en:"➕ Extra task", es:"➕ Tarea extra"}},
  {p:{he:"שורה למשימה שחוזרת כל שבוע (עד חמש), עם ערכי בוקר וצהריים משלה ויעד: כמה פעמים בבוקר וכמה בצהריים. השיבוץ ידאג שהיעד יתמלא.",
      en:"A row for a task that recurs every week (up to five), with its own morning and noon values and a target: how many mornings and how many noons. Auto Assign fills the target.",
      es:"Una fila para una tarea semanal (hasta cinco), con valores de mañana y mediodía y un objetivo: cuántas mañanas y cuántos mediodías. La asignación cumple el objetivo."}},
  {h:{he:"🏷️ שורות · 📝 אפשרויות · ↕️ סדר", en:"🏷️ Rows · 📝 Options · ↕️ Order", es:"🏷️ Filas · 📝 Opciones · ↕️ Orden"}},
  {li:[
    {he:"🏷️ שורות ותוויות — שם כל שורה בשלוש שפות; ➕ שורה חדשה (רשימה או טקסט חופשי); 🗑 מחיקה — סופית, גבה קודם.", en:"🏷️ Rows & labels — each row's name in three languages; ➕ new row (list or free text); 🗑 delete — final, back up first.", es:"🏷️ Filas y etiquetas — el nombre de cada fila en tres idiomas; ➕ fila nueva (lista o texto libre); 🗑 borrar — definitivo, haz copia antes."},
    {he:"📝 אפשרויות בחירה — לכל שורה מסוג רשימה, הערכים שאפשר לבחור, אחד בכל שורה.", en:"📝 Dropdown options — for each list row, the values to choose from, one per line.", es:"📝 Opciones — para cada fila de lista, los valores a elegir, uno por línea."},
    {he:"↕️ סדר השורות — הסדר בטבלה, בהדפסה ובייצוא. גרירה, נשמר מיד. לא קשור לסדר השיבוץ.", en:"↕️ Row order — the order in the table, print and export. Drag; saved at once. Unrelated to the staffing order.", es:"↕️ Orden de filas — el orden en la tabla, impresión y exportación. Arrastra; se guarda al momento. No tiene que ver con el orden de asignación."}]},
  {h:{he:"🎯 יעדים שבועיים ואחוזי איזון", en:"🎯 Weekly targets and balance shares", es:"🎯 Objetivos semanales y porcentajes"}},
  {p:{he:"יעד: „השורה הזאת מקבלת את הערך הזה N פעמים בשבוע” (למשל YELLOW פעמיים בבוקר). „כל ערך” = כמה פעמים השורה מולאה בכלל. מתחת — 📊 אחוזי יעד לכל שדה: איזה חלק מהשיבוצים יקבל כל ערך לאורך זמן (סכום 100%; ↺ חלוקה שווה).",
      en:"A target: “this row gets this value N times a week” (e.g. YELLOW twice in the morning). “Any value” = how many times the row is filled at all. Below — 📊 target % per field: what share each value gets over time (total 100%; ↺ equal split).",
      es:"Un objetivo: “esta fila recibe este valor N veces por semana” (p. ej. YELLOW dos mañanas). “Cualquier valor” = cuántas veces se llena la fila. Abajo — 📊 % objetivo por campo: qué parte recibe cada valor con el tiempo (total 100%; ↺ división igual)."}},
  {h:{he:"🧭 צירים, שעות כניסה/יציאה ומונית מיוחדת", en:"🧭 Axes, entry/exit times and the special taxi", es:"🧭 Rutas, horas de entrada/salida y el taxi especial"}},
  {li:[
    {he:"כל ציר הוא אות (A, B, C…) עם חלוקה פנימית U/D באחוזים.", en:"Each axis is a letter (A, B, C…) with its own U/D split in percent.", es:"Cada ruta es una letra (A, B, C…) con su división U/D en porcentaje."},
    {he:"% שימוש בציר — איזה חלק מכלל השיבוצים יקבל כל ציר (סכום 100%). ציר ב-0% לא ייבחר לעולם.", en:"% axis use — what share of all assignments each axis gets (total 100%). An axis at 0% is never chosen.", es:"% uso de ruta — qué parte de todas las asignaciones recibe cada ruta (total 100%). Una ruta al 0% nunca se elige."},
    {he:"🚕 עדיפות ציר כשיש מונית מיוחדת — למונית בוקר ולמונית צהריים: מסמנים צירים ונותנים אחוז לכל אחד (סכום 100%). ביום עם מונית, הציר נבחר מתוכם ושעת הכניסה/יציאה מותאמת לו; שעה שהוזנה ידנית נשמרת.", en:"🚕 Preferred axis with a special taxi — for the morning and the noon taxi: tick axes and give each a share (total 100%). On a taxi day the axis is chosen from them and the entry/exit time is fitted to it; a hand-typed time is kept.", es:"🚕 Ruta preferida con taxi especial — para el taxi de mañana y el de mediodía: marca rutas y da un porcentaje a cada una (total 100%). En un día con taxi la ruta se elige entre ellas y la hora se ajusta; una hora escrita a mano se respeta."},
    {he:"כניסה ↔ ציר בוקר / יציאה ↔ ציר צהריים — לכל שעה: אילו צירים מותרים לה ובאיזה אחוז. שעה בלי סימון — כל הצירים מותרים.", en:"Entry ↔ morning axis / exit ↔ noon axis — for each time: which axes it allows and in what share. A time with nothing ticked allows every axis.", es:"Entrada ↔ ruta de mañana / salida ↔ ruta de mediodía — para cada hora: qué rutas permite y en qué porcentaje. Una hora sin marcar permite todas."}]},
  {tip:{he:"שלוש שכבות האחוזים פועלות יחד. אם התוצאה מפתיעה — 💬 למה? במסך הסידור מסביר כל תא.",
        en:"The three layers of shares work together. If a result surprises you — 💬 Why? on the schedule screen explains each cell.",
        es:"Las tres capas de porcentajes funcionan juntas. Si un resultado sorprende — 💬 ¿Por qué? en el horario explica cada celda."}},
  {h:{he:"📌 שיבוצים קבועים", en:"📌 Fixed assignments", es:"📌 Asignaciones fijas"}},
  {p:{he:"בחר יום, שורה וערך — למשל שני · EMB IL · עובד 1 — ולחץ ➕ הוסף שיבוץ קבוע. כל שבוע חדש (וגם 🗑 נקה) נפתח עם התא מלא, והשיבוץ האוטומטי שומר עליו. עובד שנעדר באותו יום — התא נשאר ריק ותופיע הערה 📌. כלל חדש לאותו יום ושורה מחליף את הקודם.",
      en:"Pick a day, a row and a value — e.g. Monday · EMB IL · Worker 1 — and tap ➕ Add fixed assignment. Every new week (and 🗑 Clear) opens with the cell filled, and Auto Assign keeps it. If the person is away that day the cell stays empty and a 📌 note says why. A new rule for the same day and row replaces the old one.",
      es:"Elige día, fila y valor — p. ej. lunes · EMB IL · Trabajador 1 — y toca ➕ Añadir asignación fija. Cada semana nueva (y 🗑 Limpiar) abre con la celda llena, y la asignación la respeta. Si la persona falta ese día la celda queda vacía y una nota 📌 lo explica. Una regla nueva para el mismo día y fila reemplaza la anterior."}},
  {warn:{he:"שבוע שכבר פתוח לא מקבל כלל חדש מעצמו — הזן אותו ידנית בתא, או צור את השבוע מחדש.",
         en:"A week that is already open does not pick up a new rule by itself — type it in the cell, or create the week again.",
         es:"Una semana ya abierta no toma una regla nueva sola — escríbela en la celda o crea la semana de nuevo."}},
  {h:{he:"🏖 לוח חופשות", en:"🏖 Absence calendar", es:"🏖 Calendario de ausencias"}},
  {p:{he:"עובד · חופשה או נסיעה · מתאריך · עד תאריך · ➕ הוסף. החופשה נכנסת לבד לשבוע שבו היא נופלת — ראה פרק 🏖 חופשות ונסיעות.",
      en:"Worker · vacation or trip · from · to · ➕ Add. It lands by itself in the week it falls in — see the 🏖 Vacations & trips chapter.",
      es:"Trabajador · vacaciones o viaje · desde · hasta · ➕ Añadir. Entra sola en la semana en que cae — ver el capítulo 🏖 Vacaciones y viajes."}},
  {h:{he:"🔒 סיסמה לאתר", en:"🔒 Site password", es:"🔒 Contraseña del sitio"}},
  {p:{he:"להחלפת סיסמה: כתוב סיסמה חדשה פעמיים (לפחות 8 תווים) ולחץ „צור קוד”. מתקבל קוד שמתחיל ב-v1: — את הקוד (לא את הסיסמה) שולחים למי שמתחזק את האתר, והוא מכניס אותו. „🔓 שכח את המכשיר הזה” — הסיסמה תתבקש שוב בפתיחה הבאה.",
      en:"To change the password: type a new one twice (8+ characters) and tap “Make code”. You get a code starting with v1: — send the code (not the password) to whoever maintains the site, who puts it in. “🔓 Forget this device” — the password is asked again next time.",
      es:"Para cambiar la contraseña: escribe una nueva dos veces (8+ caracteres) y toca “Crear código”. Obtienes un código que empieza con v1: — envía el código (no la contraseña) a quien mantiene el sitio, que lo coloca. “🔓 Olvidar este dispositivo” — la próxima vez pide la contraseña."}},
  {h:{he:"📝 הערות · 📋 לוג שינויים · ייצוא/ייבוא הגדרות", en:"📝 Notes · 📋 Change log · settings export/import", es:"📝 Notas · 📋 Registro · exportar/importar ajustes"}},
  {li:[
    {he:"📝 הערות לוגיקת שיבוץ — טקסט חופשי לתיעוד; המערכת לא קוראת אותו.", en:"📝 Assignment logic notes — free text for documentation; the app never reads it.", es:"📝 Notas de lógica — texto libre de documentación; la app no lo lee."},
    {he:"📋 לוג שינויים — 200 הפעולות האחרונות (שמירה, שיבוץ, הגדרות, ייצוא, שינוי שם…), עם ייצוא ל-CSV וניקוי.", en:"📋 Change log — the last 200 actions (save, assign, settings, export, rename…), with CSV export and clear.", es:"📋 Registro — las últimas 200 acciones (guardar, asignar, ajustes, exportar, renombrar…), con exportación CSV y limpiar."},
    {he:"📤 ייצוא הגדרות / 📥 ייבוא הגדרות (בראש המסך) — מעבירים הגדרות בלבד, בלי סידורים.", en:"📤 Export settings / 📥 Import settings (top of the screen) — move settings only, no schedules.", es:"📤 Exportar / 📥 Importar ajustes (arriba) — mueven solo los ajustes, sin horarios."}]}
 ]},

{id:"build", icon:"📋", title:{he:"בניית סידור שבועי", en:"Building a weekly schedule", es:"Armar un horario semanal"},
 blocks:[
  {h:{he:"1. פתיחת שבוע", en:"1. Opening a week", es:"1. Abrir una semana"}},
  {p:{he:"בחר תאריך בשדה „תחילת שבוע” (נצמד ליום שני) ולחץ 🔄 צור סידור. השבוע נפתח עם ימי העבודה, עם השיבוצים הקבועים ועם החופשות מלוח החופשות. אם כבר שמור סידור לאותו שבוע — המערכת שואלת לפני שהיא דורסת.",
      en:"Pick a date in “Week start” (it snaps to Monday) and tap 🔄 New Schedule. The week opens with the work days, the fixed assignments and the absences from the calendar. If a schedule for that week is already saved, the app asks before replacing it.",
      es:"Elige una fecha en “Inicio de semana” (se ajusta al lunes) y toca 🔄 Nuevo Horario. La semana abre con los días laborales, las asignaciones fijas y las ausencias del calendario. Si ya hay un horario guardado para esa semana, la app pregunta antes de reemplazarlo."}},
  {h:{he:"2. הזנה ידנית — קודמת לכול", en:"2. Typing by hand — comes first", es:"2. A mano — va primero"}},
  {p:{he:"לחץ על תא ובחר ערך; הוא נשמר מיד. כל ערך שהוזן ידנית — וגם שיבוץ קבוע — לא יידרס בשיבוץ האוטומטי. מלא קודם את מה שאתה יודע. ערכים כמו 13-D או A-U נקראים משמאל לימין, ערכים בעברית מימין לשמאל.",
      en:"Tap a cell and pick a value; it is saved at once. Anything typed by hand — and any fixed assignment — is never overwritten by Auto Assign. Fill what you know first. Values like 13-D or A-U read left to right, Hebrew values right to left.",
      es:"Toca una celda y elige un valor; se guarda al momento. Lo escrito a mano — y las asignaciones fijas — nunca lo pisa la asignación automática. Llena primero lo que sabes. Valores como 13-D o A-U se leen de izquierda a derecha; los valores en hebreo, de derecha a izquierda."}},
  {h:{he:"3. ⚡ שיבוץ אוטומטי — איך הוא מחליט", en:"3. ⚡ Auto Assign — how it decides", es:"3. ⚡ Asignación automática — cómo decide"}},
  {li:[
    {he:"ממלא רק תאים ריקים; יום שמסומן חג — לא נוגע בו.", en:"Fills only empty cells; leaves a day marked holiday alone.", es:"Llena solo celdas vacías; no toca un día marcado feriado."},
    {he:"קודם היעדים השבועיים (למשל כמה YELLOW).", en:"First the weekly targets (e.g. how many YELLOW).", es:"Primero los objetivos semanales (p. ej. cuántos YELLOW)."},
    {he:"שעות כניסה/יציאה וצירים — לפי עדיפות המונית המיוחדת, אחוזי הצירים וחוקי השעות.", en:"Entry/exit times and axes — by the special-taxi preference, the axis shares and the time rules.", es:"Horas y rutas — según la preferencia del taxi especial, los porcentajes de rutas y las reglas de horas."},
    {he:"תפקידים — לפי סדר השיבוץ, כל אחד מהקבוצה שלו, בלי מי שבחופשה/נסיעה/משימה אחרת ובלי לשבץ אדם פעמיים ביום.", en:"Roles — in the staffing order, each from its own group, skipping anyone on vacation/trip/other task and never placing someone twice a day.", es:"Puestos — en el orden de asignación, cada uno de su grupo, sin quien esté de vacaciones/viaje/otra tarea y sin repetir a nadie el mismo día."},
    {he:"איזון עובדים שבועי: התפקיד הולך למי שמילא אותו הכי מעט השבוע; בתיקו — למי שקיבל פחות לאחרונה.", en:"Weekly balance: a role goes to whoever held it the fewest times this week; on a tie, to whoever had it less lately.", es:"Equilibrio semanal: el puesto va a quien lo tuvo menos esta semana; en empate, a quien lo tuvo menos últimamente."},
    {he:"שאר הערכים (נקודות הגעה, מקומות המתנה, משימות נוספות, מוניות) — איזון לפי 90 הימים האחרונים ואחוזי היעד.", en:"Other values (arrival points, wait spots, extra tasks, taxis) — balanced over the last 90 days and the target %.", es:"Los demás valores (puntos de llegada, esperas, tareas extra, taxis) — equilibrados en los últimos 90 días y los % objetivo."}]},
  {h:{he:"↶ בטל שיבוץ · 💬 למה?", en:"↶ Undo assign · 💬 Why?", es:"↶ Deshacer · 💬 ¿Por qué?"}},
  {p:{he:"↶ בטל שיבוץ מחזיר את הטבלה בדיוק למצב שלפני ⚡ האחרון (עד שמירה או מעבר שבוע). 💬 למה? מציג מתחת לכל תא שמולא שורה קצרה עם הסיבה — „הכי מעט השבוע (1 עד כה)”, „מונית בוקר: ציר A (70%)”, „יעד שבועי: YELLOW × 2”. תא ששונה ידנית מאבד את ההסבר שלו.",
      en:"↶ Undo assign puts the table back exactly as before the last ⚡ (until you save or change week). 💬 Why? shows a short reason under each filled cell — “fewest this week (1 so far)”, “Morning taxi: axis A (70%)”, “weekly target: YELLOW × 2”. A cell changed by hand loses its reason.",
      es:"↶ Deshacer devuelve la tabla exactamente a como estaba antes del último ⚡ (hasta guardar o cambiar de semana). 💬 ¿Por qué? muestra bajo cada celda llenada una línea con el motivo. Una celda cambiada a mano pierde su motivo."}},
  {h:{he:"4. בדיקה: ⚖️ איזון השבוע וסימן התקינות", en:"4. Checking: ⚖️ weekly balance and the status badge", es:"4. Revisión: ⚖️ equilibrio y la insignia de estado"}},
  {p:{he:"מתחת לטבלה — ⚖️ איזון השבוע: לכל תפקיד כמה פעמים כל עובד מילא אותו (בזוג — כל שם לחוד). שורה כתומה = הפרש גדול מאחד. למעלה — ✓ תקין או ⚠️ עם מספר; לחיצה פותחת את רשימת ההערות. ❌ אדום = כנראה טעות (עובד משובץ ביום חופשה); צהוב = הערה בלבד (יעד שלא הושג). שום הערה לא חוסמת שמירה.",
      en:"Under the table — ⚖️ This week's balance: for each role, how many times each worker held it (pairs count each name). An orange line = a gap above one. At the top — ✓ OK or ⚠️ with a count; tapping it opens the notes. ❌ red = probably a mistake (someone placed on a vacation day); yellow = a note only (a missed target). No note blocks saving.",
      es:"Bajo la tabla — ⚖️ Equilibrio: para cada puesto, cuántas veces lo tuvo cada trabajador (en pareja cuenta cada nombre). Línea naranja = diferencia mayor que uno. Arriba — ✓ o ⚠️ con un número; tocarla abre las notas. ❌ rojo = probable error; amarillo = solo una nota. Ninguna nota impide guardar."}},
  {h:{he:"5. 💾 שמירה", en:"5. 💾 Saving", es:"5. 💾 Guardar"}},
  {p:{he:"לחץ 💾 שמור. הסידור נכנס לארכיון, לסטטיסטיקה ולהיסטוריה שהשיבוץ לומד ממנה. נקודה כתומה ליד הכפתור = יש שינויים שלא נשמרו. 🗑 נקה מרוקן את השבוע (ומחזיר את השיבוצים הקבועים).",
      en:"Tap 💾 Save. The schedule goes into the archive, the statistics and the history Auto Assign learns from. An orange dot by the button = unsaved changes. 🗑 Clear empties the week (and puts the fixed assignments back).",
      es:"Toca 💾 Guardar. El horario entra al archivo, a las estadísticas y al historial del que aprende la asignación. Un punto naranja = cambios sin guardar. 🗑 Limpiar vacía la semana (y repone las asignaciones fijas)."}},
  {h:{he:"צבעי השורות", en:"Row colours", es:"Colores de las filas"}},
  {p:{he:"כל תפקיד צבוע בצבע הקבוצה שמאיישת אותו; רכב מיוחד (YELLOW) מודגש בצהוב.", en:"Each role is coloured with its group's colour; the special vehicle (YELLOW) is highlighted in yellow.", es:"Cada puesto lleva el color de su grupo; el vehículo especial (YELLOW) va resaltado en amarillo."}}
 ]},
/* ─────────────────────────────────────────────────────────────────── */
{id:"print", icon:"🖨️", title:{he:"הדפסה, PDF, אקסל ושליחה לעובדים", en:"Print, PDF, Excel and sending to workers", es:"Imprimir, PDF, Excel y enviar a trabajadores"},
 blocks:[
  {h:{he:"🖨️ תצוגת ההדפסה", en:"🖨️ The print view", es:"🖨️ La vista de impresión"}},
  {p:{he:"🖨️ הדפסה פותחת תצוגה עם הגדרות למעלה, ומתחתיהן הדף עצמו בגודל אמיתי. בכל מצב הטבלה נמתחת — גודל האותיות וגובה השורות — כך שתמלא את כל הדף, והכול נשאר תמיד על דף אחד.",
      en:"🖨️ Print opens a view with settings on top and the sheet itself, at real size, below. In every mode the table stretches — type size and row height — to fill the whole page, and everything always stays on one page.",
      es:"🖨️ Imprimir abre una vista con ajustes arriba y la hoja misma, a tamaño real, debajo. En todos los modos la tabla se estira — tamaño de letra y alto de filas — para llenar toda la hoja, y todo queda siempre en una sola página."}},
  {li:[
    {he:"סידור מלא — עותק אחד שתופס את כל דף ה-A4.", en:"Full schedule — one copy filling the whole A4 page.", es:"Horario completo — una copia que llena toda la hoja A4."},
    {he:"סידורים מרובים ← לפי מספר עותקים (1–8): המערכת בוחרת את החלוקה (למשל 2×2, 2×3) שנותנת את האותיות הגדולות ביותר.", en:"Several copies → by number of copies (1–8): the app picks the grid (e.g. 2×2, 2×3) that gives the largest type.", es:"Varias copias → por número de copias (1–8): la app elige la cuadrícula (p. ej. 2×2, 2×3) que da la letra más grande."},
    {he:"סידורים מרובים ← לפי גודל (ס״מ): כותבים רוחב וגובה לכל עותק, והמערכת מרצפת את הדף בכמה שנכנסים, ומסובבת את הדף לכיוון שמכיל הכי הרבה — למשל 13×9 ס״מ = 2 × 2 = 4 (לרוחב), 9×6 ס״מ = 3 × 3 = 9. השורה שליד השדות אומרת כמה יצא ובאיזה כיוון. דף A4 הוא 21×29.7 ס״מ, ולכן לגודל גדול נכנסים מעט עותקים.", en:"Several copies → by size (cm): type a width and height per copy, and the app tiles the page with as many as fit, turning the page the way that holds the most — e.g. 13×9 cm = 2 × 2 = 4 (landscape), 9×6 cm = 3 × 3 = 9. The line next to the fields says how many and which way. A4 is 21×29.7 cm, so a large size fits few copies.", es:"Varias copias → por tamaño (cm): escribe ancho y alto por copia, y la app llena la hoja con todas las que entren, girando la hoja hacia donde caben más — p. ej. 13×9 cm = 2 × 2 = 4 (horizontal), 9×6 cm = 3 × 3 = 9. La línea junto a los campos dice cuántas y en qué sentido. A4 mide 21×29,7 cm, así que un tamaño grande deja pocas copias."},
    {he:"לאורך / לרוחב — כיוון הדף. „לרוחב” מודפס כתמונה מסובבת על דף רגיל — הדף יוצא מלא; מסובבים את הנייר כדי לקרוא. קו מקווקו בין העותקים הוא קו החיתוך.", en:"Portrait / landscape — the page direction. “Landscape” prints as a turned picture on an ordinary page — the page comes out full; turn the paper to read it. A dashed line between copies is the cutting line.", es:"Vertical / horizontal — la orientación. “Horizontal” se imprime como imagen girada en una hoja normal — la hoja sale llena; gira el papel para leerla. La línea discontinua entre copias es la línea de corte."}]},
  {p:{he:"🖨️ הדפסה מדפיס תמונה מדויקת של הדף, שמוקטנת לבד אם המדפסת או האייפד מוסיפים שוליים — כך שום חלק לא נדחף לדף שני. הכפתור פעיל אחרי שנייה-שתיים, כשהדף מוכן. ✕ סגור חוזר לסידור. ההגדרות נשמרות במכשיר.",
      en:"🖨️ Print prints an exact picture of the sheet, which shrinks by itself if the printer or iPad adds margins — so nothing is pushed onto a second page. The button is active after a second or two, when the sheet is ready. ✕ Close returns to the schedule. Settings are kept on the device.",
      es:"🖨️ Imprimir imprime una imagen exacta de la hoja, que se achica sola si la impresora o el iPad agregan márgenes — así nada pasa a una segunda página. El botón se activa tras uno o dos segundos, cuando la hoja está lista. ✕ Cerrar vuelve al horario. Los ajustes quedan en el dispositivo."}},
  {h:{he:"📄 שמור PDF", en:"📄 Save PDF", es:"📄 Guardar PDF"}},
  {p:{he:"באותה תצוגה. הקובץ מוכן שנייה-שתיים אחרי פתיחת התצוגה (עד אז הכפתור כתוב „מכין PDF…”). באייפד נפתח תפריט שיתוף — „שמור בקבצים”, הדפסה או וואטסאפ; במחשב/אנדרואיד הקובץ יורד. שינית כיוון או עותקים — קובץ חדש מוכן לבד.",
      en:"In the same view. The file is ready a second or two after the view opens (until then the button reads “Preparing PDF…”). On an iPad the share menu opens — “Save to Files”, print or WhatsApp; on a computer/Android the file downloads. Changed direction or copies — a new file is prepared by itself.",
      es:"En la misma vista. El archivo está listo uno o dos segundos después de abrirla (hasta entonces dice “Preparando PDF…”). En iPad se abre el menú compartir — “Guardar en Archivos”, imprimir o WhatsApp; en computadora/Android se descarga. Si cambias orientación o copias, se prepara uno nuevo solo."}},
  {h:{he:"📤 ייצוא Excel", en:"📤 Excel export", es:"📤 Exportar a Excel"}},
  {p:{he:"מוריד קובץ CSV שנפתח נכון בעברית באקסל. שמות הימים בשפה שנבחרה.", en:"Downloads a CSV that opens correctly in Excel. Day names come in the chosen language.", es:"Descarga un CSV que abre bien en Excel. Los días salen en el idioma elegido."}},
  {h:{he:"📲 שלח לעובדים", en:"📲 Send to workers", es:"📲 Enviar a trabajadores"}},
  {steps:[
    {he:"לחץ 📲 שלח לעובדים — נפתחת רשימה מעל הטבלה, עם דגל השפה של כל עובד.", en:"Tap 📲 Send to workers — a list opens above the table, with each worker's language flag.", es:"Toca 📲 Enviar a trabajadores — se abre una lista sobre la tabla, con la bandera del idioma de cada uno."},
    {he:"לחץ 📲 שלח ליד עובד. נפתח תפריט השיתוף עם הודעה שבה רק השבוע שלו: לכל יום השעות ואיפה הוא, או חופשה / נסיעה / פנוי / חג.", en:"Tap 📲 Send next to a worker. The share menu opens with a message holding only their week: per day the hours and where they are, or vacation / trip / off / holiday.", es:"Toca 📲 Enviar junto a un trabajador. Se abre el menú compartir con un mensaje solo con su semana: por día el horario y dónde está, o vacaciones / viaje / libre / feriado."},
    {he:"בחר וואטסאפ ואת העובד ושלח. מי שנשלח לו מסומן ✓ עד שבוע חדש.", en:"Pick WhatsApp and the worker and send. Those sent are marked ✓ until a new week.", es:"Elige WhatsApp y al trabajador y envía. A quien enviaste queda marcado ✓ hasta una semana nueva."}]},
  {tip:{he:"שפת ההודעה נקבעת לכל קבוצה: ⚙️ הגדרות ← 👤 קבוצות עובדים ← שפת ההודעות לעובדים.", en:"The message language is set per group: ⚙️ Settings → 👤 Employee groups → message language.", es:"El idioma se fija por grupo: ⚙️ Ajustes → 👤 Grupos → idioma de los mensajes."}}
 ]},
/* ─────────────────────────────────────────────────────────────────── */
{id:"vacation", icon:"🏖", title:{he:"חופשות ונסיעות", en:"Vacations and trips", es:"Vacaciones y viajes"},
 blocks:[
  {p:{he:"חופשה — העובד לא זמין, והיום יורד מתקציב החופשה. נסיעה — העובד תפוס במשימה אחרת; לא משובץ, אבל לא יורד מהתקציב. שתיהן מוציאות אותו מהשיבוץ באותו יום.",
      en:"Vacation — the worker is unavailable and the day comes off the vacation budget. Trip — busy elsewhere; not placed, but not taken off the budget. Both keep them out of that day's assignment.",
      es:"Vacaciones — no disponible y el día se descuenta del presupuesto. Viaje — ocupado en otra cosa; no se asigna, pero no se descuenta. Ambas lo excluyen de la asignación de ese día."}},
  {h:{he:"🏖 לוח החופשות — לכמה ימים, מראש", en:"🏖 The absence calendar — several days, ahead", es:"🏖 El calendario — varios días, por adelantado"}},
  {steps:[
    {he:"⚙️ הגדרות ← 🏖 לוח חופשות.", en:"⚙️ Settings → 🏖 Absence calendar.", es:"⚙️ Ajustes → 🏖 Calendario de ausencias."},
    {he:"בחר עובד, חופשה או נסיעה, „מ־” ו„עד” (לחיצה על השדה פותחת לוח שנה).", en:"Pick the worker, vacation or trip, “From” and “To” (tapping the field opens a calendar).", es:"Elige trabajador, vacaciones o viaje, “Desde” y “Hasta” (tocar el campo abre un calendario)."},
    {he:"לחץ ➕ הוסף. סיום לפני התחלה — לא יישמר.", en:"Tap ➕ Add. An end before the start is refused.", es:"Toca ➕ Añadir. Un final antes del inicio se rechaza."}]},
  {p:{he:"החופשה נכנסת לבד לשורות החופשה/נסיעה בכל שבוע שהיא נופלת בו — כשנוצר שבוע, כשפותחים שבוע קיים, ומיד בשבוע הפתוח. סימון ידני לא נמחק; מחיקת רשומה מהלוח לא מסירה סימונים שכבר נכנסו (מורידים ב-✕).",
      en:"It lands by itself in the away rows of every week it falls in — when a week is created, when an existing week is opened, and at once in the open week. Hand marks are never removed; deleting an entry does not remove marks already placed (remove them with ✕).",
      es:"Entra sola en las filas de ausencia de cada semana en que cae — al crear una semana, al abrir una existente y al momento en la semana abierta. Las marcas a mano nunca se borran; borrar una entrada no quita marcas ya puestas (se quitan con ✕)."}},
  {h:{he:"סימון ידני בשבוע", en:"Marking by hand in the week", es:"Marcar a mano en la semana"}},
  {p:{he:"שתי השורות האחרונות בטבלה הן תגיות: לחיצה על התא פותחת רשימת עובדים עם תיבות סימון; ✕ על תגית מסירה. סמן לפני ⚡ — שיבוץ שכבר נעשה לא מתעדכן לבד.",
      en:"The last two rows of the table are tags: tapping a cell opens the workers with checkboxes; ✕ on a tag removes it. Mark before ⚡ — an assignment already made does not update by itself.",
      es:"Las dos últimas filas son etiquetas: tocar la celda abre los trabajadores con casillas; ✕ en una etiqueta la quita. Marca antes de ⚡ — una asignación ya hecha no se actualiza sola."}},
  {tip:{he:"מעל מגבלת ההיעדרות היומית, או עובד בחופשה ובנסיעה באותו יום — תופיע הערה ⚠️. היא לא חוסמת.",
        en:"Above the daily absence cap, or someone on vacation and a trip the same day — a ⚠️ note appears. It does not block.",
        es:"Sobre el límite diario de ausencias, o alguien de vacaciones y de viaje el mismo día — aparece una nota ⚠️. No bloquea."}}
 ]},
/* ─────────────────────────────────────────────────────────────────── */
{id:"archive", icon:"📁", title:{he:"ארכיון וגיבוי", en:"Archive and backup", es:"Archivo y copia de seguridad"},
 blocks:[
  {p:{he:"הסידורים השמורים מקובצים לפי חודש. טען — מחזיר סידור לעריכה; CSV — ייצוא; 🗑 — מחיקה (עם אישור).",
      en:"Saved schedules are grouped by month. Load — brings a schedule back for editing; CSV — export; 🗑 — delete (with confirmation).",
      es:"Los horarios guardados se agrupan por mes. Cargar — lo devuelve para editar; CSV — exportar; 🗑 — borrar (con confirmación)."}},
  {h:{he:"📤 גיבוי הכול / 📥 שחזור מגיבוי", en:"📤 Backup all / 📥 Restore from backup", es:"📤 Copia completa / 📥 Restaurar"}},
  {p:{he:"גיבוי הכול מוריד קובץ אחד עם כל ההגדרות וכל הסידורים. שחזור מקובץ דורס את כל מה שיש במכשיר — ודא שזה הקובץ הנכון. גבה מדי פעם ולפני כל שינוי גדול או החלפת מכשיר.",
      en:"Backup all downloads one file with every setting and every schedule. Restoring from a file replaces everything on the device — make sure it is the right file. Back up now and then and before any big change or device swap.",
      es:"Copia completa descarga un archivo con todos los ajustes y horarios. Restaurar reemplaza todo en el dispositivo — asegúrate de que sea el archivo correcto. Haz copia de vez en cuando y antes de cambios grandes o de cambiar de dispositivo."}},
  {warn:{he:"קובץ הגיבוי מכיל את כל הנתונים — שלח אותו רק לעצמך.", en:"The backup file holds all the data — send it only to yourself.", es:"El archivo de copia tiene todos los datos — envíalo solo a ti mismo."}}
 ]},
/* ─────────────────────────────────────────────────────────────────── */
{id:"stats", icon:"📊", title:{he:"סטטיסטיקה", en:"Statistics", es:"Estadísticas"},
 blocks:[
  {p:{he:"בוחרים תקופה — שבוע נוכחי, חודש או שנה — ורואים: כמה פעמים כל עובד מילא כל תפקיד, ניצול ימי חופשה מול התקציב, וחלוקת הערכים בכל שורה. מספר אדום בסה״כ = רחוק יותר מ-20% מהממוצע. אפשר לייצא ל-CSV.",
      en:"Pick a period — current week, month or year — and see how many times each worker held each role, vacation days used against the budget, and how values spread in each row. A red total = more than 20% from the average. CSV export available.",
      es:"Elige un período — semana, mes o año — y ves cuántas veces cada trabajador tuvo cada puesto, vacaciones usadas frente al presupuesto y el reparto de valores. Un total en rojo = más de 20% del promedio. Exportable a CSV."}},
  {h:{he:"איך לקרוא איזון", en:"Reading the balance", es:"Leer el equilibrio"}},
  {p:{he:"עובדים מאוזנים כבר בתוך כל שבוע (הפרש של עד אחד). ערכים אחרים — שעות, צירים, נקודות הגעה — מתאזנים לאורך זמן לפי 90 הימים האחרונים, ולכן בודקים אותם ברמת חודש או שנה. פער שנשאר גם בשנה מצביע כמעט תמיד על הגדרה: חופשות ארוכות, יעד שבועי או אחוז שנשכח.",
      en:"Workers are balanced within each week already (a gap of at most one). Other values — times, axes, arrival points — balance over time from the last 90 days, so check them by month or year. A gap that stays over a year almost always points to a setting: long vacations, a weekly target or a forgotten share.",

{id:"faq", icon:"❓", title:{he:"שאלות נפוצות", en:"Frequently asked questions", es:"Preguntas frecuentes"},
 blocks:[
  {qa:[
   {q:{he:"האם הנתונים שלי מאובטחים?", en:"Is my data safe?", es:"¿Están seguros mis datos?"},
    a:{he:"הם נמצאים רק במכשיר; שום דבר לא נשלח לשרת. האתר מוגן בסיסמה, חוסם שליחת מידע לאתרים אחרים ומוסתר ממנועי חיפוש.", en:"They live only on the device; nothing goes to a server. The site is password-protected, blocks sending data to other sites and is hidden from search engines.", es:"Viven solo en el dispositivo; nada va a un servidor. El sitio tiene contraseña, bloquea el envío de datos a otros sitios y está oculto a los buscadores."}},
   {q:{he:"שכחתי את הסיסמה לאתר.", en:"I forgot the site password.", es:"Olvidé la contraseña del sitio."},
    a:{he:"הנתונים לא נמחקים. במכשיר שזוכר אותך: ⚙️ הגדרות ← 🔒 צור קוד לסיסמה חדשה ושלח אותו למי שמתחזק את האתר. אחרת — בקש ממנו להחליף או להסיר את הנעילה.", en:"No data is lost. On a device that remembers you: ⚙️ Settings → 🔒 make a code for a new password and send it to whoever maintains the site. Otherwise ask them to replace or remove the lock.", es:"No se pierden datos. En un dispositivo que te recuerda: ⚙️ Ajustes → 🔒 crea un código para una contraseña nueva y envíalo a quien mantiene el sitio. Si no, pídele que cambie o quite el bloqueo."}},
   {q:{he:"למה עובד מסוים קיבל תפקיד מסוים?", en:"Why did a worker get a certain role?", es:"¿Por qué un trabajador recibió cierto puesto?"},
    a:{he:"אחרי ⚡ לחץ 💬 למה? — מתחת לכל תא תופיע הסיבה.", en:"After ⚡ tap 💬 Why? — the reason appears under each cell.", es:"Después de ⚡ toca 💬 ¿Por qué? — el motivo aparece bajo cada celda."}},
   {q:{he:"שיבוץ קבוע לא הופיע.", en:"A fixed assignment did not show.", es:"Una asignación fija no apareció."},
    a:{he:"הוא נכנס לשבועות חדשים ול-🗑 נקה, לא לשבוע שכבר פתוח. אם העובד בחופשה באותו יום — התא נשאר ריק בכוונה ותופיע הערה 📌.", en:"It goes into new weeks and 🗑 Clear, not into a week already open. If the worker is away that day, the cell stays empty on purpose and a 📌 note appears.", es:"Entra en semanas nuevas y en 🗑 Limpiar, no en una semana ya abierta. Si el trabajador falta ese día, la celda queda vacía a propósito y aparece una nota 📌."}},
   {q:{he:"כפתור ה-PDF לא לחיץ.", en:"The PDF button is greyed out.", es:"El botón PDF no se puede tocar."},
    a:{he:"הקובץ עוד בהכנה — חכה שנייה-שתיים עד שהכיתוב יחזור ל-„📄 שמור PDF”.", en:"The file is still being prepared — wait a second or two until it reads “📄 Save PDF” again.", es:"El archivo aún se prepara — espera uno o dos segundos hasta que vuelva a decir “📄 Guardar PDF”."}},
   {q:{he:"מחקתי שורה בטעות.", en:"I deleted a row by mistake.", es:"Borré una fila por error."},
    a:{he:"שחזר מגיבוי אם יש; אחרת צור אותה מחדש ב-🏷️ שורות ותוויות.", en:"Restore from a backup if you have one; otherwise create it again in 🏷️ Rows & labels.", es:"Restaura una copia si la tienes; si no, créala de nuevo en 🏷️ Filas y etiquetas."}},

    a:{he:"מחק את שמו מרשימת העובדים בהגדרות. הסידורים הישנים נשארים כמו שהם.", en:"Delete their name from the workers list in Settings. Old schedules stay as they are.", es:"Borra su nombre de la lista en Ajustes. Los horarios viejos quedan como están."}},
   {q:{he:"אפשר לעבוד בלי אינטרנט?", en:"Can I work offline?", es:"¿Puedo trabajar sin internet?"},
    a:{he:"כן. אחרי הכניסה הראשונה הכול עובד גם בלי חיבור; עדכון גרסה דורש אינטרנט.", en:"Yes. After the first visit everything works offline; a version update needs internet.", es:"Sí. Tras la primera visita todo funciona sin conexión; actualizar la versión necesita internet."}}]}

function gt(o){ return (o&&(o[S.lang]||o.he))||""; }
function viewGuide(){
  let h=`<h2>${t("nav_guide")}</h2>
    <div class="card guide-lead">${t("guide_lead")}</div>`;
  GUIDE.forEach((ch,i)=>{
    h+=`<details class="sect guide-ch" data-guide="${esc(ch.id)}" ${ch.id==="start"?"open":""}>
      <summary><span class="g-ico">${ch.icon}</span>${esc(gt(ch.title))}</summary>
      <div class="inner guide-body">`;
    ch.blocks.forEach(b=>{
      if(b.h) h+=`<h3>${esc(gt(b.h))}</h3>`;
      else if(b.p) h+=`<p>${esc(gt(b.p))}</p>`;
      else if(b.li) h+=`<ul>${b.li.map(x=>`<li>${esc(gt(x))}</li>`).join("")}</ul>`;
      else if(b.steps) h+=`<ol class="g-steps">${b.steps.map(x=>`<li>${esc(gt(x))}</li>`).join("")}</ol>`;
      else if(b.tip) h+=`<p class="g-tip">${esc(gt(b.tip))}</p>`;
      else if(b.warn) h+=`<p class="g-warn">${esc(gt(b.warn))}</p>`;
      else if(b.qa) h+=b.qa.map(x=>
        `<div class="g-qa"><b>${esc(gt(x.q))}</b><p>${esc(gt(x.a))}</p></div>`).join("");
    });
    h+=`</div></details>`;
  });
  return h;
}

/* ═══════════════ messages to workers ═══════════════ */
/* Each worker gets their own week only — day, hours, where they are, or that
   they are off — in their group's language. WhatsApp cannot be sent to by a
   web page, so the text goes through the share sheet (iPad / Android), or
   opens WhatsApp with the text ready where there is no share sheet. */
function workerLang(name){
  const g=activeGroups().find(x=>groupEmps(x.id).includes(name));
  return (g&&g.lang)||"he";
}
function workerMessage(name){
  const saved=S.lang; S.lang=workerLang(name);
  try{
    const keys=Object.keys(S.days).sort();
    const lines=[`🚕 ${t("app_title")} — ${fmtDM(keys[0])}–${fmtDM(keys[keys.length-1])}`, name, ""];
    keys.forEach(k=>{
      const day=S.days[k], head=`${dayLabel(k)} ${fmtDM(k)}`;
      if(isHolidayDay(day)){ lines.push(`${head} · ${t("msg_holiday")}`); return; }
      if(awayList(day,"vacation").includes(name)){ lines.push(`${head} · ${t("cal_vac")}`); return; }
      if(awayList(day,"trip").includes(name)){ lines.push(`${head} · ${t("cal_trip")}`); return; }
      const where=[];
      allSections().forEach(x=>{
        if(String(day[x.sec.row_key]||"").split("+").includes(name)){
          const w=wpName(x.wp); if(!where.includes(w)) where.push(w); } });
      if(day.other_empl===name) where.push(rowLabel("other_empl"));
      if(!where.length){ lines.push(`${head} · ${t("msg_free")}`); return; }
      lines.push([head, valueLabel(day.work_hours), where.join(", ")].filter(Boolean).join(" · "));
    });
    return lines.join("\n");
  } finally { S.lang=saved; }
}
function sendPanel(){
  if(!S.sendOpen||!S.days) return "";
  S.sent=S.sent||{};
  return `<div class="card send-panel"><b>${t("send_title")}</b><div class="hint">${t("send_hint")}</div>`+
    activeGroups().map(g=>groupEmps(g.id).map(e=>`<div class="send-row" style="background:${esc(g.color||"#fff")}"
        ${S.sent[e]?"data-sent":""}><span>${esc(e)} ${({he:"🇮🇱",en:"🇺🇸",es:"🇪🇸"})[workerLang(e)]||""}</span>
        <span>${S.sent[e]?"✓ ":""}<button class="btn small primary" data-send="${esc(e)}">📲 ${t("send_one")}</button></span></div>`).join("")).join("")+
    `</div>`;
}
function markSent(name){
  S.sent=S.sent||{}; S.sent[name]=true;
  const b=document.querySelector(`[data-send="${CSS.escape(name)}"]`);
  const row=b&&b.closest(".send-row");
  if(row&&!row.hasAttribute("data-sent")){ row.setAttribute("data-sent",""); b.insertAdjacentText("beforebegin","✓ "); }
}
function sendToWorker(name){
  const text=workerMessage(name);
  if(navigator.share){
    /* called straight from the tap — Safari refuses it after any waiting */
    navigator.share({text}).then(()=>markSent(name)).catch(()=>{});
    return;
  }
  window.open("https://wa.me/?text="+encodeURIComponent(text),"_blank");
  markSent(name);
}

function scheduleCsv(days){

function statsCsv(st,label){

/* ── print preview ────────────────────────────────────────────────────────
   A screen, not a straight window.print(): the page size and orientation are
   settled before the browser dialog opens, because a browser cannot be talked
   out of its own default once it is up. */
/* The print settings belong to the print view: they are decisions about one
   sheet of paper, not about the station, so they live on the device and not
   in the config. */
const PRINT_DEFAULTS={ mode:"single", by:"count", copies:4, w:9, h:6, orientation:"portrait" };
/* A4 in millimetres, and the margin each mode prints with */
const A4={ portrait:[210,297], landscape:[297,210] };
/* 8mm is a comfortable margin for a portrait sheet; landscape and a sheet of
   copies both want every millimetre of width they can get */
function pageMargin(mode,orient){ return (mode==="multi"||orient==="landscape")?5:8; }
/* The sheet a copy has to share. Gaps between copies come out of it. */
function sheetBox(ps){
  const [w,h]=A4[ps.orientation], m=pageMargin(ps.mode,ps.orientation);
  return { w:w-2*m, h:h-2*m };
}
/* ── laying out the sheet ──────────────────────────────────────────────
   A sheet is the page less its margins. Copies sit in a grid with a 3 mm
   gap (the cut line runs through it). "By count": the grid that gives each
   copy the largest type wins — the copies then fill the sheet. "By size":
   every copy is exactly the size asked for, and the sheet is tiled with as
   many as fit. Either way the whole layout stays on one page. */
const PRINT_GAP=3;
function gridCells(box,cols,rows,cw,ch){
  const cells=[];
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++)
    cells.push({x:c*(cw+PRINT_GAP), y:r*(ch+PRINT_GAP), w:cw, h:ch});
  return cells;
}
function pageLayout(ps){
  const box=sheetBox(ps);
  if(ps.mode!=="multi") return {box, cols:1, rows:1, cells:[{x:0,y:0,w:box.w,h:box.h}]};
  if(ps.by==="size"){
    const cw=Math.min(ps.w*10, box.w), ch=Math.min(ps.h*10, box.h);
    const cols=Math.max(1,Math.floor((box.w+PRINT_GAP)/(cw+PRINT_GAP)));
    const rows=Math.max(1,Math.floor((box.h+PRINT_GAP)/(ch+PRINT_GAP)));
    return {box, cols, rows, cells:gridCells(box,cols,rows,cw,ch)};
  }
  const n=ps.copies; let best=null;
  for(let cols=1; cols<=n; cols++){
    const rows=Math.ceil(n/cols);
    const cw=(box.w-PRINT_GAP*(cols-1))/cols, ch=(box.h-PRINT_GAP*(rows-1))/rows;
    const f=fitFont(cw,ch,false), empty=cols*rows-n;
    if(!best||f>best.f+0.05||(Math.abs(f-best.f)<=0.05&&empty<best.empty))
      best={f, empty, cols, rows, cw, ch};
  }
  return {box, cols:best.cols, rows:best.rows,
          cells:gridCells(box,best.cols,best.rows,best.cw,best.ch).slice(0,n)};
}
/* The largest type (pt) at which one copy of the week fits a w×h mm frame,
   found by measuring a hidden copy. Without a week open there is nothing to
   measure, so the frame's own size stands in for it. */
const _fitMemo=new Map();
function fitFont(wmm,hmm,solo){
  if(!S.days) return Math.min(wmm/8,hmm/12);
  const key=(solo?"s":"")+wmm.toFixed(1)+"x"+hmm.toFixed(1)+"|"+JSON.stringify(S.days)+S.lang;
  if(_fitMemo.has(key)) return _fitMemo.get(key);
  const MM=96/25.4, probe=document.createElement("div");
  probe.className="pcopy";
  /* the frame a real copy has — its rule lives under #printArea, which may
     be hidden right now, so the probe carries it inline */
  probe.style.cssText=`position:absolute;left:-10000px;top:0;visibility:hidden;width:${wmm}mm;height:auto;
    box-sizing:border-box;overflow:hidden;${solo?"border:none;padding:0":"border:1pt dashed #999;padding:1mm"}`;
  probe.innerHTML=printTable();
  document.body.appendChild(probe);
  /* it fits when the copy is tall enough AND no value is cut short inside
     its cell — the cells clip with "…", so a too-large type would otherwise
     look like it fits while names lose their ends */
  const cells=[...probe.querySelectorAll(".print-table td:not(.label),.print-table th")];
  const fits=f=>{ probe.style.setProperty("--pt",f+"pt");
    if(probe.scrollHeight>hmm*MM) return false;
    return cells.every(td=>td.scrollWidth<=td.clientWidth+1); };
  let lo=3, hi=24;
  if(!fits(lo)) hi=lo;
  for(let i=0;i<12&&hi-lo>0.05;i++){ const mid=(lo+hi)/2; if(fits(mid)) lo=mid; else hi=mid; }
  probe.remove();
  const f=Math.floor(lo*10)/10;
  if(_fitMemo.size>200) _fitMemo.clear();
  _fitMemo.set(key,f);
  return f;
}
function rawPrintSettings(){
  let saved={};
  try{ saved=JSON.parse(localStorage.getItem("agenda_print")||"{}"); }catch(e){}
  const p={...PRINT_DEFAULTS, ...saved};
  return { mode:p.mode==="multi"?"multi":"single",
           orientation:p.orientation==="landscape"?"landscape":"portrait",
           /* older settings said auto:true/false for count/size */
           by:p.by==="size"||(p.by==null&&p.auto===false)?"size":"count",
           copies:Math.max(1,Math.min(8,parseInt(p.copies,10)||4)),
           w:Math.max(2,Math.min(30,parseFloat(p.w)||9)),
           h:Math.max(2,Math.min(30,parseFloat(p.h)||6)) };
}
function printSettings(){
  const ps=rawPrintSettings();
  /* By size the copy is fixed, so the page turns to whichever way holds more
     of them (13×9 cm: 4 on a landscape sheet, 3 on a portrait one). */
  if(ps.mode==="multi"&&ps.by==="size"){
    const n=o=>pageLayout({...ps, orientation:o}).cells.length;
    const other=ps.orientation==="landscape"?"portrait":"landscape";
    if(n(other)>n(ps.orientation)) ps.orientation=other;
  }
  return ps;
}
function savePrintSettings(ps){
  try{ localStorage.setItem("agenda_print", JSON.stringify(ps)); }catch(e){}
}
/* One copy of the week, built for paper rather than for the screen: its own
   markup, its own class, and every size in points so the printer is told what
   the letters should actually measure. */
function printTable(){
  const keys=Object.keys(S.days).sort();
  const VS=CFG.special_values.vehicle_special;
  /* percentages, not millimetres: the table is told to be the whole page and
     the columns divide it, so landscape fills the sheet instead of leaving a
     strip of white down the side */
  const labelPct=22, colW=((100-labelPct)/keys.length).toFixed(2);
  let h=`<div class="print-head">${esc(t("app_title"))} — ${fmtDM(keys[0])} → ${fmtDM(keys[keys.length-1])}</div>`;
  h+=`<table class="print-table"><colgroup><col style="width:${labelPct}%">`+
     keys.map(()=>`<col style="width:${colW}%">`).join("")+`</colgroup>`;
  h+=`<thead><tr><th>${esc(t("row_dates"))}</th>`;
  keys.forEach(dk=>h+=`<th>${esc(dayLabel(dk))}<br>${fmtDM(dk)}</th>`);
  h+=`</tr></thead><tbody>`;
  for(const rk of reorderableKeys()){
    /* a workplace row carries its group's colour onto the paper */
    const sx=sectionByRow(rk), g=sx?groupById(sx.sec.group_id):null;
    const cls=g?` class="grp" style="--bg:${esc(g.color||"#eee")}"`:"";
    h+=`<tr${cls}><td class="label">${esc(rowLabel(rk))}</td>`;
    h+=keys.map(k=>{
      if(AWAY_ROWS.includes(rk))
        return `<td>${esc(awayList(S.days[k],rk).join(", "))}</td>`;
      const raw=S.days[k][rk]||"", v=valueLabel(raw);
      const y=(rk==="vehicle_morning"||rk==="vehicle_noon")&&raw===VS;
      /* a paired cell may break after the +, so a narrow copy shows both
         names on two lines instead of cutting the second one off */
      return `<td class="${y?"y":""}">${esc(v).replace(/\+/g,"+\u200B")}</td>`;
    }).join("");
    h+=`</tr>`;
  }
  return h+`</tbody></table>`;
}
/* @page cannot be set from a style property, so the rule is rewritten whole */
function applyPageRule(orient,mode){
  let st=document.getElementById("pageStyle");
  if(!st){ st=document.createElement("style"); st.id="pageStyle"; document.head.appendChild(st); }
  /* a full sheet can afford a proper margin; a sheet of small copies wants
     every millimetre it can get */
  /* Always a portrait page: the iPad's print ignores a landscape @page, so a
     landscape sheet is printed as its picture turned a quarter instead —
     the same paper, filled the same way, whatever the printer honours. */
  st.textContent=`@page{size:A4 portrait;margin:${pageMargin(mode,orient)}mm}`;
}
const CM=96/2.54;                          // one centimetre in CSS pixels
function paintPrintArea(){
  const ps=printSettings(), one=printTable(), L=pageLayout(ps);
  const area=document.getElementById("printArea");
  area.classList.toggle("land", ps.orientation==="landscape");
  const multi=ps.mode==="multi";
  /* the sheet at its real size; each copy at its cell, type fitted to it */
  area.innerHTML=`<div class="sheet${multi?" multi":""}" style="width:${L.box.w}mm;height:${L.box.h}mm">`+
    L.cells.map(c=>`<div class="pcopy${multi?"":" solo"}" style="left:${c.x}mm;top:${c.y}mm;width:${c.w}mm;height:${c.h}mm;
       --pt:${fitFont(c.w,c.h,!multi)}pt">${one}</div>`).join("")+
    `</div><img id="printImg" alt="">`;
  /* stretch each table down to the foot of its copy: rows share the slack */
  const MM=96/25.4;
  area.querySelectorAll(".pcopy").forEach(cp=>{
    const tb=cp.querySelector(".print-table"), cs=getComputedStyle(cp);
    /* from where the table really starts to the copy's inner foot */
    const foot=cp.getBoundingClientRect().bottom-parseFloat(cs.paddingBottom)-parseFloat(cs.borderBottomWidth);
    const room=Math.floor(foot-tb.getBoundingClientRect().top)-1;
    if(room>tb.getBoundingClientRect().height) tb.style.height=room+"px";
  });
}
function closePrint(){
  _pdf.gen++; _pdf.blob=null;               // a preparation still running is dropped
  document.body.classList.remove("printing");

function printInfo(ps){
  if(ps.mode!=="multi") return "";

}
function paintPrintBar(){

        <label>${esc(t("print_h"))}<br>

    ${multi&&ps.by==="size"?"":`<div class="radio-row"><b>${esc(t("print_orient"))}</b>

      <button class="btn" id="printPdf" ${_pdf.blob?"":"disabled"}>${esc(t(_pdf.blob?"pdf_save":"pdf_busy"))}</button></div>`;
  wirePrintBar();

function wirePrintBar(){
  const bar=document.getElementById("printBar");
  const pick=name=>{ const el=bar.querySelector(`input[name="${name}"]:checked`);
                     return el?el.value:null; };
  const read=()=>{
    const num=(id,d)=>{ const el=bar.querySelector("#"+id);
                        return el?parseFloat(el.value)||d:d; };
    const cur=printSettings();
    return { mode:pick("pvMode")==="multi"?"multi":"single",
             orientation:(pick("pvOrient")||rawPrintSettings().orientation)==="landscape"?"landscape":"portrait",
             by:(pick("pvBy")||cur.by)==="size"?"size":"count",
             copies:Math.max(1,Math.min(8,num("pvCopies",cur.copies))),
             w:Math.max(2,Math.min(30,num("pvW",cur.w))),
             h:Math.max(2,Math.min(30,num("pvH",cur.h))) };
  };
  const apply=(repaintBar)=>{
    const ps=read();
    savePrintSettings(ps);
    applyPageRule(ps.orientation, ps.mode);
    if(repaintBar) paintPrintBar();
    else { const el=bar.querySelector("#pvInfo"); if(el) el.textContent=printInfo(printSettings()); }
    paintPrintArea();
    preparePdf();
  };
  /* these change which fields exist, so they redraw the panel */
  bar.querySelectorAll('input[name="pvMode"],input[name="pvOrient"],input[name="pvBy"]')
    .forEach(r=>r.onchange=()=>apply(true));
  /* typing a number redraws the sheet only, so the field keeps its focus */
  ["pvCopies","pvW","pvH"].forEach(id=>{
    const el=bar.querySelector("#"+id);
    if(el) el.oninput=el.onchange=()=>apply(false);
  });
  bar.querySelector("#printGo").onclick=()=>window.print();
  bar.querySelector("#printPdf").onclick=savePdf;
  bar.querySelector("#printClose").onclick=closePrint;
}
/* ── a real PDF file ──────────────────────────────────────────────────────
   The iPad's print dialog has no "save as PDF" the way Android's does, so the
   print view can also hand over a PDF file of exactly what it shows. The
   sheet is drawn to an image (html2canvas) and placed on an A4 page (jsPDF);
   both libraries live in vendor/ and are cached for offline use like the
   rest of the app. They load on the first tap, not with the page. */
function loadScript(src){
  return new Promise((ok,fail)=>{
    if(document.querySelector(`script[data-src="${src}"]`)) return ok();
    const s=document.createElement("script");
    s.src=src; s.dataset.src=src; s.onload=()=>ok(); s.onerror=()=>fail(new Error(src));
    document.head.appendChild(s);
  });
}
/* the sheet as an image, laid out at the width of the paper rather than of
   the screen: on a tablet the preview is narrower than A4 and long cells
   would be cut. 2.5× is about 250 dpi on A4 — sharp on paper, small enough
   to send in a chat. */
async function renderSheetCanvas(boxW){
  await loadScript("vendor/html2canvas.min.js");
  const sheet=document.querySelector("#printArea .sheet");
  if(!sheet) throw new Error("no sheet");
  return html2canvas(sheet,{scale:2.5, backgroundColor:"#ffffff", logging:false,
    windowWidth:Math.max(window.innerWidth, Math.ceil(boxW*CM/10)+60),
    onclone:doc=>{
      const s=doc.querySelector("#printArea .sheet");
      if(s){ s.style.maxWidth="none"; }
      const im=doc.getElementById("printImg"); if(im) im.remove();
      const area=doc.getElementById("printArea");
      if(area){ area.style.overflow="visible"; area.style.width="auto"; }
    }});
}
async function buildSchedulePdf(){
  await loadScript("vendor/jspdf.umd.min.js");
  const ps=printSettings();
  const land=ps.orientation==="landscape";
  const pdf=new jspdf.jsPDF({orientation:land?"landscape":"portrait", unit:"mm", format:"a4"});
  const [pw,ph]=land?[297,210]:[210,297], m=pageMargin(ps.mode,ps.orientation);
  const boxW=pw-2*m, boxH=ph-2*m;
  const canvas=await renderSheetCanvas(boxW);
  /* as large as the page allows, never stretched out of shape */
  const k=Math.min(boxW/canvas.width, boxH/canvas.height);
  const w=canvas.width*k, h=canvas.height*k;
  _pdf.img=canvas.toDataURL("image/jpeg",0.92);
  pdf.addImage(_pdf.img,"JPEG", m+(boxW-w)/2, m, w, h);
  /* the picture that prints: a landscape sheet turned to stand on a portrait page */
  if(land){
    const r=document.createElement("canvas"); r.width=canvas.height; r.height=canvas.width;
    const cx=r.getContext("2d"); cx.translate(r.width,0); cx.rotate(Math.PI/2); cx.drawImage(canvas,0,0);
    _pdf.printImg=r.toDataURL("image/jpeg",0.92);
  } else _pdf.printImg=_pdf.img;
  return pdf.output("blob");
}
/* Safari opens the share sheet only straight out of a tap: making the PDF
   first (seconds on a tablet) and sharing after it lost the tap, so Safari
   refused and nothing was saved. The PDF is therefore made in the
   background as soon as the print view opens, and again whenever its
   settings change; the tap then hands over a file that is already there. */
let _pdf={gen:0, blob:null, promise:null};
function preparePdf(){
  const gen=++_pdf.gen;
  _pdf.blob=null;
  paintPdfButton();
  const run=new Promise(r=>setTimeout(r,250))           // let a burst of changes settle
    .then(()=>gen===_pdf.gen&&document.body.classList.contains("printing")?buildSchedulePdf():null)
    .then(blob=>{ if(gen===_pdf.gen&&blob){ _pdf.blob=blob;
        const im=document.getElementById("printImg"); if(im) im.src=_pdf.printImg;
        paintPdfButton(); } return blob; })
    .catch(e=>{ console.error(e); return null; });
  _pdf.promise=run;
  return run;
}
/* the newest preparation, whatever started it */
async function pdfPrepared(){
  let p;
  do{ p=_pdf.promise; await p; } while(p!==_pdf.promise);
  return _pdf.blob;
}
function paintPdfButton(){
  const btn=document.getElementById("printPdf");
  if(!btn) return;
  btn.disabled=!_pdf.blob;
  btn.textContent=t(_pdf.blob?"pdf_save":"pdf_busy");
  /* printing prints the prepared page image, so it waits for it too */
  const go=document.getElementById("printGo"); if(go) go.disabled=!_pdf.blob;
}
function downloadPdf(blob,name){
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  toast("✅ "+t("pdf_ready"));
}
function savePdf(){
  const blob=_pdf.blob;
  if(!blob){ toast(t("pdf_busy")); return Promise.resolve(); }
  const wk=Object.keys(S.days).sort()[0];
  const name=`schedule_${wk}.pdf`;
  const file=new File([blob],name,{type:"application/pdf"});
  logAction("export_excel","log_export_week",{w:wk},{week:wk});
  /* iPad / iPhone: the share sheet — Save to Files, Print, WhatsApp… —
     called synchronously, while the tap still counts */
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    return navigator.share({files:[file], title:name}).catch(e=>{
      if(e&&e.name==="AbortError") return;      // the user closed the sheet
      downloadPdf(blob,name);                   // refused: download it instead
    });
  }
  downloadPdf(blob,name);
  return Promise.resolve();
}
function doPrint(){
  if(!S.days) return;
  const ps0=printSettings();
  applyPageRule(ps0.orientation, ps0.mode);
  document.body.classList.add("printing");
  paintPrintBar();
  paintPrintArea();
  preparePdf();
}

  }
  else if(S.screen==="guide"){

       the native toggle, whose events fire asynchronously and race each other
       when one chapter closes another. */
    document.querySelectorAll("details.guide-ch").forEach(d=>{
      d.querySelector("summary").onclick=ev=>{

  else if(S.screen==="stats"){

      document.body.appendChild(a); a.click(); a.remove();

  const lb=$("langBtns");
  lb.innerHTML=[["he","🇮🇱","עברית"],["en","🇺🇸","English"],["es","🇪🇸","Español"]]
    .map(([lg,fl,name])=>`<button class="lang-btn ${S.lang===lg?"active":""}" data-lang-btn="${lg}" title="${name}" aria-label="${name}">${fl}</button>`).join("");
  lb.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    S.lang=b.dataset.langBtn; localStorage.setItem(LS.lang,S.lang); render(); });
