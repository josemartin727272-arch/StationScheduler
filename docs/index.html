<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F4E79">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>אשר סידור מוניות 🚕</title>
<style>
:root{
  --primary:#1F4E79; --primary-lt:#2E86C1; --accent:#FFC800;
  --bg:#f4f6f9; --card:#ffffff; --text:#1c2733; --muted:#6b7a8c;
  --border:#d7dee6; --danger:#c0392b; --ok:#1e8449; --warn:#b7950b;
  --il:#D6E4F0; --pe:#FAD7A0; --yellow:#fff3bf; --vac:#fadbd8;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--text);
  font-family:-apple-system,"Segoe UI",Roboto,Arial,"Noto Sans Hebrew",sans-serif;font-size:16px}
button,select,input,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:50;background:var(--primary);color:#fff;
  display:flex;align-items:center;gap:8px;padding:10px 14px;flex-wrap:wrap;
  box-shadow:0 2px 6px rgba(0,0,0,.25)}
header h1{font-size:1.15rem;margin:0;flex:1;white-space:nowrap}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);
  color:#fff;border-radius:10px;padding:10px 14px;cursor:pointer;font-size:.95rem;min-height:44px}
nav button.active{background:var(--accent);color:#222;border-color:var(--accent);font-weight:700}
#langBtns{display:flex;gap:6px}
.lang-btn{background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.25);
  border-radius:10px;min-height:44px;min-width:50px;font-size:1.35rem;cursor:pointer;
  line-height:1;padding:4px 8px}
.lang-btn.active{background:var(--accent);border-color:#fff}
main{padding:12px;max-width:1200px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:14px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.row-flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--border);background:#fff;border-radius:10px;
  padding:10px 16px;cursor:pointer;min-height:46px;font-size:.95rem}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600}
.btn.warn{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.small{padding:6px 12px;min-height:44px;font-size:.85rem}
.btn:disabled{opacity:.4;cursor:default}
input[type=date],input[type=text],input[type=number],select,textarea{
  border:1px solid var(--border);border-radius:8px;padding:9px;background:#fff;min-height:44px}
textarea{width:100%;min-height:100px}
h2{font-size:1.1rem;margin:6px 0 12px}
h3{font-size:1rem;margin:14px 0 8px;color:var(--primary)}
.hint{color:var(--muted);font-size:.85rem;margin:4px 0 10px}
/* schedule table */
.tbl-wrap{overflow:auto;max-height:calc(100vh - 215px);border:1px solid var(--border);border-radius:12px;background:#fff}
table.sched{border-collapse:collapse;width:100%;min-width:720px}
table.sched th,table.sched td{border:1px solid var(--border);padding:4px;text-align:center}
table.sched thead th{background:var(--primary);color:#fff;font-size:.85rem;padding:8px 4px;
  position:sticky;top:0;z-index:3}
table.sched thead th:first-child{inset-inline-start:0;z-index:4}
table.sched td.label{background:#eef2f7;font-weight:600;font-size:.83rem;
  text-align:start;padding:4px 8px;white-space:nowrap;position:sticky;inset-inline-start:0;z-index:2}
table.sched select,table.sched input[type=text]{width:100%;min-width:92px;min-height:44px;
  border:1px solid #e3e8ee;background:#fbfcfe}
tr.section td{background:#dde5ee;color:#4a5a6d;font-size:.75rem;padding:3px;font-weight:600}
td.cell-yellow select{background:var(--yellow)}
.msg{border-radius:10px;padding:10px 12px;margin:8px 0;font-size:.92rem}
.msg.err{background:#fdecea;color:var(--danger);border:1px solid #f5b7b1}
.msg.warn{background:#fef9e7;color:#7d6608;border:1px solid #f7dc6f}
.msg.ok{background:#eafaf1;color:var(--ok);border:1px solid #a9dfbf}
/* Warnings live in a drawer off the inline-end edge, never in the schedule
   itself — a yellow strip between the rows was read as part of the week. */
.scrim{position:fixed;inset:0;background:rgba(28,39,51,.38);z-index:60}
.drawer{position:fixed;inset-block:0;inset-inline-end:0;z-index:61;
  width:min(400px,92vw);background:var(--card);display:flex;flex-direction:column;
  border-inline-start:1px solid var(--border);box-shadow:-8px 0 28px rgba(28,39,51,.16);
  transform:translateX(0);animation:drawerIn .18s ease-out}
@keyframes drawerIn{from{transform:translateX(8%);opacity:.4}to{transform:translateX(0);opacity:1}}
@media (prefers-reduced-motion:reduce){.drawer{animation:none}}
.drawer .head{display:flex;align-items:center;gap:10px;padding:14px 16px;
  position:static;background:var(--card);color:var(--text);
  border-block-end:1px solid var(--border);border-block-start:3px solid var(--accent)}
.drawer .head h3{margin:0;font-size:1rem;flex:1;white-space:normal}
.drawer .body{overflow:auto;padding:12px 16px 24px}
.drawer .line{padding:9px 12px;margin-block-end:8px;border-radius:8px;font-size:.9rem;
  line-height:1.5;background:#f8fafc;border-inline-start:3px solid var(--muted)}
.drawer .line.err{background:#fdecea;color:var(--danger);border-inline-start-color:var(--danger)}
.drawer .line.warn{background:#fef9e7;color:#7d6608;border-inline-start-color:#f0c000}
.drawer .line.ok{background:#eafaf1;color:var(--ok);border-inline-start-color:var(--ok)}
.badge{cursor:pointer}
/* settings */
details.sect{border:1px solid var(--border);border-radius:12px;background:#fff;margin-bottom:10px}
details.sect>summary{cursor:pointer;padding:14px;font-weight:700;color:var(--primary);
  list-style:none;display:flex;align-items:center;gap:8px}
details.sect>summary::after{content:"▾";margin-inline-start:auto;color:var(--muted)}
details.sect[open]>summary::after{content:"▴"}
details.sect>.inner{padding:0 14px 14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
@media(max-width:700px){.grid2,.grid3{grid-template-columns:1fr}}
.lbl-row{display:grid;grid-template-columns:.9fr 1fr 1fr 1fr 52px;gap:6px;
  margin-bottom:6px;align-items:center}
.lbl-row input:disabled{background:#f2f5f8;color:var(--muted)}
.lbl-head b:last-child{text-align:center;font-size:.8rem;color:var(--muted)}
.del-btn{width:100%;padding:6px 0;min-height:40px}
.del-confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:2px 0 10px}
.cr-opts{display:block;margin:-2px 0 10px;padding-inline-start:8px;
  border-inline-start:3px solid var(--border);font-size:.85rem;color:var(--muted)}
.cr-opts textarea{min-height:56px}
.lbl-row input{min-height:40px;font-size:.88rem}
.orig-lbl{color:var(--muted);font-weight:700;font-size:.85rem;align-self:center;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{border-radius:10px;padding:8px 14px;font-weight:700;min-height:44px;
  display:inline-flex;align-items:center;cursor:pointer;border:1px solid transparent}
.badge.good{background:#eafaf1;color:var(--ok);border-color:#a9dfbf}
.badge.bad{background:#fdecea;color:var(--danger);border-color:#f5b7b1}
.dot{width:10px;height:10px;background:#e67e22;border-radius:50%;
  display:inline-block;margin-inline-start:6px;vertical-align:middle}
/* drag list */
#orderList{list-style:none;margin:0;padding:0;user-select:none}
#orderList li{display:flex;align-items:center;gap:10px;background:#fff;
  border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin-bottom:6px;
  font-size:.92rem;touch-action:none}
#orderList li.dragging{opacity:.5;border-style:dashed;background:#eef6ff}
#orderList .handle{cursor:grab;font-size:1.2rem;color:var(--muted);padding:4px 8px}
#orderList .updown{margin-inline-start:auto;display:flex;gap:4px}
/* archive */
.arch-item{display:flex;align-items:center;gap:8px;padding:10px;border-bottom:1px solid var(--border);flex-wrap:wrap}
.arch-item:last-child{border-bottom:none}
.arch-item .wk{font-weight:600;flex:1;min-width:130px}
/* stats */
table.stats{border-collapse:collapse;width:100%;font-size:.88rem;margin-bottom:14px}
table.stats th,table.stats td{border:1px solid var(--border);padding:6px 8px;text-align:center}
table.stats th{background:#eef2f7}
.bar{background:#e8eef5;border-radius:6px;height:14px;overflow:hidden;min-width:70px}
.bar>i{display:block;height:100%;background:var(--primary-lt)}
.chip{display:inline-block;background:#eef2f7;border-radius:8px;padding:2px 8px;margin:2px;font-size:.85rem}
.pct-box{border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin:10px 0;background:#fbfcfe}
.pct-box>b{display:block;margin-bottom:6px;color:var(--primary)}
.pct-box table.stats{margin-bottom:8px}
.pct-box input[type=number]{width:84px;text-align:center}
.pct-tot{font-weight:800;padding:2px 10px;border-radius:8px}
.pct-tot.ok{color:#fff;background:var(--ok)}
.pct-tot.bad{color:#fff;background:var(--danger)}
.map-inp{width:100%;min-width:120px}
/* landing */
.landing{position:relative;overflow:hidden;background:#fff;border-radius:18px;
  border:1px solid #eee;padding:56px 24px 44px;text-align:center;
  box-shadow:0 2px 14px rgba(0,0,0,.05)}
.landing .lz{position:absolute;border-radius:50%;background:#f5c842;opacity:.15;pointer-events:none}
.lz1{width:150px;height:150px;top:-46px;inset-inline-start:-40px}
.lz2{width:96px;height:96px;top:22px;inset-inline-end:-30px}
.lz3{width:190px;height:190px;bottom:-80px;inset-inline-end:-56px}
.lz4{width:74px;height:74px;bottom:26px;inset-inline-start:-24px}
#homeIcon{cursor:pointer;border-radius:8px;padding:0 2px}
#homeIcon:hover{filter:brightness(1.15)}
#homeIcon:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.l-welcome{color:var(--muted);font-size:.95rem;margin-bottom:10px}
.l-mark{font-size:72px;line-height:1;margin-bottom:14px}
.l-title{font-size:28px;font-weight:500;color:#1a1a1a;margin:0 0 6px}
.l-sub{color:#f5c842;letter-spacing:2px;font-size:.78rem;font-weight:600;margin-bottom:30px}
.l-nav{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:32px;
  position:relative;z-index:1}
.l-pill{background:#fcfcfc;border:.5px solid #ddd;border-radius:50px;color:#333;
  padding:.55rem 1.15rem;font-size:.9rem;cursor:pointer;min-height:44px}
.l-pill:hover,.l-pill:focus-visible{background:#fff8e0;border-color:#f0d98a}
.l-enter{background:#f5c842;color:#1a1a1a;border:none;border-radius:50px;font-weight:500;
  padding:.75rem 2.5rem;font-size:1rem;cursor:pointer;min-height:48px;position:relative;z-index:1}
.l-enter:hover,.l-enter:focus-visible{background:#efbd2c}
@media(max-width:700px){
  .landing{padding:40px 16px 34px}
  .l-mark{font-size:60px} .l-title{font-size:23px}
  .l-pill{width:100%;max-width:280px}
}
/* change log */
.log-tbl td{font-size:.85rem}
.log-tbl tr.lg-save td{background:#eafaf1}
.log-tbl tr.lg-auto td{background:#e8f1fb}
.log-tbl tr.lg-set  td{background:#f0f2f5}
.log-tbl tr.lg-del  td{background:#fdecea}
.log-tbl tr.lg-exp  td{background:#fef8e3}
.log-tbl tr.lg-bak  td{background:#f3ecfa}
.log-tbl tr.lg-trip td{background:#e6f6f4}
/* away rows: a checkbox per employee, several may be ticked */
td.away-cell{padding:3px}
.tagbox{display:flex;flex-wrap:wrap;gap:3px;align-items:center;cursor:pointer;
  border:1px solid #e3e8ee;background:#fbfcfe;border-radius:8px;
  padding:3px 5px;min-height:44px}
.tagbox:hover{border-color:var(--primary-lt)}
.tag{display:inline-flex;align-items:center;gap:3px;height:20px;border-radius:10px;
  font-size:11px;padding:0 3px 0 7px;white-space:nowrap}
[dir=rtl] .tag{padding:0 7px 0 3px}
.tag-trip{background:#e8f4fd;color:#1565c0}
.tag-vac{background:#fff3e0;color:#e65100}
.tag-x{border:none;background:rgba(0,0,0,.12);color:#555;border-radius:50%;
  width:14px;height:14px;min-height:auto;line-height:1;font-size:11px;padding:0;
  cursor:pointer;display:flex;align-items:center;justify-content:center}
.tag-x:hover{background:rgba(0,0,0,.28);color:#000}
.tag-caret{margin-inline-start:auto;color:var(--muted);font-size:11px}
.away-pop{position:fixed;z-index:400;background:#fff;border:1px solid var(--border);
  border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:5px;
  max-height:260px;overflow:auto;min-width:170px}
.away-opt{display:flex;align-items:center;gap:6px;border-radius:6px;
  padding:5px 7px;margin:2px 0;font-size:.85rem;white-space:nowrap;cursor:pointer}
.away-opt input{width:16px;height:16px;min-height:auto;margin:0;flex:none}
/* guide — reuses the app's cards and accordions; the only additions are a
   readable measure, a chapter scale, and the two callout colours */
.guide-lead{color:var(--muted);font-size:.92rem;line-height:1.6}
details.guide-ch>summary{font-size:1rem;gap:10px}
.guide-ch .g-ico{font-size:1.15rem;line-height:1}
.guide-body{max-width:68ch;font-size:1rem;line-height:1.75}
.guide-body h3{font-size:1.02rem;margin:26px 0 10px;color:var(--text);font-weight:700;
  border-bottom:1px solid var(--border);padding-bottom:6px}
.guide-body h3:first-child{margin-top:6px}
.guide-body p{margin:0 0 14px}
.guide-body ul{margin:0 0 16px;padding-inline-start:22px}
.guide-body li{margin-bottom:9px}
.g-steps{counter-reset:g;list-style:none;margin:0 0 16px;padding:0}
.g-steps li{counter-increment:g;position:relative;padding-inline-start:38px;margin-bottom:13px}
.g-steps li::before{content:counter(g);position:absolute;inset-inline-start:0;top:1px;
  width:26px;height:26px;border-radius:50%;background:var(--primary);color:#fff;
  font-size:.82rem;font-weight:700;display:flex;align-items:center;justify-content:center}
.g-tip,.g-warn{border-radius:10px;padding:12px 14px;margin:16px 0;
  border-inline-start:4px solid}
.g-tip{background:#eafaf1;border-color:var(--ok);color:#16603a}
.g-warn{background:#fdf1e3;border-color:#d98324;color:#8a4b0b}
.g-qa{margin-bottom:18px}
.g-qa b{display:block;color:var(--primary);margin-bottom:5px}
.g-qa p{margin:0}
@media(max-width:700px){
  .guide-body{font-size:1.02rem;line-height:1.8}
  details.guide-ch>summary{font-size:1rem}
  .guide-body h3{margin-top:22px}
}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
.chk-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
/* group / workplace / work-day editors */
.sec-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;
  padding:6px 0;border-bottom:1px dashed var(--border)}
.sec-row:last-of-type{border-bottom:none}
.sec-row>input[type=text],.sec-row>input:not([type]),.sec-row>select{flex:1;min-width:110px}
.pct-box>label{display:block;margin-bottom:6px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:.88rem;white-space:nowrap}
.chk input{min-height:auto;width:20px;height:20px}
.pct-box .grid2>label,.pct-box .grid3>label{display:block}
#toast{position:fixed;bottom:20px;inset-inline-start:50%;transform:translateX(-50%);
  background:#222;color:#fff;padding:12px 22px;border-radius:12px;opacity:0;
  transition:opacity .3s;z-index:99;pointer-events:none;max-width:90vw;text-align:center}
[dir=ltr] #toast{transform:translateX(-50%)}
#toast.show{opacity:.95}
.inline-confirm{display:inline-flex;gap:6px;align-items:center;background:#fdecea;
  border-radius:10px;padding:4px 8px}
/* print */
#printArea{display:none}
@media print{
  body>header,body>main,#toast{display:none!important}
  body{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #printArea{display:block}
  #printArea table{border-collapse:collapse;width:100%;font-size:10px}
  #printArea th,#printArea td{border:1px solid #999;padding:3px 5px;text-align:center}
  #printArea th{background:#ddd}
  #printArea td.label{text-align:start;font-weight:bold;background:#f0f0f0}
  #printArea td.y{background:#fff3bf}
}
</style>
</head>
<body>
<header>
  <h1><span id="homeIcon" role="button" tabindex="0">🚕</span> <span id="hTitle"></span></h1>
  <nav id="nav"></nav>
  <span id="langBtns"></span>
</header>
<main id="app"></main>
<div id="printArea"></div>
<div id="toast"></div>

<script>

row_dates:"תאריכים",row_days:"ימים",row_work_hours:"שעות עבודה",row_entry:"כניסה",row_exit:"יציאה",
row_escort_morning:"ליווי בוקר",row_school:"בית ספר",row_escort_noon:"ליווי צהריים",row_emb_il:"EMB IL",row_emb_pe:"EMB PE",
row_other_empl:"אחר",row_arrival_point:"נקודת הגעה",row_theater:"תאטרון",row_udex:"UDEX",row_apt_il:"דירה IL",row_apt_pe:"דירה PE",
row_vehicle_morning:"סוג רכב בוקר",row_axis_morning:"ציר בוקר",row_wait_morning:"מקום המתנה בוקר",

/* ── change log ─────────────────────────────────────────────────────────── */
/* Every entry keeps the phrasing shown when it happened (details) plus the
   key it came from (dkey/dvars), so the table re-reads correctly after the
   language is switched. */
const LOG_MAX = 200, LOG_SHOW = 50;
const LOG_STYLE = {
  save_schedule:{icon:"💾", cls:"lg-save"},   auto_assign:{icon:"⚡", cls:"lg-auto"},
  save_settings:{icon:"⚙️", cls:"lg-set"},    delete_row:{icon:"🗑", cls:"lg-del"},
  mark_trip:{icon:"🧳", cls:"lg-trip"},
  add_row:{icon:"➕", cls:"lg-add"},           export_excel:{icon:"📤", cls:"lg-exp"},
  backup:{icon:"📦", cls:"lg-bak"},            restore:{icon:"📦", cls:"lg-bak"}
};
function loadLog(){ try{ return JSON.parse(localStorage.getItem(LS.log)||"[]"); }catch(e){ return []; } }
function saveLog(l){ localStorage.setItem(LS.log, JSON.stringify(l.slice(0,LOG_MAX))); }
/* the next saveConfig() is attributed to this instead of a plain settings save */
let _logNext=null;
function logNext(action, dkey, dvars){ _logNext={action, dkey, dvars}; }
function logAction(action, dkey, dvars, extra){
  extra=extra||{};
  const now=new Date();
  const rec={ id:now.getTime(), action, dkey, dvars:dvars||null,
    details:t(dkey, dvars), week:extra.week||"", changes:extra.changes||0,
    timestamp:now.toISOString() };
  const l=loadLog(); l.unshift(rec); saveLog(l);
  return rec;
}
function logDetails(r){ return r.dkey?t(r.dkey, r.dvars||undefined):(r.details||""); }
function fmtLogTime(iso){
  const d=new Date(iso);
  if(isNaN(d)) return iso;
  const p=n=>String(n).padStart(2,"0");
  return `${p(d.getDate())}/${p(d.getMonth()+1)}/${d.getFullYear()} ${p(d.getHours())}:${p(d.getMinutes())}`;
}
function filledCells(days){
  let n=0;
  for(const dk in days) for(const f in days[dk]) if(days[dk][f]) n++;
  return n;
}
function deepMerge(base, over){
  for (const k in over){
    if (over[k] && typeof over[k]==="object" && !Array.isArray(over[k]) &&
        base[k] && typeof base[k]==="object" && !Array.isArray(base[k])) deepMerge(base[k], over[k]);
    else base[k]=over[k];
  }
  return base;
}
/* v1 → v2: employees {il,pe} became groups, and UDEX became the extra task.
   Reads the RAW stored object, because deepMerge has already folded whatever
   it contained on top of the v2 defaults. */
function migrateConfig(cfg, raw){
  raw = raw || {};
  if (raw.employees && !raw.groups){
    const il=(raw.employees.il||[]).filter(Boolean), pe=(raw.employees.pe||[]).filter(Boolean);
    cfg.groups[0].employees=il; cfg.groups[0].active=true;
    cfg.groups[1].employees=pe; cfg.groups[1].active=pe.length>0;
  }
  /* v1 UDEX → the first extra task */
  if (!raw.extra_task && !raw.extra_tasks){
    const o=(raw.options||{}).udex, sv=raw.special_values||{}, tg=raw.targets||{};
    const et=cfg.extra_tasks[0];
    if (Array.isArray(o) && o.length) et.options=o.filter(Boolean);
    if (Array.isArray(sv.udex_morning)) et.morning_values=sv.udex_morning.filter(Boolean);
    if (Array.isArray(sv.udex_noon))    et.noon_values=sv.udex_noon.filter(Boolean);
    if (tg.udex_m!=null) et.target_morning=+tg.udex_m||0;
    if (tg.udex_t!=null) et.target_noon=+tg.udex_t||0;
  }
  /* v2 single extra_task → extra_tasks[0] */
  if (raw.extra_task && !raw.extra_tasks){
    const o=raw.extra_task, t0=o.targets||{}, et=cfg.extra_tasks[0];
    if (o.label) et.label={he:o.label.he||"", en:o.label.en||"", es:o.label.es||""};
    if (Array.isArray(o.options)) et.options=o.options.filter(Boolean);
    if (Array.isArray(o.morning_values)) et.morning_values=o.morning_values.filter(Boolean);
    if (Array.isArray(o.noon_values))    et.noon_values=o.noon_values.filter(Boolean);
    if (t0.morning!=null) et.target_morning=+t0.morning||0;
    if (t0.noon!=null)    et.target_noon=+t0.noon||0;
    et.active=true;
  }
  delete cfg.extra_task;
  while (cfg.extra_tasks.length < MAX_EXTRAS)
    cfg.extra_tasks.push({id:"et"+(cfg.extra_tasks.length+1), label:{he:"",en:"",es:""},
      options:[], morning_values:[], noon_values:[],
      target_morning:0, target_noon:0, active:false});
  cfg.extra_tasks.forEach(et=>{
    et.label=et.label||{he:"",en:"",es:""};
    ["options","morning_values","noon_values"].forEach(k=>{
      et[k]=(et[k]||[]).filter(Boolean); });
  });
  /* The two per-day-type work-hours lists became one shared list. Test the
     RAW config, not the merged one: a v1 file has no work_days at all, so the
     merged copy already carries the shipped defaults and would mask the
     user's own hours. */
  const wd=cfg.work_days;
  if (!(((raw.work_days||{}).hour_options)||[]).filter(Boolean).length){
    const seen=new Set(), merged=[];
    [((raw.options||{}).work_hours_weekday)||[], ((raw.options||{}).work_hours_friday)||[]]
      .forEach(list=>list.forEach(v=>{ if(v&&!seen.has(v)){ seen.add(v); merged.push(v); } }));
    if (merged.length) wd.hour_options=merged;
  }
  wd.hour_options=(wd.hour_options||[]).filter(Boolean);
  if (cfg.options){ delete cfg.options.work_hours_weekday; delete cfg.options.work_hours_friday; }
  delete cfg.work_day_labels;
  /* Axes: an older config held composite strings in options.axis
     ("A-U","A-D",…); the letters behind them become the axis list. */
  if(!raw.axes){
    const letters=[];
    ((raw.options||{}).axis||[]).forEach(v=>{
      const L=String(v||"").trim().charAt(0).toUpperCase();
      if(L&&!letters.includes(L)) letters.push(L); });
    if(letters.length)
      cfg.axes=letters.map(L=>({id:L, label:L, pct_u:50, pct_d:50, active:true}));
  }
  if(cfg.options) delete cfg.options.axis;
  cfg.axes=(cfg.axes||[]).filter(a=>a&&a.id).map(a=>({
    id:String(a.id).toUpperCase(), label:(a.label||a.id),
    pct_u:Math.max(0,Math.min(100,parseInt(a.pct_u,10)||0)),
    pct_d:Math.max(0,Math.min(100,parseInt(a.pct_d,10)||0)),
    active:a.active!==false }));
  /* The old free-text/letter reference maps become real rules, split evenly
     across the letters they named. */
  [["entry_axis_map","entry_axis_rules"],["exit_axis_map","exit_axis_rules"]].forEach(([oldKey,newKey])=>{
    const legacy=raw[oldKey];
    if(legacy && !raw[newKey]){
      const out={};
      for(const v in legacy){
        const src=legacy[v];
        const list=Array.isArray(src)?src:String(src||"").split(/[,\s]+/);
        const ids=[];
        list.forEach(x=>{ const L=String(x||"").trim().charAt(0).toUpperCase();
          if(L&&!ids.includes(L)) ids.push(L); });
        if(!ids.length) continue;
        const share=Math.round(100/ids.length), pcts={};
        let sum=0;
        ids.forEach((id,i)=>{ const p=(i===ids.length-1)?(100-sum):share; pcts[id]=p; sum+=p; });
        out[v]={axes:ids, pcts};
      }
      if(Object.keys(out).length) cfg[newKey]=out;
    }
    delete cfg[oldKey];
  });
  ["entry_axis_rules","exit_axis_rules"].forEach(k=>{
    const src=cfg[k]||{}, out={};
    for(const v in src){
      const r=src[v]||{};
      const ids=(r.axes||[]).map(x=>String(x).toUpperCase()).filter(Boolean);
      if(!ids.length) continue;
      const pcts={};
      ids.forEach(id=>{ pcts[id]=Math.max(0,Math.min(100,parseInt((r.pcts||{})[id],10)||0)); });
      out[v]={axes:ids, pcts};
    }
    cfg[k]=out;
  });
  delete cfg.employees;
  if (cfg.options) delete cfg.options.udex;
  if (cfg.special_values){ delete cfg.special_values.udex_morning; delete cfg.special_values.udex_noon; }
  if (cfg.targets){ delete cfg.targets.udex_m; delete cfg.targets.udex_t; }
  /* a group or workplace slot the stored config never knew about */
  while (cfg.groups.length < MAX_GROUPS)
    cfg.groups.push({id:"g"+(cfg.groups.length+1), name:"", color:"#eef2f7", employees:[], active:false});
  while (cfg.workplaces.length < MAX_WORKPLACES)
    cfg.workplaces.push({id:"wp"+(cfg.workplaces.length+1), name:"", active:false, notes:"",
      priority:cfg.workplaces.length+1, sections:[]});
  cfg.groups.forEach(g=>{ g.employees=(g.employees||[]).filter(Boolean); });
  cfg.workplaces.forEach((w,i)=>{
    /* an older config has no priority; the list order becomes it */
    if(w.priority==null) w.priority=i+1;
    w.priority=Math.max(1,Math.min(MAX_WORKPLACES,parseInt(w.priority,10)||i+1));
    w.sections=(w.sections||[]).filter(x=>x&&x.row_key);
    if(w.min_sections_filled==null) w.min_sections_filled=1;
    w.min_sections_filled=Math.max(0,Math.min(10,parseInt(w.min_sections_filled,10)||0));
    w.sections.forEach(sec=>{
      sec.required=!!sec.required;
      sec.min_workers=Math.max(0,Math.min(10,parseInt(sec.min_workers,10)||0));
    });
    /* allow_pair was a two-state flag; max_workers is a count */
    w.sections.forEach(sec=>{
      if(sec.max_workers==null) sec.max_workers=sec.allow_pair?2:1;
      sec.max_workers=Math.max(0,Math.min(10,parseInt(sec.max_workers,10)||0));
      delete sec.allow_pair;
    });
  });
  /* the fixed YELLOW / theater / UDEX counts became a list of weekly quotas */
  if(!raw.weekly_targets){
    const tg=raw.targets||{}, out=[];
    if(tg.yellow_per_week!=null){
      const n=+tg.yellow_per_week||0, VS=cfg.special_values.vehicle_special;
      if(n>0){
        out.push({field:"vehicle_morning", value:VS, count:Math.ceil(n/2)});
        if(n>1) out.push({field:"vehicle_noon", value:VS, count:Math.floor(n/2)});
      }
    }
    if(tg.theater_per_week!=null&&+tg.theater_per_week>0)
      out.push({field:"theater", value:"", count:+tg.theater_per_week});
    if(out.length) cfg.weekly_targets=out;
  }
  cfg.removed_rows=(cfg.removed_rows||[]).filter(Boolean);
  cfg.max_daily_absence=Math.max(0,Math.min(20,parseInt(cfg.max_daily_absence,10)||0));
  cfg.weekly_targets=(cfg.weekly_targets||[]).filter(x=>x&&x.field)
    .map(x=>({field:x.field, value:x.value||"", count:Math.max(0,parseInt(x.count,10)||0)}));
  if(cfg.targets){ delete cfg.targets.yellow_per_week; delete cfg.targets.theater_per_week; }
  cfg.schema_version = 2;
  return cfg;
}

  if(vars) for(const k in vars) s=s.replace("{"+k+"}",vars[k]); return s; }
function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
function toast(msg){ const el=document.getElementById("toast"); el.textContent=msg;

function addDays(isoStr,n){ const x=new Date(isoStr+"T12:00:00"); x.setDate(x.getDate()+n); return iso(x); }

/* ── working days ───────────────────────────────────────────────────────── */

   at the end of its week rather than the start. */
const DOW_ORDER = ["monday","tuesday","wednesday","thursday","friday","saturday","sunday"];
const DOW_JS    = ["sunday","monday","tuesday","wednesday","thursday","friday","saturday"];

function groupById(id){ return groupsAll().find(g=>g&&g.id===id)||null; }

/* Vacation and trip each hold a plain list of names. Weeks archived before
   this held one name per group in vacation_il / vacation_pe / vacation_<id>,
   so reads fall back to those and old archives keep counting. */
const AWAY_ROWS = ["vacation","trip"];
const LEGACY_VAC = {g1:"vacation_il", g2:"vacation_pe"};
function legacyVacField(g){ return LEGACY_VAC[g.id]||("vacation_"+g.id); }
function legacyVacFields(){ return (CFG.groups||[]).map(legacyVacField); }
/* names marked in one away row on one day, new shape or old */
function awayList(day, field){
  if(!day) return [];
  const v=day[field];
  if(Array.isArray(v)) return v.filter(Boolean);
  if(field==="vacation"){
    const out=[];
    legacyVacFields().forEach(f=>{ const n=day[f]; if(n&&!out.includes(n)) out.push(n); });
    if(typeof v==="string"&&v) v.split(",").map(x=>x.trim()).forEach(n=>{ if(n&&!out.includes(n)) out.push(n); });
    return out;
  }
  return typeof v==="string"&&v ? v.split(",").map(x=>x.trim()).filter(Boolean) : [];
}
/* why one person is unavailable that day: "vacation", "trip", "both" or "" */
function awayReason(day, name){
  const v=awayList(day,"vacation").includes(name);
  const p=awayList(day,"trip").includes(name);
  return v&&p?"both":v?"vacation":p?"trip":"";
}
const AWAY_MSG = {vacation:"err_sec_vac", trip:"err_sec_trip", both:"err_sec_both"};
/* everyone unavailable that day, whatever the reason */
function awayToday(day){

  AWAY_ROWS.forEach(f=>awayList(day,f).forEach(n=>out.add(n)));

}
/* fold a legacy week into the new shape so it saves back clean */
function normalizeAway(day){
  AWAY_ROWS.forEach(f=>{ if(!Array.isArray(day[f])) day[f]=awayList(day,f); });
  legacyVacFields().forEach(f=>{ if(f in day) delete day[f]; });
  return day;
}

function wpName(w){ return w?((w.name||"").trim()||w.id.toUpperCase()):""; }

/* [{wp, sec}] across every active workplace, in display order */
function allSections(){

function newId(prefix){ return prefix+Date.now().toString(36)+Math.random().toString(36).slice(2,5); }
/* how many employees a section takes; 0 means "never assign this row" */
/* how many of a workplace's roles must end up staffed, capped by how many
   roles it actually has switched on */
function wpMinSections(w){
  const cap=wpSections(w).filter(sec=>sectionSize(sec)>0).length;
  const n=parseInt(w&&w.min_sections_filled,10);

/* the daily floor for a section; a section carrying one must be filled */
function sectionMin(sec){

/* max_workers 0 switches a row off entirely and outranks any minimum */
function sectionMustFill(sec){

/* how many names to place: the target, never fewer than the floor */
function sectionTarget(sec){ return Math.max(sectionSize(sec), sectionMin(sec)); }

function sectionSize(sec){

/* every way of picking n names out of pool, joined with "+" */
function combos(pool, n, cap){
  cap=cap||300;
  if(n<=0||!pool.length) return [];
  if(n>=pool.length) return [pool.join("+")];
  const out=[], pick=[];
  (function walk(start){
    if(out.length>=cap) return;
    if(pick.length===n){ out.push(pick.join("+")); return; }
    for(let i=start;i<pool.length&&out.length<cap;i++){
      pick.push(pool[i]); walk(i+1); pick.pop();
    }
  })(0);
  return out;
}

/* ── extra tasks (was the single UDEX row) ──────────────────────────────── */

/* ── axes ───────────────────────────────────────────────────────────────── */
/* An axis is a letter with its own U/D split. The schedule cell still holds
   the composite "A-U", so archived weeks keep reading unchanged. */
const MAX_AXES = 8;
function axesAll(){ return CFG.axes||[]; }
function activeAxes(){ return axesAll().filter(a=>a&&a.active); }
function axisById(id){ return axesAll().find(a=>a&&a.id===id)||null; }

function axisLetterOf(v){ return String(v||"").split("-")[0].trim().toUpperCase(); }
function axisDirOf(v){ return (String(v||"").split("-")[1]||"").trim().toUpperCase(); }

/* ── entry/exit → axis rules ─────────────────────────────────────────────── */
const AXIS_RULE_KEY = {entry:"entry_axis_rules", exit:"exit_axis_rules"};
function axisRules(kind){ return CFG[AXIS_RULE_KEY[kind]]||{}; }
/* the axis letters a value may use; no rule means every active axis */
function allowedAxesFor(kind, value){
  const ids=axisLetters();
  const r=axisRules(kind)[value];
  if(!r||!Array.isArray(r.axes)||!r.axes.length) return ids;
  const narrowed=r.axes.filter(x=>ids.includes(x));
  return narrowed.length?narrowed:ids;
}
function axisPctsFor(kind, value){
  const r=axisRules(kind)[value];
  return (r&&r.pcts)||null;
}
/* which of `pool` may use this axis letter */
function valuesAllowingAxis(kind, letter, pool){
  return pool.filter(v=>allowedAxesFor(kind,v).includes(letter));
}
/* Pick a composite axis for `value`: the letter comes from that value's rule
   percentages balanced against history, then the chosen axis's own U/D split
   picks the side — also balanced against history, per letter. */
function pickAxis(kind, value, counts){
  counts=counts||{};
  const letters=allowedAxesFor(kind, value);
  if(!letters.length) return "";
  const letterCounts={};
  for(const v in counts){ const L=axisLetterOf(v); letterCounts[L]=(letterCounts[L]||0)+counts[v]; }
  const letter=leastUsed(letters, letterCounts, axisPctsFor(kind, value));
  const ax=axisById(letter);
  if(!ax) return "";
  const dirCounts={U:0, D:0};
  for(const v in counts){
    if(axisLetterOf(v)!==letter) continue;
    const d=axisDirOf(v);
    if(dirCounts[d]!=null) dirCounts[d]+=counts[v];
  }
  const dir=leastUsed(["U","D"], dirCounts, {U:+ax.pct_u||0, D:+ax.pct_d||0});
  return dir?letter+"-"+dir:letter;
}

/* ── rows ───────────────────────────────────────────────────────────────── */
function opts(name){ return (CFG.options[name]||[]).filter(Boolean); }
function customRows(){ return (CFG.custom_rows||[]).filter(r=>r&&r.key); }
function customKeys(){ return customRows().map(r=>r.key); }
/* fixed rows with workplace sections and custom rows spliced in at their anchors */
function removedRows(){ return new Set(CFG.removed_rows||[]); }
function naturalRowKeys(){
  const out=[], gone=removedRows();
  FIXED_ROW_ORDER.forEach(k=>{
    if(k==="@workplaces") out.push(...sectionRowKeys());
    else if(k==="@extras") out.push(...extraRowKeys());
    else if(k==="@custom") out.push(...customKeys());
    else out.push(k);
  });
  return out.filter(k=>!gone.has(k));
}
function reorderableKeys(){
  const natural = naturalRowKeys();
  const order = (CFG.row_order||[]).filter(k=>natural.includes(k));
  return order.concat(natural.filter(k=>!order.includes(k)));
}
/* every field a day object carries */
function scheduleFields(){ return naturalRowKeys(); }
/* the counters auto-assign balances against */
function historyFields(){ return FIXED_HISTORY_FIELDS.concat(sectionRowKeys(), extraRowKeys()); }
/* row key → the divider text shown above it */
function rowDividers(){
  const m={};
  activeWorkplaces().forEach(w=>{ const secs=wpSections(w);
    if(secs.length) m[secs[0].row_key]="— "+wpName(w)+" —"; });
  FIXED_DIVIDERS.forEach(k=>{ if(!m[k]) m[k]="◈"; });
  return m;
}
/* Row labels come from one place each: sections are named by their workplace,
   the extra task by its own tab, custom rows by their editor. */
function rowLabel(key, lang){
  lang = lang||S.lang;
  const ov=(CFG.row_labels||{})[key];
  if (ov && ov[lang]) return ov[lang];
  const et=extraByRow(key);
  if (et) return extraLabel(et, lang);
  const sx=sectionByRow(key);
  if (sx) return sectionLabel(sx);
  const cr=customRows().find(r=>r.key===key);
  if (cr) return (cr.labels&&(cr.labels[lang]||cr.labels.he))||key;
  return (I18N[lang]&&I18N[lang]["row_"+key])||I18N.he["row_"+key]||key;
}
function emptyWeek(weekStart){
  const fields=scheduleFields(), days={};
  workDays().forEach(n=>{
    const d=addDays(weekStart, DOW_ORDER.indexOf(n));
    days[d]={}; fields.forEach(f=>days[d][f]="");
  });
  return days;
}
/* Reshape the open week after the configuration changed (days added/removed,
   a workplace section created) while keeping every value already entered. */
function resyncDays(){
  if(!S.days) return;
  const wk=snapMonday(Object.keys(S.days).sort()[0]||S.weekStart);
  const fresh=emptyWeek(wk);
  for(const dk in fresh){
    const old=S.days[dk]; if(!old) continue;
    for(const f in fresh[dk]) if(old[f]!=null) fresh[dk][f]=old[f];
    AWAY_ROWS.forEach(f=>{ fresh[dk][f]=awayList(old,f); });
  }
  S.days=fresh; saveDraft();
}

/* ═══════════════ target percentages per balanced field ═══════════════ */
/* option list a %-table field draws from (חג is manual-only, so excluded) */
function pctOptions(key){
  const f=PCT_FIELDS.find(x=>x.key===key); if(!f) return [];
  const holiday=CFG.special_values.holiday;
  return opts(f.opt).filter(o=>!(f.skipHoliday&&o===holiday));
}
/* equal split 100/N, rounded, remainder absorbed by the last value */
function equalPcts(list){
  const o={},n=list.length; if(!n) return o;
  const base=Math.round(100/n); let sum=0;
  list.forEach((v,i)=>{ const p=(i===n-1)?(100-sum):base; o[v]=p; sum+=p; });
  return o;
}
/* Every field defaults to an equal split. Vehicles used to derive theirs from
   the weekly YELLOW count; that count is now an explicit weekly quota, so the
   percentages only matter for a field with no quota on it. */
function defaultPcts(key){ return equalPcts(pctOptions(key)); }
/* saved percentages, with any option added since the last save falling back to
   its equal share (the total then shows red until the user rebalances) */
function fieldPcts(key){
  const list=pctOptions(key), def=defaultPcts(key);
  const saved=(CFG.targets.field_pcts||{})[key];
  if(!saved) return def;
  const out={}; let any=false;
  list.forEach(v=>{ if(saved[v]!=null){ out[v]=Number(saved[v])||0; any=true; } else out[v]=def[v]||0; });
  return any?out:def;
}
/* ═══════════════ history & auto-assign (port of schedule_logic.py) ═══════════════ */
/* 90-day window: covers ~13 weeks so year-boundary never creates a cold start */
const HISTORY_DAYS = 90;
function historyFloor(){
  const start=(S.days&&Object.keys(S.days).sort()[0])||S.weekStart;
  return addDays(start, -HISTORY_DAYS);
}
function buildHistory(sinceIso){
  const hist={}; const arch=loadArchive(); const hf=historyFields();
  for(const wk in arch){ if(sinceIso&&wk<sinceIso) continue; const days=arch[wk];
    for(const d in days){ const day=days[d];
      for(const f of hf){ const v=day[f];
        if(v){ hist[f]=hist[f]||{}; hist[f][v]=(hist[f][v]||0)+1; } } } }
  return hist;
}
/* Weighted least-used: pick the option whose share of past use sits furthest
   BELOW its target share. With equal targets this is plain least-used.
   `field` names a PCT_FIELDS entry; omit it for ad-hoc lists (employees,
   EMB pairs) that have no percentage table. */
function leastUsed(options, counts, field){
  if(!options||!options.length) return "";
  counts=counts||{};
  /* `field` is either a PCT_FIELDS key or an explicit {value: percent} map */
  const pcts=field?(typeof field==="object"?field:fieldPcts(field)):null;
  let pool=options.slice();
  if(pcts){                       // an explicit 0% target means "never assign"
    const pos=pool.filter(o=>pcts[o]==null||(Number(pcts[o])||0)>0);
    if(pos.length) pool=pos;
  }
  /* values outside the table (a taxi list that diverged, say) get the mean
     target so they stay neutral instead of silently dropping to 0% */
  let covSum=0,covN=0;
  if(pcts) pool.forEach(o=>{ if(pcts[o]!=null){ covSum+=Number(pcts[o])||0; covN++; } });
  const fallback=covN?covSum/covN:1;
  let sum=0; const tgt={};
  pool.forEach(o=>{ const v=pcts?(pcts[o]!=null?(Number(pcts[o])||0):fallback):1;
    tgt[o]=v>0?v:0; sum+=tgt[o]; });
  if(sum<=0){ pool.forEach(o=>tgt[o]=1); sum=pool.length; }
  const total=pool.reduce((a,o)=>a+(counts[o]||0),0);
  const gap=o=>tgt[o]/sum-(total?(counts[o]||0)/total:0);
  const best=Math.max(...pool.map(gap));
  const cand=pool.filter(o=>gap(o)>=best-1e-9);
  return cand[Math.floor(Math.random()*cand.length)];
}
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function bump(h,f,v){ if(!v)return; h[f]=h[f]||{}; h[f][v]=(h[f][v]||0)+1; }

/* Place every weekly quota, then decide what the untargeted days of those
   same fields get. A field carrying a value-less quota stays blank outside it;
   a field carrying only value quotas fills its remaining days from the values
   no quota claimed. */
function applyWeeklyTargets(keys, hist){
  const byField={}, holiday=CFG.special_values.holiday;
  weeklyTargets().forEach(t=>{ (byField[t.field]=byField[t.field]||[]).push(t); });
  const present=new Set(naturalRowKeys());
  for(const f in byField){
    if(!present.has(f)) continue;      // a quota left over from a deleted row
    const list=byField[f];
    /* the holiday value is manual-only, so it never fills a spare day —
       an explicit quota on it still places it */
    const claimed=list.filter(t=>t.value).map(t=>t.value).concat(holiday);
    const anyT=list.find(t=>!t.value);
    const counts={...(hist[f]||{})};
    /* exact-value quotas first */
    list.filter(t=>t.value).forEach(t=>{
      let need=t.count-keys.filter(k=>S.days[k][f]===t.value).length;
      const free=shuffle(keys.filter(k=>!S.days[k][f]));
      while(need-->0&&free.length){ S.days[free.shift()][f]=t.value; counts[t.value]=(counts[t.value]||0)+1; }
    });
    if(anyT){
      /* "any value" quota: fill up to count days, leave the rest blank */
      let need=anyT.count-keys.filter(k=>S.days[k][f]).length;
      const pool=targetFieldValues(f).filter(v=>!claimed.includes(v));
      const free=shuffle(keys.filter(k=>!S.days[k][f]));
      while(need-->0&&free.length&&pool.length){
        const c=leastUsed(pool,counts); counts[c]=(counts[c]||0)+1;
        S.days[free.shift()][f]=c;
      }
    } else {
      /* only exact-value quotas: the other days take the unclaimed values */
      const pool=targetFieldValues(f).filter(v=>!claimed.includes(v));
      if(pool.length) keys.forEach(k=>{
        if(!S.days[k][f]){ const c=leastUsed(pool,counts); counts[c]=(counts[c]||0)+1; S.days[k][f]=c; }
      });
    }
  }
}

function autoAssign(){
  if(!S.days) return;
  const keys=Object.keys(S.days).sort();
  const filledBefore=filledCells(S.days);
  /* 90-day window: covers ~13 weeks so year-boundary never creates a cold start */
  const hist=buildHistory(addDays(keys[0], -HISTORY_DAYS));
  const sv=CFG.special_values;
  const holiday=sv.holiday, VS=sv.vehicle_special;
  const waitVals=opts("wait_spot");
  const secs=allSections();
  const hFields=historyFields();
  const gov=governedFields();

  applyWeeklyTargets(keys, hist);

  const weekly={};                    // in-week usage so days differ
  const H=f=>{ const c={...(hist[f]||{})}; const w=weekly[f]||{};
    for(const v in w) c[v]=(c[v]||0)+w[v]; return c; };
  const present=new Set(naturalRowKeys());
  /* skip rows a quota already filled, and rows the user deleted outright */
  const free=f=>!gov.has(f)&&present.has(f);

  keys.forEach(dk=>{
    const day=S.days[dk];
    const other=day.other_empl||"";

    /* entry ↔ morning axis and exit ↔ noon axis. The value chooses the axis
       letter through the station's rules; the axis's own U/D split chooses the
       side. Whichever of the two is already filled constrains the other. */
    [["entry","axis_morning"],["exit","axis_noon"]].forEach(([vf,af])=>{
      const pool=opts(vf).filter(o=>o!==holiday);
      if(free(vf)&&!day[vf]&&pool.length){
        let cand=pool;
        if(day[af]){
          const narrowed=valuesAllowingAxis(vf, axisLetterOf(day[af]), pool);
          if(narrowed.length) cand=narrowed;
        }
        day[vf]=leastUsed(cand,H(vf),vf);
      }
      if(free(af)&&!day[af]&&activeAxes().length)
        day[af]=pickAxis(vf, day[vf], H(af));
    });

    /* Workplaces in priority order. Each section draws from its own group,
       skipping anyone on vacation, on another task, or already placed today,
       so nobody is booked twice in one day. max_workers decides how many names
       the row holds: 0 skips it, 1 is a single employee, 2+ join with "+".
       A workplace whose required sections cannot all be filled is skipped
       whole — its optional rows stay empty too, and the people it would have
       used stay free for the workplaces below it. */
    const taken=new Set();
    /* whatever is already on the day (manual or quota-placed) is spoken for */
    secs.forEach(x=>{ const v=day[x.sec.row_key];
      if(v) String(v).split("+").forEach(e=>taken.add(e)); });
    const away=awayToday(day);          // vacation and trip both mean unavailable
    /* place exactly n names in a section, or "" when even that cannot be met */
    const pickN=(sec,busy,n,anyGroup)=>{
      if(!sectionSize(sec)) return "";
      const g=anyGroup?null:groupById(sec.group_id);
      const want=Math.max(1,Math.min(n,sectionTarget(sec)));
      const pool=(g?groupEmps(g.id):allEmps())
        .filter(e=>!away.has(e)&&e!==other&&!busy.has(e));
      if(pool.length<want) return "";                // the floor cannot be met
      return want===1?leastUsed(pool,H(sec.row_key))
                     :leastUsed(combos(pool,want),H(sec.row_key));
    };
    /* grow a section that already holds its floor up to max_workers */
    const topUp=(sec,busy,owed)=>{
      const have=String(day[sec.row_key]||"").split("+").filter(Boolean);
      let want=sectionTarget(sec)-have.length;
      if(want<=0) return;
      const g=groupById(sec.group_id);
      const pool=(g?groupEmps(g.id):allEmps())
        .filter(e=>!away.has(e)&&e!==other&&!busy.has(e));
      /* never grow a row past its floor on someone a later workplace needs */
      want=Math.min(want, pool.length-((owed&&owed.get(sec.group_id||""))||0));
      if(want<1||!pool.length) return;
      const add=want===1?leastUsed(pool,H(sec.row_key))
                        :leastUsed(combos(pool,Math.min(want,pool.length)),H(sec.row_key));
      if(!add) return;
      day[sec.row_key]=have.concat(String(add).split("+").filter(Boolean)).join("+");
      String(add).split("+").forEach(e=>busy.add(e));
    };
    const wpRows=new Map(), skipped=new Set(), order=activeWorkplaces();
    order.forEach(w=>
      wpRows.set(w, wpSections(w).filter(sec=>free(sec.row_key)&&sectionSize(sec)>0)));
    const groupOf=sec=>sec.group_id||"";
    /* people of a group still up for grabs right now */
    const freeIn=(gid,busy)=>{
      const g=groupById(gid);
      return (g?groupEmps(g.id):allEmps())
        .filter(e=>!away.has(e)&&e!==other&&!busy.has(e)).length;
    };
    /* The planning step: heads each group still owes to the minimums of the
       workplaces further down the priority list. A workplace may spend these
       on its own minimum — priority decides that — but never on a spare. */
    const owedAfter=(idx,busy)=>{
      const need=new Map(), add=(gid,n)=>need.set(gid,(need.get(gid)||0)+n);
      order.slice(idx+1).forEach(w2=>{
        const rows=wpRows.get(w2), open=rows.filter(sec=>!day[sec.row_key]);
        const req=open.filter(sec=>sec.required);
        req.forEach(sec=>add(groupOf(sec),Math.max(1,sectionMin(sec))));
        /* one head per role it is still short of, taken from whichever role
           has the most people free — that is the one it will actually use */
        let short=wpMinSections(w2)-rows.filter(sec=>day[sec.row_key]).length-req.length;
        open.filter(sec=>!sec.required)
          .sort((a,b)=>freeIn(groupOf(b),busy)-freeIn(groupOf(a),busy))
          .forEach(sec=>{ if(short>0){ add(groupOf(sec),1); short--; } });
      });
      return need;
    };
    /* a spare head: taken only from what no later workplace is counting on */
    const pickSpare=(sec,busy,n,owed)=>{
      const slack=freeIn(groupOf(sec),busy)-(owed.get(groupOf(sec))||0);
      return slack<1?"":pickN(sec,busy,Math.min(n,slack));
    };
    /* Pass 1 — in priority order, every workplace takes only what it must, so
       a high-priority workplace cannot spend the people a later one needs to
       reach its own minimum. Pass 2 hands out the spares afterwards. */
    order.forEach((w,idx)=>{
      const list=wpRows.get(w);
      const open=()=>list.filter(sec=>!day[sec.row_key]);
      /* required rows are hard: all of them, or the workplace is skipped whole.
         They go first — a role marked required outranks every other row here. */
      const trial=new Map(), busy=new Set(taken);
      let ok=true;
      for(const sec of open().filter(sec=>sec.required)){
        const floor=Math.max(1,sectionMin(sec));
        /* its own group first; borrowing beats standing the workplace down */
        const c=pickN(sec,busy,floor)||pickN(sec,busy,floor,true);
        if(!c){ ok=false; break; }
        trial.set(sec.row_key,c);
        String(c).split("+").forEach(e=>busy.add(e));
      }
      if(!ok){ skipped.add(w); return; }   // whole workplace skipped today
      trial.forEach((v,rk)=>{ day[rk]=v; });
      busy.forEach(e=>taken.add(e));
      /* rows carrying their own daily floor come next — preferred, but soft:
         one that cannot be filled leaves the workplace standing, because the
         "at least N roles" rule below decides whether the workplace is short */
      for(const sec of open().filter(sec=>sectionMin(sec)>0)){
        const c=pickN(sec,taken,sectionMin(sec));
        if(!c) continue;
        day[sec.row_key]=c;
        String(c).split("+").forEach(e=>taken.add(e));
      }
      /* "at least N roles staffed": fill roles until the floor is reached,
         starting with the one whose group the workplaces below need least —
         staffing this one through PE when IL is idle would starve them */
      const filled=()=>list.filter(sec=>day[sec.row_key]).length;
      if(filled()<wpMinSections(w)){
        const owed=owedAfter(idx,taken);
        const slack=sec=>freeIn(groupOf(sec),taken)-(owed.get(groupOf(sec))||0);
        const bySlack=open().slice().sort((a,b)=>slack(b)-slack(a));
        /* own groups first; only if the floor is still out of reach does a
           role borrow from another group — an unstaffed workplace is worse */
        for(const anyGroup of [false,true])
          for(const sec of bySlack){
            if(filled()>=wpMinSections(w)) break;
            if(day[sec.row_key]) continue;
            const c=pickN(sec,taken,1,anyGroup);
            if(!c) continue;
            day[sec.row_key]=c;
            String(c).split("+").forEach(e=>taken.add(e));
          }
      }
    });
    /* Pass 2 — the discretionary half: top staffed rows up to max_workers,
       then fill whatever optional rows are still open, priority order again */
    order.forEach((w,idx)=>{
      if(skipped.has(w)) return;
      const list=wpRows.get(w), owed=owedAfter(idx,taken);
      list.forEach(sec=>{ if(day[sec.row_key]) topUp(sec,taken,owed); });
      list.forEach(sec=>{
        if(day[sec.row_key]) return;
        const c=pickSpare(sec,taken,1,owed);
        if(!c) return;
        day[sec.row_key]=c;
        String(c).split("+").forEach(e=>taken.add(e));
      });
    });
    /* Nobody sits idle while a role stands empty: whoever is still unplaced
       fills what is left, group or no group. This only ever fires when the
       station has more open roles than the matching groups can cover. */
    order.forEach(w=>{
      if(skipped.has(w)) return;
      wpRows.get(w).forEach(sec=>{
        if(day[sec.row_key]) return;
        const c=pickN(sec,taken,1,true);
        if(!c) return;
        day[sec.row_key]=c;
        String(c).split("+").forEach(e=>taken.add(e));
      });
    });

    if(free("arrival_point")&&!day.arrival_point) day.arrival_point=leastUsed(opts("arrival_point"),H("arrival_point"),"arrival_point");
    if(free("wait_morning")&&!day.wait_morning) day.wait_morning=leastUsed(waitVals,H("wait_morning"),"wait_spot");
    if(free("wait_noon")&&!day.wait_noon)       day.wait_noon   =leastUsed(waitVals,H("wait_noon"),"wait_spot");

    for(const f of hFields) bump(weekly,f,day[f]);
  });

  /* vehicles with no quota of their own still need a value on every day */
  ["vehicle_morning","vehicle_noon"].forEach(f=>{
    if(!free(f)) return;
    const counts={...(hist[f]||{})};
    keys.forEach(k=>{ if(!S.days[k][f]){
      const c=leastUsed(opts("vehicle"),counts,"vehicle"); counts[c]=(counts[c]||0)+1; S.days[k][f]=c; } });
  });

  /* extra tasks: each row gets its own morning/noon targets, balanced by type */
  activeExtras().forEach(et=>{
    const rk=extraRowKey(et);
    if(!free(rk)) return;
    const mVals=(et.morning_values||[]).filter(Boolean),
          tVals=(et.noon_values||[]).filter(Boolean), tg2=extraTargets(et);
    let open=shuffle(keys.filter(k=>!S.days[k][rk]));
    let mNeed=tg2.morning-keys.filter(k=>mVals.includes(S.days[k][rk])).length;
    let tNeed=tg2.noon   -keys.filter(k=>tVals.includes(S.days[k][rk])).length;
    const mh={...(hist[rk]||{})}, th={...(hist[rk]||{})};
    while(mNeed-->0&&open.length&&mVals.length){ const c=leastUsed(mVals,mh); mh[c]=(mh[c]||0)+1; S.days[open.shift()][rk]=c; }
    while(tNeed-->0&&open.length&&tVals.length){ const c=leastUsed(tVals,th); th[c]=(th[c]||0)+1; S.days[open.shift()][rk]=c; }
  });

  /* taxis only on special-vehicle slots — each taxi row has its own option list */
  keys.forEach(k=>{ const day=S.days[k];
    const ym=day.vehicle_morning===VS, yn=day.vehicle_noon===VS;
    ["taxi_apt","taxi_arrival"].forEach(f=>{ day[f]=ym?(day[f]||leastUsed(opts(f),hist[f]||{},f)):""; });
    day.taxi_emb=yn?(day.taxi_emb||leastUsed(opts("taxi_emb"),hist.taxi_emb||{},"taxi_apt")):"";
    day.taxi_arrival_noon=yn?(day.taxi_arrival_noon||leastUsed(opts("taxi_arrival_noon"),hist.taxi_arrival_noon||{},"taxi_arrival")):"";
  });
  const filledAfter=filledCells(S.days);
  logAction("auto_assign","log_auto",{w:keys[0]},
    {week:keys[0], changes:Math.max(0, filledAfter-filledBefore)});
  S.dirty=true; saveDraft(); render(); toast("⚡ ✓");
}

/* ═══════════════ validation (port of validate_schedule) ═══════════════ */
function validate(){
  if(!S.days) return [];
  const errs=[];
  const extras=activeExtras();
  const exCount={};                            // row key → {m, n}
  extras.forEach(e=>exCount[extraRowKey(e)]={m:0,n:0});
  const secs=allSections();
  const quotas=weeklyTargets().map(q=>({...q, seen:0}));
  for(const dk of Object.keys(S.days).sort()){
    const day=S.days[dk], d=fmtDM(dk);
    quotas.forEach(q=>{
      const v=day[q.field];
      if(q.value?v===q.value:!!v) q.seen++;
    });
    extras.forEach(e=>{
      const rk=extraRowKey(e), v=day[rk];
      if(!v) return;
      if((e.morning_values||[]).includes(v)) exCount[rk].m++;
      else if((e.noon_values||[]).includes(v)) exCount[rk].n++;
    });
    const other=day.other_empl||"";
    /* the axis must be one the day's entry/exit permits */
    [["entry","axis_morning"],["exit","axis_noon"]].forEach(([vf,af])=>{
      if(!day[vf]||!day[af]) return;
      if(!allowedAxesFor(vf, day[vf]).includes(axisLetterOf(day[af])))
        errs.push({lvl:"warn", msg:d+": "+t("warn_axis_rule",
          {f:rowLabel(af), a:day[af], e:rowLabel(vf), v:day[vf]})});
    });
    activeWorkplaces().forEach(w=>{
      const missing=wpSections(w).find(sec=>
        sec.required&&sectionSize(sec)>0&&!day[sec.row_key]);
      if(missing) errs.push({lvl:"warn", msg:d+": "+
        t("warn_wp_skipped",{w:wpName(w), s:sectionLabel({wp:w,sec:missing})})});
      /* a role that is staffed but under its own daily floor. An empty
         non-required role is left to the "at least N roles" check below —
         under that rule an empty role is a choice, not a shortfall */
      wpSections(w).forEach(sec=>{
        const min=sectionMin(sec);
        if(!min||!sectionSize(sec)) return;
        const n=String(day[sec.row_key]||"").split("+").filter(Boolean).length;
        if(n&&n<min) errs.push({lvl:"warn", msg:d+": "+t("warn_sec_min",
          {w:wpName(w), s:sectionLabel({wp:w,sec}), n:min})});
      });
      /* a borrowed hand is legitimate but worth naming */
      wpSections(w).forEach(sec=>{
        const g=groupById(sec.group_id);
        if(!g||!sectionSize(sec)) return;
        const roster=groupEmps(g.id);
        String(day[sec.row_key]||"").split("+").filter(Boolean)
          .filter(e=>!roster.includes(e))
          .forEach(e=>errs.push({lvl:"warn", msg:d+": "+t("warn_sec_cross_group",
            {e, s:sectionLabel({wp:w,sec}), g:groupName(g)})}));
      });
      const floor=wpMinSections(w);
      const staffed=wpSections(w).filter(sec=>sectionSize(sec)>0&&day[sec.row_key]).length;
      if(staffed<floor) errs.push({lvl:"warn", msg:d+": "+
        t("warn_wp_min_sections",{w:wpName(w), n:floor, c:staffed})});
    });
    /* someone cannot be on holiday and away on a trip at once */
    const vacNames=awayList(day,"vacation"), tripNames=awayList(day,"trip");
    vacNames.filter(e=>tripNames.includes(e)).forEach(e=>
      errs.push({lvl:"warn", msg:d+": "+t("warn_vac_trip",{e})}));
    const away=awayToday(day);
    /* a warning only — the user may knowingly exceed the daily absence cap */
    if(away.size>maxDailyAbsence())
      errs.push({lvl:"warn", msg:d+": "+t("warn_daily_absence",{n:maxDailyAbsence()})});
    const placed={};                          // employee → the section holding them
    secs.forEach(x=>{
      const rk=x.sec.row_key, g=groupById(x.sec.group_id), lbl=sectionLabel(x);
      const people=String(day[rk]||"").split("+").filter(Boolean);
      people.forEach(e=>{
        const why=awayReason(day,e);
        if(why) errs.push({lvl:"err",msg:"❌ "+d+": "+t(AWAY_MSG[why],{e,s:lbl})});
        else if(e===other) errs.push({lvl:"err",msg:"❌ "+d+": "+t("err_sec_other",{e,s:lbl})});
        if(placed[e]) errs.push({lvl:"warn",msg:d+": "+t("warn_sec_dup",{e,s:placed[e],s2:lbl})});
        else placed[e]=lbl;
      });
      if(!people.length&&!x.sec.required&&sectionSize(x.sec)>0){
        const pool=(g?groupEmps(g.id):allEmps()).filter(e=>!away.has(e)&&e!==other);
        if(!pool.length) errs.push({lvl:"err",msg:"❌ "+d+": "+
          t("err_sec_none",{s:lbl,g:g?groupName(g):"—"})});
      }
    });
  }
  /* configuration-level faults, reported once rather than per day */
  activeAxes().forEach(a=>{
    const sum=(+a.pct_u||0)+(+a.pct_d||0);
    if(sum!==100) errs.push({lvl:"err",msg:"❌ "+t("err_axis_ud",{a:axisLabel(a),n:sum})});
  });
  ["entry","exit"].forEach(kind=>{
    const rules=axisRules(kind);
    for(const v in rules){
      const r=rules[v];
      if(!r||!(r.axes||[]).length) continue;
      const sum=r.axes.reduce((x,id)=>x+(+((r.pcts||{})[id])||0),0);
      if(sum!==100) errs.push({lvl:"err",msg:"❌ "+
        t("err_axis_rule_pct",{f:rowLabel(kind), v, n:sum})});
    }
  });
  quotas.forEach(q=>{
    if(q.seen===q.count) return;
    const f=targetFieldLabel(q.field);
    errs.push({lvl:"warn", msg:q.value
      ? t("warn_target",{f, v:q.value, n:q.seen, t:q.count})
      : t("warn_target_any",{f, n:q.seen, t:q.count})});
  });
  extras.forEach(e=>{
    const c=exCount[extraRowKey(e)], tg2=extraTargets(e), f=extraLabel(e);
    if(c.m!==tg2.morning) errs.push({lvl:"warn",msg:t("warn_extra_m",{n:c.m,t:tg2.morning,f})});
    if(c.n!==tg2.noon)    errs.push({lvl:"warn",msg:t("warn_extra_n",{n:c.n,t:tg2.noon,f})});
  });
  return errs;
}

/* ── away rows as tags with a picker ─────────────────────────────────────── */
/* The picker is fixed-position and lives on <body>: inside the scrolling table
   wrapper it would be clipped by the overflow, which no z-index can undo. */
function awayTags(dk, rk){
  const names=awayList(S.days[dk],rk);
  const cls=rk==="trip"?"tag-trip":"tag-vac";
  return names.map(n=>`<span class="tag ${cls}">${esc(n)}`+
      `<button class="tag-x" data-rm="${esc(n)}" aria-label="${esc(t("delete"))}">×</button></span>`).join("")+
    `<span class="tag-caret" aria-hidden="true">▾</span>`;
}
let _awayPop=null, _awayDirty=false;
function closeAwayPop(){
  if(!_awayPop) return;
  _awayPop.remove(); _awayPop=null;
  document.removeEventListener("mousedown", awayOutside, true);
  window.removeEventListener("resize", closeAwayPop);
  /* it is fixed-positioned, so it cannot follow a scroll — close it instead */
  window.removeEventListener("scroll", closeAwayPop, true);
  if(_awayDirty){ _awayDirty=false; render(); }   // section pickers follow who is away
}
function awayOutside(ev){
  if(_awayPop && !_awayPop.contains(ev.target) && !ev.target.closest(".tagbox")) closeAwayPop();
}
function refreshAwayCell(dk, rk){
  const box=document.querySelector(`.tagbox[data-dk="${dk}"][data-away="${rk}"]`);
  if(box) box.innerHTML=awayTags(dk,rk);
}
function toggleAway(dk, rk, name, on){
  const list=awayList(S.days[dk],rk).filter(x=>x!==name);
  if(on) list.push(name);
  S.days[dk][rk]=list;
  if(rk==="trip")
    logAction("mark_trip", on?"log_trip_on":"log_trip_off", {e:name, d:fmtDM(dk)},
      {week:Object.keys(S.days).sort()[0], changes:1});
  S.dirty=true; _awayDirty=true; saveDraft();
  refreshAwayCell(dk,rk); updateStatus();
  /* keep an open picker in step with a tag removed from the cell */
  if(_awayPop && _awayPop.dataset.dk===dk && _awayPop.dataset.away===rk) _awayPop._paint();
}
function openAwayPop(box){
  const dk=box.dataset.dk, rk=box.dataset.away;
  const wasFor=_awayPop&&_awayPop.dataset.dk===dk&&_awayPop.dataset.away===rk;
  closeAwayPop();
  if(wasFor) return;                       // clicking the same box closes it
  const pop=document.createElement("div");
  pop.className="away-pop"; pop.dataset.dk=dk; pop.dataset.away=rk;
  const paint=()=>{
    const on=awayList(S.days[dk],rk);
    pop.innerHTML=activeGroups().map(g=>groupEmps(g.id).map(e=>
      `<label class="away-opt" style="background:${esc(g.color||"#fff")}">`+
      `<input type="checkbox" data-emp="${esc(e)}" ${on.includes(e)?"checked":""}> ${esc(e)}</label>`
    ).join("")).join("")||`<div class="hint" style="padding:6px">${t("away_none")}</div>`;
    pop.querySelectorAll("[data-emp]").forEach(cb=>cb.onchange=()=>{
      toggleAway(dk,rk,cb.dataset.emp,cb.checked); });
  };
  pop._paint=paint;
  paint();
  document.body.appendChild(pop);
  /* sit under the cell, or flip above it when the bottom of the window is
     closer than the picker is tall — clamping to the viewport instead would
     leave it floating far from the cell it belongs to */
  const r=box.getBoundingClientRect(), h=pop.offsetHeight;
  const below=r.bottom+4+h<=window.innerHeight-8;
  pop.style.top=(below?r.bottom+4:Math.max(8, r.top-h-4))+"px";
  pop.style.left=Math.max(8, Math.min(r.left, window.innerWidth-pop.offsetWidth-8))+"px";
  _awayPop=pop;
  document.addEventListener("mousedown", awayOutside, true);
  window.addEventListener("resize", closeAwayPop);
  window.addEventListener("scroll", closeAwayPop, true);
}

/* one message per line, for the warnings drawer */
function errLines(errs){
  return errs.length
    ?errs.map(e=>`<div class="line ${e.lvl}">${esc(e.msg)}</div>`).join("")
    :`<div class="line ok">${t("valid")}</div>`;
}

});
function openWarnings(on){

/* live refresh of badge / error list / save-dot without a full re-render */
function updateStatus(){
  const b=document.getElementById("statusBadge");

function selCell(dk,field,options,val,cls,bg){
  let o=`<option value=""></option>`;
  const list=options.slice();
  if(val&&!list.includes(val)) list.push(val);
  list.forEach(v=>{ o+=`<option value="${esc(v)}" ${v===val?"selected":""}>${esc(v)}</option>`; });
  const st=bg?` style="background:${esc(bg)}"`:"";
  return `<td class="${cls||""}"><select data-dk="${dk}" data-f="${field}"${st}>${o}</select></td>`;
}
function renderRow(rk,keys){
  const cr=customRows().find(r=>r.key===rk);
  const sx=sectionByRow(rk), ex=extraByRow(rk);
  let h=`<tr><td class="label">${esc(rowLabel(rk))}</td>`;
  for(let i=0;i<keys.length;i++){
    const dk=keys[i], day=S.days[dk];
    if(rk==="work_hours"){
      h+=selCell(dk,"work_hours",hourOptions(),day.work_hours);
    } else if(AWAY_ROWS.includes(rk)){
      h+=`<td class="away-cell"><div class="tagbox" data-dk="${dk}" data-away="${esc(rk)}">`+
         awayTags(dk,rk)+`</div></td>`;
    } else if(sx){
      const g=groupById(sx.sec.group_id);
      const away=awayToday(day);
      const avail=(g?groupEmps(g.id):allEmps()).filter(e=>!away.has(e));
      const size=sectionSize(sx.sec);
      const list=avail.slice();
      if(size>=2) list.push(...combos(avail,Math.min(size,avail.length)));
      h+=selCell(dk,rk,list,day[rk],"",g?g.color:"");
    } else if(ex){
      h+=selCell(dk,rk,(ex.options||[]).filter(Boolean),day[rk]);
    } else if(rk==="other_empl"){
      h+=selCell(dk,rk,allEmps(),day[rk]);
    } else if(TEXT_ROWS.has(rk)||(cr&&cr.input!=="select")){
      h+=`<td><input type="text" data-dk="${dk}" data-f="${rk}" value="${esc(day[rk]||"")}"></td>`;
    } else if(cr){
      h+=selCell(dk,rk,(cr.options||[]).filter(Boolean),day[rk]);
    } else if(rk==="axis_morning"||rk==="axis_noon"){
      /* only the axes this day's entry/exit actually permits */
      const kind=rk==="axis_morning"?"entry":"exit";
      const allowed=day[kind]?allowedAxesFor(kind,day[kind]):axisLetters();
      h+=selCell(dk,rk,axisValues().filter(v=>allowed.includes(axisLetterOf(v))),day[rk]);
    } else {
      const cls=(rk==="vehicle_morning"||rk==="vehicle_noon")&&day[rk]===CFG.special_values.vehicle_special?"cell-yellow":"";
      h+=selCell(dk,rk,opts(ROW_OPTS[rk]||""),day[rk],cls);
    }
  }
  return h+"</tr>";
}

/* rows renamed on the Labels tab: not sections (named by their workplace),
   not the extra task (its own tab), not custom rows (their own editor) */
/* Every schedule row, and what the Rows tab may do with it:
   "fixed"   — built in; labels editable, never deletable
   "section" — named by its workplace, "extra" — named by its task: both
               read-only here so the name keeps one home
   "custom"  — added by the user; fully editable and deletable */
function rowKind(k){
  if(customKeys().includes(k)) return "custom";
  if(sectionRowKeys().includes(k)) return "section";
  if(extraRowKeys().includes(k)) return "extra";
  return "fixed";
}
function labelledRowKeys(){ return naturalRowKeys(); }
/* every identifier a new row must not collide with */
function takenRowKeys(){
  const out=new Set(naturalRowKeys().concat(legacyVacFields(),
    ["dates","days","vacation","trip","date"]));
  Object.keys(I18N.he).forEach(k=>{ if(k.startsWith("row_")) out.add(k.slice(4)); });
  (CFG.custom_rows||[]).forEach(r=>{ if(r&&r.key) out.add(r.key); });
  return out;
}
function normalizeRowKey(v){
  return String(v||"").trim().toLowerCase()
    .replace(/[^a-z0-9_]+/g,"_")     // any run of stray characters becomes one _
    .replace(/_+/g,"_")
    .replace(/^_+|_+$/g,"");
}

/* ═══════════════ screen 4: stats ═══════════════ */
function computeStats(schedules){
  const roles=sectionRowKeys();                 // one column per workplace role
  const emps=allEmps();
  const empC={}; emps.forEach(e=>{ empC[e]={}; roles.forEach(r=>empC[e][r]=0); });
  const vac={}, trip={}, oth={}; emps.forEach(e=>{vac[e]=0;trip[e]=0;oth[e]=0;});
  const fields=["entry","exit","escort_morning","escort_noon","arrival_point","theater",
    "vehicle_morning","axis_morning","wait_morning","taxi_apt","taxi_arrival",
    "vehicle_noon","axis_noon","wait_noon","taxi_emb","taxi_arrival_noon"]
    .concat(extraRowKeys())
    .concat(customRows().filter(r=>r.input==="select").map(r=>r.key));
  const fieldC={}; fields.forEach(f=>fieldC[f]={});
  let nd=0;
  schedules.forEach(days=>{ for(const dk in days){ const day=days[dk]; nd++;
    /* a section may hold a pair ("A+B") — credit both */
    roles.forEach(r=>String(day[r]||"").split("+").forEach(e=>{ if(e&&empC[e]) empC[e][r]++; }));
    fields.forEach(f=>{ const v=day[f]; if(v) fieldC[f][v]=(fieldC[f][v]||0)+1; });
    awayList(day,"vacation").forEach(e=>{ if(vac[e]!=null) vac[e]++; });
    awayList(day,"trip").forEach(e=>{ if(trip[e]!=null) trip[e]++; });
    const o=day.other_empl; if(o&&oth[o]!=null) oth[o]++;
  }});
  return {empC,fieldC,nd,vac,trip,oth,roles};
}

    const counts=st.fieldC[f]; const total=Object.values(counts).reduce((a,b)=>a+b,0);
    if(!total) continue;
    h+=`<h3 style="font-size:.9rem">${esc(rowLabel(f))}</h3><div class="tbl-wrap"><table class="stats"><tr>`;
    const vals=Object.keys(counts).sort();
    vals.forEach(v=>h+=`<th>${esc(v)}</th>`); h+=`</tr><tr>`;
    vals.forEach(v=>{ const p=Math.round(counts[v]/total*100);
      h+=`<td>${counts[v]} <small>(${p}%)</small><div class="bar"><i style="width:${p}%"></i></div></td>`; });
    h+=`</tr></table></div>`;
  }
  return h+`</div>`;
}

/* ═══════════════ settings: change log ═══════════════ */
function logPanel(){
  const rows=loadLog();
  let h=`<div class="hint">${t("log_hint",{n:LOG_SHOW})}</div>`;
  if(!rows.length) return h+`<div class="msg warn">${t("log_empty")}</div>`;
  h+=`<div class="tbl-wrap" style="max-height:420px"><table class="stats log-tbl">
    <tr><th>${t("log_time")}</th><th>${t("log_action")}</th>
        <th>${t("log_details")}</th><th>${t("log_changes")}</th></tr>`;
  rows.slice(0,LOG_SHOW).forEach(r=>{
    const st=LOG_STYLE[r.action]||{icon:"•", cls:""};
    h+=`<tr class="${st.cls}"><td>${esc(fmtLogTime(r.timestamp))}</td>
      <td>${st.icon} ${esc(t("act_"+r.action))}</td>
      <td style="text-align:start">${esc(logDetails(r))}</td>
      <td>${r.changes?esc(r.changes):""}</td></tr>`;
  });
  h+=`</table></div>`;
  if(S.pendingConfirm==="clearlog")
    h+=`<div class="msg warn">${t("log_clear_q")}
      <button class="btn small warn" id="logClearYes">✓ ${t("yes")}</button>
      <button class="btn small" data-cancel-confirm="1">✗ ${t("no")}</button></div>`;
  h+=`<p class="row-flex"><button class="btn" id="logExport">${t("log_export")}</button>
    <button class="btn warn" id="logClear">${t("log_clear")}</button></p>`;
  return h;
}
function logCsv(){
  const q=v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`;
  const rows=[[t("log_time"),t("log_action"),t("log_details"),t("log_changes"),t("week_start")]];
  loadLog().forEach(r=>rows.push([fmtLogTime(r.timestamp), t("act_"+r.action),
    logDetails(r), r.changes||"", r.week||""]));
  return "\ufeff"+rows.map(r=>r.map(q).join(",")).join("\r\n");
}
