    {he:"בחר תאריך בשדה תחילת שבוע.",
     en:"Pick a date in the Week start field.",
     es:"Elige una fecha en Inicio de semana."},
    {he:"לחץ 🔄 צור סידור. תיפתח טבלה עם ימי העבודה שהגדרת.",
     en:"Press 🔄 New Schedule. A table opens with the working days you defined.",
     es:"Pulsa 🔄 Nuevo Horario. Se abre una tabla con los días que definiste."}]},
  {p:{he:"אם כבר קיים סידור שמור לאותו שבוע — המערכת תשאל לפני שהיא דורסת אותו.",
      en:"If a schedule already exists for that week, the app asks before replacing it.",
      es:"Si ya existe un horario para esa semana, la app pregunta antes de reemplazarlo."}},

  {h:{he:"2. הזנה ידנית", en:"2. Filling in by hand", es:"2. Completar a mano"}},
  {steps:[
    {he:"לחץ על תא בטבלה. תיפתח רשימה עם האפשרויות שהגדרת לשורה הזאת.",
     en:"Click a cell. A list opens with the options you defined for that row.",
     es:"Pulsa una celda. Se abre una lista con las opciones de esa fila."},
    {he:"בחר ערך. הוא נכנס לתא ונשמר מיד — אין כפתור שמירה לתא.",
     en:"Choose a value. It enters the cell and saves at once — there is no per-cell save button.",
     es:"Elige un valor. Entra en la celda y se guarda al instante — no hay botón por celda."}]},
  {tip:{he:"ערך שהזנת ידנית לא יידרס בשיבוץ האוטומטי. מלא קודם את מה שאתה כבר יודע.",
        en:"A value you entered by hand is never overwritten by the automatic assignment. Fill in what you already know first.",
        es:"Un valor que escribiste a mano nunca se sobrescribe con la asignación automática. Completa primero lo que ya sabes."}},

  {h:{he:"3. שיבוץ אוטומטי", en:"3. Automatic assignment", es:"3. Asignación automática"}},
  {p:{he:"כשסיימת למלא ידנית — לחץ ⚡ שיבוץ אוטומטי. המערכת תמלא את כל התאים הריקים.",
      en:"When you have filled in what you wanted, press ⚡ Auto Assign. The app fills every empty cell.",
      es:"Cuando termines a mano, pulsa ⚡ Asignación Automática. La app llena todas las celdas vacías."}},
  {p:{he:"היא מחליטה לפי חמישה דברים, בסדר הזה:",
      en:"It decides using five things, in this order:",
      es:"Decide usando cinco cosas, en este orden:"}},
  {li:[
    {he:"היעדים השבועיים שהגדרת.",
     en:"The weekly quotas you set.", es:"Las metas semanales que fijaste."},
    {he:"אחוזי האיזון שהגדרת.",
     en:"The balance percentages you set.", es:"Los porcentajes de equilibrio que fijaste."},
    {he:"ההיסטוריה של 90 הימים האחרונים.",
     en:"The history of the last 90 days.", es:"El historial de los últimos 90 días."},
    {he:"מי בחופשה — הוא לא ישובץ.",
     en:"Who is away — they are not placed.", es:"Quién está ausente — no se le asigna."},
    {he:"סדר העדיפות של מקומות העבודה.",
     en:"The priority order of the workplaces.", es:"El orden de prioridad de los lugares."}]},
  {p:{he:"אחרי השיבוץ — עבור על הסידור ותקן ידנית מה שצריך. אפשר ללחוץ שוב על שיבוץ אוטומטי בכל רגע.",
      en:"After it runs, look the schedule over and fix anything by hand. You can press Auto Assign again at any time.",
      es:"Después, revisa el horario y corrige a mano lo que haga falta. Puedes volver a pulsar Asignación Automática cuando quieras."}},

  {h:{he:"4. בדיקת תקינות", en:"4. Checking it", es:"4. Revisarlo"}},
  {p:{he:"בראש הדף מופיע סימן מצב: ✓ תקין בירוק, או ⚠️ עם מספר באדום.",
      en:"A status badge sits at the top: ✓ Valid in green, or ⚠️ with a number in red.",
      es:"Arriba hay una insignia: ✓ Válido en verde, o ⚠️ con un número en rojo."}},
  {p:{he:"לחץ על הסימן וייפתח פאנל בצד עם כל ההודעות. סגירה: ✕ או מקש Esc.",
      en:"Click the badge and a side panel opens with every message. Close it with ✕ or Esc.",
      es:"Pulsa la insignia y se abre un panel lateral con todos los mensajes. Ciérralo con ✕ o Esc."}},
  {p:{he:"הודעות נפוצות: עובד שובץ ביום שהוא בחופשה, יעד שבועי שלא הושג, או ערך שאינו תואם לכלל שהגדרת.",
      en:"Common messages: someone placed on a day they are away, a weekly quota not met, or a value that breaks a rule you set.",
      es:"Mensajes comunes: alguien asignado en un día ausente, una meta no cumplida, o un valor que rompe una regla."}},
  {tip:{he:"אזהרה אינה חוסמת. אפשר לשמור סידור גם כשיש אזהרות — היא רק מסבה את תשומת ליבך.",
        en:"A warning does not block you. You can save with warnings showing — it only points something out.",
        es:"Un aviso no te bloquea. Puedes guardar con avisos — solo señala algo."}},

  {h:{he:"5. שמירת הסידור", en:"5. Saving the schedule", es:"5. Guardar el horario"}},
  {p:{he:"כשהסידור מוכן — לחץ 💾 שמור. הוא נשמר בארכיון עם התאריך שלו ומצטרף להיסטוריה.",
      en:"When it is ready, press 💾 Save. It goes to the archive under its date and joins the history.",
      es:"Cuando esté listo, pulsa 💾 Guardar. Va al archivo con su fecha y se suma al historial."}},
  {warn:{he:"אל תשכח לשמור. סידור שלא נשמר לא יופיע בסטטיסטיקה, והמערכת לא תלמד ממנו. נקודה כתומה ליד הכפתור מסמנת שיש שינויים שלא נשמרו.",
         en:"Do not forget to save. An unsaved schedule never reaches the statistics and the app learns nothing from it. An orange dot beside the button means there are unsaved changes.",
         es:"No olvides guardar. Un horario sin guardar no llega a las estadísticas y la app no aprende de él. Un punto naranja junto al botón indica cambios sin guardar."}},

  {h:{he:"6. ייצוא והדפסה", en:"6. Export and print", es:"6. Exportar e imprimir"}},
  {li:[
    {he:"📤 ייצוא Excel — מוריד קובץ שאפשר לפתוח באקסל או בגיליון אחר.",
     en:"📤 Export Excel — downloads a file you can open in Excel or another spreadsheet.",
     es:"📤 Exportar Excel — descarga un archivo para abrir en Excel u otra hoja de cálculo."},
    {he:"🖨️ הדפסה — פותח תצוגת הדפסה מוכנה. אפשר גם לשמור ממנה כ-PDF.",
     en:"🖨️ Print — opens a print-ready view. You can save it as a PDF from there.",
     es:"🖨️ Imprimir — abre una vista lista para imprimir. Desde ahí puedes guardar en PDF."},
    {he:"נקה — מרוקן את השבוע הנוכחי ומשאיר טבלה ריקה.",
     en:"Clear — empties the current week and leaves a blank table.",
     es:"Limpiar — vacía la semana actual y deja una tabla en blanco."}]}]},

{ id:"vacation", icon:"🏖",
  title:{he:"ניהול חופשות", en:"Managing time off", es:"Gestionar las ausencias"},
  blocks:[
  {steps:[
    {he:"בדף הסידור, גלול לשורה חופשות בתחתית הטבלה.",
     en:"On the Schedule page, scroll to the Vacations row at the bottom of the table.",
     es:"En la página Horario, baja a la fila Vacaciones al final de la tabla."},
    {he:"בכל יום תראה רשימה אחת לכל קבוצה. בחר את שם העובד שנמצא בחופשה.",
     en:"Each day shows one list per group. Choose the name of whoever is away.",
     es:"Cada día muestra una lista por grupo. Elige a quien esté ausente."},
    {he:"עשה זאת לפני שאתה לוחץ על שיבוץ אוטומטי.",
     en:"Do this before you press Auto Assign.",
     es:"Hazlo antes de pulsar Asignación Automática."}]},
  {p:{he:"עובד שסומן בחופשה לא ישובץ לאף משימה באותו יום, והשיבוץ האוטומטי ידלג עליו לגמרי.",
      en:"Someone marked as away is not placed in any job that day, and the automatic assignment skips them entirely.",
      es:"Quien está marcado como ausente no se asigna a ningún trabajo ese día, y la asignación automática lo omite."}},
  {warn:{he:"חופשות מוזנות ידנית בלבד. המערכת לא יודעת עליהן עד שתזין אותן — אם תשבץ קודם ותסמן אחר כך, השיבוץ לא יתעדכן לבד.",
         en:"Time off is entered by hand only. The app knows nothing about it until you enter it — if you assign first and mark afterwards, the assignment does not update itself.",
         es:"Las ausencias se ingresan solo a mano. La app no las conoce hasta que las ingreses — si asignas primero y marcas después, la asignación no se actualiza sola."}}]},

{ id:"archive", icon:"📁",
  title:{he:"הארכיון והגיבוי", en:"Archive and backups", es:"Archivo y respaldos"},
  blocks:[
  {h:{he:"צפייה בסידורים ישנים", en:"Looking at past schedules", es:"Ver horarios anteriores"}},
  {steps:[
    {he:"לחץ על 📁 ארכיון בסרגל העליון.",
     en:"Press 📁 Archive in the top bar.",
     es:"Pulsa 📁 Archivo en la barra superior."},
    {he:"הסידורים מקובצים לפי חודש. לחץ על חודש כדי לפתוח אותו.",
     en:"Schedules are grouped by month. Click a month to open it.",
     es:"Los horarios se agrupan por mes. Pulsa un mes para abrirlo."},
    {he:"לחץ טען כדי להחזיר סידור לדף הסידור ולערוך אותו, או CSV כדי לייצא אותו.",
     en:"Press Load to bring a schedule back to the Schedule page for editing, or CSV to export it.",
     es:"Pulsa Cargar para devolver un horario al Horario y editarlo, o CSV para exportarlo."}]},

  {h:{he:"גיבוי — חשוב מאוד", en:"Backups — this really matters", es:"Respaldos — esto importa mucho"}},
  {p:{he:"לחץ 📤 גיבוי הכול. יירד קובץ אחד שמכיל את כל ההגדרות ואת כל הסידורים השמורים.",
      en:"Press 📤 Back up everything. One file downloads holding all your settings and every saved schedule.",
      es:"Pulsa 📤 Respaldar todo. Se descarga un archivo con toda la configuración y los horarios."}},
  {p:{he:"עשה גיבוי לפני כל שינוי גדול בהגדרות, פעם בשבוע כהרגל, ולפני מעבר למכשיר חדש.",
      en:"Back up before any large settings change, once a week as a habit, and before moving to a new device.",
      es:"Respalda antes de cualquier cambio grande, una vez por semana como hábito, y antes de cambiar de dispositivo."}},
  {warn:{he:"הנתונים חיים רק בדפדפן של המכשיר הזה. ניקוי היסטוריית הגלישה או הסרת האפליקציה עלולים למחוק אותם. הגיבוי הוא ההגנה היחידה.",
         en:"Your data lives only in this device's browser. Clearing browsing data or removing the app can erase it. A backup is your only protection.",
         es:"Tus datos viven solo en el navegador de este dispositivo. Borrar datos de navegación o quitar la app puede eliminarlos. El respaldo es tu única protección."}},

  {h:{he:"שחזור מגיבוי", en:"Restoring a backup", es:"Restaurar un respaldo"}},
  {steps:[
    {he:"לחץ 📥 שחזור מגיבוי.",
     en:"Press 📥 Restore from backup.", es:"Pulsa 📥 Restaurar respaldo."},
    {he:"בחר את קובץ הגיבוי שהורדת קודם.",
     en:"Choose the backup file you downloaded earlier.",
     es:"Elige el archivo de respaldo que descargaste antes."},
    {he:"אשר. כל הנתונים ישוחזרו.",
     en:"Confirm. Everything is restored.", es:"Confirma. Todo se restaura."}]},
  {warn:{he:"שחזור דורס את כל הנתונים הקיימים במכשיר. ודא שאתה בוחר את הקובץ הנכון.",
         en:"Restoring overwrites everything already on the device. Make sure you pick the right file.",
         es:"Restaurar sobrescribe todo lo que ya hay en el dispositivo. Asegúrate de elegir el archivo correcto."}},

  {h:{he:"ייצוא וייבוא הגדרות", en:"Exporting and importing settings", es:"Exportar e importar configuración"}},
  {p:{he:"בדף ההגדרות, בראש הדף, יש 📤 ייצוא הגדרות ו-📥 ייבוא הגדרות.",
      en:"At the top of the Settings page there is 📤 Export settings and 📥 Import settings.",
      es:"Arriba en Configuración están 📤 Exportar configuración y 📥 Importar configuración."}},
  {p:{he:"אלה מעבירים את ההגדרות בלבד — בלי הסידורים השמורים. שימושי כשמעבירים תחנה למכשיר נוסף.",
      en:"These move the settings alone, without the saved schedules. Useful when setting a station up on another device.",
      es:"Estos mueven solo la configuración, sin los horarios. Útil al montar una estación en otro dispositivo."}}]},

{ id:"stats", icon:"📊",
  title:{he:"סטטיסטיקה", en:"Statistics", es:"Estadísticas"},
  blocks:[
  {h:{he:"מה רואים", en:"What you see", es:"Qué ves"}},
  {p:{he:"למעלה בוחרים תקופה: השבוע הנוכחי, חודש, או שנה. כל המספרים מתייחסים לתקופה שבחרת.",
      en:"At the top you pick a period: the current week, a month, or a year. Every number refers to it.",
      es:"Arriba eliges un período: la semana actual, un mes o un año. Todos los números se refieren a él."}},
  {li:[
    {he:"טבלת עובדים — כמה פעמים כל עובד מילא כל תפקיד.",
     en:"An employee table — how many times each person filled each role.",
     es:"Una tabla de personal — cuántas veces cada persona cubrió cada puesto."},
    {he:"ניצול חופשה — כמה ימים נוצלו מתוך התקציב של כל עובד.",
     en:"Vacation usage — how many days each person used out of their budget.",
     es:"Uso de vacaciones — cuántos días usó cada persona de su presupuesto."},
    {he:"חלוקת ערכים — כמה פעמים הופיע כל ערך בכל שורה.",
     en:"Value distribution — how many times each value appeared in each row.",
     es:"Distribución de valores — cuántas veces apareció cada valor en cada fila."}]},

  {h:{he:"איך לקרוא", en:"How to read it", es:"Cómo leerlo"}},
  {p:{he:"כל ערך מוצג כמספר, לצידו אחוז, ומתחת פס באורך יחסי. פס ארוך יותר — שובץ יותר פעמים.",
      en:"Each value shows a count, a percentage beside it, and a bar sized to match. A longer bar means it came up more often.",
      es:"Cada valor muestra un conteo, un porcentaje al lado y una barra proporcional. Barra más larga, más veces."}},
  {p:{he:"בעמודת סה״כ שיבוצים, מספר באדום מסמן עובד שרחוק יותר מעשרים אחוז מהממוצע של כולם.",
      en:"In the Total assignments column, a red number marks someone more than twenty percent away from everyone's average.",
      es:"En la columna Total asignaciones, un número rojo marca a quien está a más del veinte por ciento del promedio."}},

  {h:{he:"מה לעשות כשיש פערים", en:"What to do about gaps", es:"Qué hacer con las diferencias"}},
  {p:{he:"פער בשבוע אחד הוא נורמלי לגמרי. בדוק על פני חודש — שם האיזון אמור להתיישר.",
      en:"A gap in a single week is completely normal. Check across a month — that is where things even out.",
      es:"Una diferencia en una sola semana es normal. Mira el mes — ahí es donde se nivela."}},
  {p:{he:"אם פער גדול נשאר גם אחרי חודש, הסיבה בדרך כלל אחת משלוש: חופשות, יעדים שבועיים, או אחוזי איזון שהגדרת.",
      en:"If a large gap survives a month, the cause is usually one of three: time off, weekly quotas, or balance percentages you set.",
      es:"Si una diferencia grande dura un mes, la causa suele ser una de tres: ausencias, metas semanales o porcentajes que fijaste."}},
  {tip:{he:"כדאי להציץ בסטטיסטיקה פעם בחודש. אפשר גם לייצא אותה ל-CSV ולבדוק בגיליון.",
        en:"Look at the statistics once a month. You can also export them to CSV and check in a spreadsheet.",
        es:"Revisa las estadísticas una vez al mes. También puedes exportarlas a CSV y revisarlas en una hoja."}}]},

{ id:"move", icon:"📱",
  title:{he:"העברה למכשיר אחר", en:"Moving to another device", es:"Pasar a otro dispositivo"},
  blocks:[
  {p:{he:"רוצה להשתמש במערכת גם על טאבלט או על מחשב אחר? כך עושים זאת.",
      en:"Want to use the app on a tablet or another computer too? Here is how.",
      es:"¿Quieres usar la app también en una tableta u otra computadora? Así se hace."}},
  {steps:[
    {he:"על המכשיר הישן: 📁 ארכיון ← 📤 גיבוי הכול. יירד קובץ.",
     en:"On the old device: 📁 Archive → 📤 Back up everything. A file downloads.",
     es:"En el dispositivo viejo: 📁 Archivo → 📤 Respaldar todo. Se descarga un archivo."},
    {he:"שלח את הקובץ למכשיר החדש — בדוא״ל, בהודעה, או בכל דרך נוחה.",
     en:"Send the file to the new device — by email, by message, or any way you like.",
     es:"Envía el archivo al dispositivo nuevo — por correo, mensaje o como prefieras."},
    {he:"על המכשיר החדש: פתח את הדפדפן והיכנס לכתובת האפליקציה.",
     en:"On the new device: open the browser and go to the app's address.",
     es:"En el dispositivo nuevo: abre el navegador y entra a la dirección de la app."},
    {he:"📁 ארכיון ← 📥 שחזור מגיבוי ← בחר את הקובץ ואשר.",
     en:"📁 Archive → 📥 Restore from backup → choose the file and confirm.",
     es:"📁 Archivo → 📥 Restaurar respaldo → elige el archivo y confirma."}]},
  {tip:{he:"רוצה להעביר רק את ההגדרות, בלי הסידורים? השתמש ב-📤 ייצוא הגדרות ו-📥 ייבוא הגדרות בדף ההגדרות.",
        en:"Want to move only the settings, without the schedules? Use 📤 Export settings and 📥 Import settings on the Settings page.",
        es:"¿Solo quieres mover la configuración, sin los horarios? Usa 📤 Exportar configuración y 📥 Importar configuración."}}]},

{ id:"faq", icon:"❓",
  title:{he:"שאלות נפוצות", en:"Common questions", es:"Preguntas frecuentes"},
  blocks:[
  {qa:[
   {q:{he:"האם הנתונים שלי מאובטחים?", en:"Is my data safe?", es:"¿Están seguros mis datos?"},
    a:{he:"כל הנתונים שמורים רק על המכשיר שלך. שום מידע לא נשלח לאינטרנט ולא לשום שרת.",
       en:"Everything is stored on your device alone. No information is sent to the internet or to any server.",
       es:"Todo se guarda solo en tu dispositivo. No se envía información a internet ni a ningún servidor."}},
   {q:{he:"מה קורה אם אמחק את האפליקציה?", en:"What if I remove the app?", es:"¿Y si quito la app?"},
    a:{he:"הנתונים עלולים להימחק יחד איתה. לכן חשוב לגבות באופן קבוע.",
       en:"Your data may be erased with it. That is why regular backups matter.",
       es:"Tus datos pueden borrarse con ella. Por eso importan los respaldos regulares."}},
   {q:{he:"אפשר לעבוד בלי אינטרנט?", en:"Can I work without internet?", es:"¿Puedo trabajar sin internet?"},
    a:{he:"כן. אחרי הביקור הראשון האפליקציה נשמרת על המכשיר ועובדת במלואה בלי חיבור.",
       en:"Yes. After your first visit the app is stored on the device and works fully offline.",
       es:"Sí. Tras la primera visita la app queda en el dispositivo y funciona sin conexión."}},
   {q:{he:"איך מעדכנים את האפליקציה?", en:"How do I update it?", es:"¿Cómo la actualizo?"},
    a:{he:"פתח אותה פעם אחת עם חיבור לאינטרנט. העדכון מתבצע לבד, וההגדרות והסידורים שלך נשארים.",
       en:"Open it once while online. The update happens by itself, and your settings and schedules stay.",
       es:"Ábrela una vez con conexión. La actualización ocurre sola y tu configuración y horarios se mantienen."}},

/* ═══════════════ export & print ═══════════════ */
function scheduleCsv(days){
  const keys=Object.keys(days).sort();
  const BOM="﻿"; const q=v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`;
  let rows=[[t("row_dates"),...keys.map(fmtDM)],[t("row_days"),...keys.map(dayLabel)]];
  for(const rk of reorderableKeys()){
    if(AWAY_ROWS.includes(rk)){
      rows.push([rowLabel(rk),...keys.map(k=>awayList(days[k],rk).join(", "))]);
    } else rows.push([rowLabel(rk),...keys.map(k=>days[k][rk]||"")]);
  }
  return BOM+rows.map(r=>r.map(q).join(",")).join("\r\n");
}
function statsCsv(st,label){
  const q=v=>`"${String(v==null?"":v).replace(/"/g,'""')}"`;
  const lines=[[label],[],
    [t("st_employees")],
    ["",...st.roles.map(r=>rowLabel(r)),t("total_col"),t("st_vac_col"),t("row_trip"),t("st_other")]];
  allEmps().forEach(e=>{
    const tot=st.roles.reduce((s,r)=>s+(st.empC[e]?st.empC[e][r]:0),0);
    lines.push([e,...st.roles.map(r=>st.empC[e]?st.empC[e][r]:0),tot,
      st.vac[e]||0,(st.trip&&st.trip[e])||0,st.oth[e]||0]);
  });
  lines.push([]);
  lines.push([t("st_fields")]);
  for(const f in st.fieldC){
    const c=st.fieldC[f]; const tt=Object.values(c).reduce((a,b)=>a+b,0);
    if(!tt) continue;
    const vs=Object.keys(c).sort();
    lines.push([rowLabel(f),...vs]);
    lines.push(["",...vs.map(v=>c[v])]);
  }
  return "﻿"+lines.map(r=>r.map(q).join(",")).join("\r\n");
}
function downloadCsv(days,weekStart){
  const blob=new Blob([scheduleCsv(days)],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download=`schedule_${weekStart}.csv`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}
function doPrint(){
  if(!S.days) return;
  const keys=Object.keys(S.days).sort();
  const VS=CFG.special_values.vehicle_special;
  let h=`<h2>📅 ${esc(t("app_title"))} — ${keys[0]} → ${keys[keys.length-1]}</h2><table><tr><th></th>`;
  keys.forEach(dk=>h+=`<th>${esc(dayLabel(dk))}<br>${fmtDM(dk)}</th>`);
  h+=`</tr>`;
  for(const rk of reorderableKeys()){
    if(AWAY_ROWS.includes(rk)){
      h+=`<tr><td class="label">${esc(rowLabel(rk))}</td>${keys.map(k=>`<td>${esc(awayList(S.days[k],rk).join(", "))}</td>`).join("")}</tr>`;
    } else {
      h+=`<tr><td class="label">${esc(rowLabel(rk))}</td>${keys.map(k=>{
        const v=S.days[k][rk]||"";
        const y=(rk==="vehicle_morning"||rk==="vehicle_noon")&&v===VS;
        return `<td class="${y?"y":""}">${esc(v)}</td>`; }).join("")}</tr>`;
    }
  }
  document.getElementById("printArea").innerHTML=h+"</table>";
  window.print();
}

function wire(){

    const gn=$("genNo"); if(gn) gn.onclick=()=>{ S.pendingConfirm=null; render(); };
    if($("btnClear")) $("btnClear").onclick=()=>{ S.pendingConfirm="clear"; render(); };
    const cy=$("clearYes"); if(cy) cy.onclick=()=>{ S.pendingConfirm=null;
      S.days=emptyWeek(Object.keys(S.days).sort()[0]); S.dirty=true; saveDraft(); render(); };
    const cn=$("clearNo"); if(cn) cn.onclick=()=>{ S.pendingConfirm=null; render(); };
    if($("btnAuto")) $("btnAuto").onclick=autoAssign;
    if($("btnSave")) $("btnSave").onclick=()=>{ const a=loadArchive();
      const wk=Object.keys(S.days).sort()[0];
      a[wk]=S.days; saveArchive(a);
      S.dirty=false; saveDraft(); updateStatus(); toast("✅ "+t("saved"));
      logAction("save_schedule","log_saved",{w:wk},{week:wk,changes:filledCells(S.days)});
      if(S.screen==="settings") render(); };
    if($("btnCsv")) $("btnCsv").onclick=()=>{
      const wk=Object.keys(S.days).sort()[0];
      downloadCsv(S.days,wk);
      logAction("export_excel","log_export_week",{w:wk},{week:wk}); };
    if($("btnPrint")) $("btnPrint").onclick=doPrint;
    const sb=$("statusBadge");

    if($("warnClose")) $("warnClose").onclick=()=>openWarnings(false);
    if($("warnScrim")) $("warnScrim").onclick=()=>openWarnings(false);
    closeAwayPop();
    document.querySelectorAll("table.sched .tagbox").forEach(box=>{
      box.onclick=ev=>{
        const rm=ev.target.closest("[data-rm]");
        if(rm){ ev.stopPropagation();
          toggleAway(box.dataset.dk, box.dataset.away, rm.dataset.rm, false);
          return; }
        openAwayPop(box);
      };
    });
    document.querySelectorAll("table.sched select,table.sched input:not([data-away])").forEach(el=>{
      el.onchange=()=>{ S.days[el.dataset.dk][el.dataset.f]=el.value; S.dirty=true; saveDraft();
        const rerender=sectionRowKeys().concat(extraRowKeys(),
          ["vehicle_morning","vehicle_noon","theater","other_empl","entry","exit"]);
        if(rerender.includes(el.dataset.f)) render();
        else updateStatus(); };
    });
  }
  else if(S.screen==="settings"){ wireSettings(); }
  else if(S.screen==="archive"){
    $("btnBackup").onclick=()=>{
      downloadJson(backupData(), `agenda_backup_${new Date().toISOString().slice(0,10)}.json`);
      logAction("backup","log_backup",null,
        {changes:Object.keys(loadArchive()).length}); };
    $("btnRestore").onclick=()=>$("restoreFile").click();
    $("restoreFile").onchange=e=>{
      const f=e.target.files[0]; if(!f) return;
      readJsonFile(f,d=>{
        if(!d||(!d.config&&!d.archive)){ toast("⚠️ "+t("invalid_file")); return; }
        window.__restoreData=d; S.pendingConfirm="restore"; render();
      });
      e.target.value="";
    };
    const ry=$("restoreYes"); if(ry) ry.onclick=()=>{
      applyRestore(window.__restoreData||{}); window.__restoreData=null;
      S.pendingConfirm=null; S.days=null; S.dirty=false;
      localStorage.removeItem(LS.draft);
      logAction("restore","log_restore",null,{changes:Object.keys(loadArchive()).length});
      toast("✅ "+t("restore_done")); render(); };
    const rn=$("restoreNo"); if(rn) rn.onclick=()=>{
      window.__restoreData=null; S.pendingConfirm=null; render(); };
    document.querySelectorAll("[data-load]").forEach(b=>b.onclick=()=>{
      const wk=b.dataset.load; S.days=JSON.parse(JSON.stringify(loadArchive()[wk])); S.weekStart=wk;
      Object.values(S.days).forEach(normalizeAway);
      S.dirty=false; saveDraft(); S.screen="sched"; toast("✅ "+t("loaded")); render(); });
    document.querySelectorAll("[data-csv]").forEach(b=>b.onclick=()=>{
      downloadCsv(loadArchive()[b.dataset.csv], b.dataset.csv);
      logAction("export_excel","log_export_week",{w:b.dataset.csv},{week:b.dataset.csv}); });
    document.querySelectorAll("[data-delarch]").forEach(b=>b.onclick=()=>{S.pendingConfirm="delarch_"+b.dataset.delarch;render();});
    document.querySelectorAll("[data-delarch-yes]").forEach(b=>b.onclick=()=>{

      S.pendingConfirm=null; toast("🗑 "+t("deleted")); render(); });
  }
  else if(S.screen==="guide"){
    /* One chapter at a time. The open state is set here rather than left to
       the native toggle, whose events fire asynchronously and race each other
       when one chapter closes another. */
    document.querySelectorAll("details.guide-ch").forEach(d=>{
      d.querySelector("summary").onclick=ev=>{
        ev.preventDefault();
        const wasOpen=d.open;
        document.querySelectorAll("details.guide-ch").forEach(o=>{ o.open=false; });
        d.open=!wasOpen;
        if(d.open) d.scrollIntoView({behavior:"smooth", block:"start"});
      };
    });

  else if(S.screen==="stats"){
    $("statsTab").onchange=e=>{S.statsTab=e.target.value;render();};

    const sy=$("statsYear"); if(sy) sy.onchange=e=>{S.statsYear=e.target.value;render();};

      const x=window.__statsExport; if(!x) return;

      a.href=URL.createObjectURL(blob); a.download=`stats_${x.label.replace(/[^\w-]/g,"_")}.csv`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),3000);
    };
  }
  const lb=$("langBtns");
  lb.innerHTML=[["he","🇮🇱","עברית"],["en","🇺🇸","English"],["es","🇪🇸","Español"]]
    .map(([lg,fl,name])=>`<button class="lang-btn ${S.lang===lg?"active":""}" data-lang-btn="${lg}" title="${name}" aria-label="${name}">${fl}</button>`).join("");
  lb.querySelectorAll("button").forEach(b=>b.onclick=()=>{
    S.lang=b.dataset.langBtn; localStorage.setItem(LS.lang,S.lang); render(); });
}
/* re-open a settings panel by key after a save re-rendered the screen */
function reopen(key){

}
function wireSettings(){
  const $=id=>document.getElementById(id);
  $("btnCfgExport").onclick=()=>{
    downloadJson(cfgSnapshot(), `agenda_settings_${new Date().toISOString().slice(0,10)}.json`);
    logAction("backup","log_cfg_export"); render(); reopen("log"); };
  $("btnCfgImport").onclick=()=>$("importCfgFile").click();
  $("importCfgFile").onchange=e=>{
    const f=e.target.files[0]; if(!f) return;
    readJsonFile(f,d=>{
      const cfgObj=d&&d.config?d.config:d;   // accepts a full backup too
      if(!cfgObj||typeof cfgObj!=="object"||!cfgObj.options){ toast("⚠️ "+t("invalid_file")); return; }
      window.__importCfg=cfgObj; S.pendingConfirm="importcfg"; render();
    });
    e.target.value="";
  };
  const icy=$("importCfgYes"); if(icy) icy.onclick=()=>{
    localStorage.setItem(LS.config, JSON.stringify(window.__importCfg));
    window.__importCfg=null; S.pendingConfirm=null;
    CFG=loadConfig(); logAction("restore","log_cfg_import");
    toast("✅ "+t("import_done")); render(); };
  const icn=$("importCfgNo"); if(icn) icn.onclick=()=>{
    window.__importCfg=null; S.pendingConfirm=null; render(); };
  /* ── employee groups ── */
  const readGroups=()=>{
    document.querySelectorAll("[data-gname]").forEach(inp=>{
      const g=groupById(inp.dataset.gname); if(g) g.name=inp.value.trim(); });
    document.querySelectorAll("[data-gcolor]").forEach(inp=>{
      const g=groupById(inp.dataset.gcolor); if(g) g.color=inp.value; });
    document.querySelectorAll("[data-gemps]").forEach(ta=>{
      const g=groupById(ta.dataset.gemps);
      if(g) g.employees=ta.value.split("\n").map(x=>x.trim()).filter(Boolean); });
  };
  if($("saveGroups")) $("saveGroups").onclick=()=>{
    readGroups();
    /* merge, never replace: an employee removed from a group keeps their
       budget in CFG so it comes back with them */
    const vb={...(CFG.vacation_budget||{})};
    document.querySelectorAll("[data-vb]").forEach(inp=>{ vb[inp.dataset.vb]=parseInt(inp.value||0,10)||0; });
    allEmps().forEach(e=>{ if(vb[e]==null) vb[e]=defaultVacBudget(); });
    CFG.vacation_budget=vb;
    if($("maxAbsence"))
      CFG.max_daily_absence=Math.max(0,Math.min(20,parseInt($("maxAbsence").value,10)||0));
    saveConfig(); resyncDays(); render(); reopen("groups");
  };
  if($("addGroup")) $("addGroup").onclick=()=>{
    readGroups();
    const g=groupsAll().find(x=>!x.active);
    if(!g){ toast("⚠️ "+t("grp_max")); return; }
    g.active=true; if(!g.name) g.name=g.id.toUpperCase();
    saveConfig(); resyncDays(); toast("✅ "+t("grp_added")); render(); reopen("groups");
  };
  document.querySelectorAll("[data-gremove]").forEach(b=>b.onclick=()=>{
    readGroups();
    const g=groupById(b.dataset.gremove); if(!g) return;
    g.active=false;                       // switched off, never deleted
    saveConfig(); resyncDays(); toast("🗑 "+t("grp_removed")); render(); reopen("groups");
  });
  /* ── workplaces & their sections ── */
  const readWps=()=>{
    document.querySelectorAll("[data-wpname]").forEach(inp=>{
      const w=workplacesAll().find(x=>x.id===inp.dataset.wpname); if(w) w.name=inp.value.trim(); });
    document.querySelectorAll("[data-wpprio]").forEach(inp=>{
      const w=workplacesAll().find(x=>x.id===inp.dataset.wpprio);
      if(w) w.priority=Math.max(1,Math.min(MAX_WORKPLACES,parseInt(inp.value,10)||1)); });
    document.querySelectorAll("[data-wpnotes]").forEach(ta=>{
      const w=workplacesAll().find(x=>x.id===ta.dataset.wpnotes); if(w) w.notes=ta.value; });
    const sec=(id,wp)=>{ const w=workplacesAll().find(x=>x.id===wp);
      return w?(w.sections||[]).find(x=>x.id===id):null; };
    document.querySelectorAll("[data-wpminsec]").forEach(inp=>{
      const w=workplacesAll().find(x=>x.id===inp.dataset.wpminsec);
      if(w) w.min_sections_filled=Math.max(0,Math.min(10,parseInt(inp.value,10)||0)); });
    document.querySelectorAll("[data-scname]").forEach(inp=>{
      const x=sec(inp.dataset.scname,inp.dataset.wp); if(x) x.name=inp.value.trim(); });
    document.querySelectorAll("[data-scgroup]").forEach(sl=>{
      const x=sec(sl.dataset.scgroup,sl.dataset.wp); if(x) x.group_id=sl.value; });
    document.querySelectorAll("[data-scsize]").forEach(inp=>{
      const x=sec(inp.dataset.scsize,inp.dataset.wp);
      if(x) x.max_workers=Math.max(0,Math.min(10,parseInt(inp.value,10)||0)); });
    document.querySelectorAll("[data-scmin]").forEach(inp=>{
      const x=sec(inp.dataset.scmin,inp.dataset.wp);
      if(x) x.min_workers=Math.max(0,Math.min(10,parseInt(inp.value,10)||0)); });
    document.querySelectorAll("[data-screq]").forEach(cb=>{
      const x=sec(cb.dataset.screq,cb.dataset.wp); if(x) x.required=cb.checked; });
  };
  if($("saveWps")) $("saveWps").onclick=()=>{
    readWps(); saveConfig(); resyncDays(); render(); reopen("workplaces"); };
  if($("addWp")) $("addWp").onclick=()=>{
    readWps();
    const w=workplacesAll().find(x=>!x.active);
    if(!w){ toast("⚠️ "+t("wp_max")); return; }
    w.active=true; if(!w.name) w.name=w.id.toUpperCase();
    /* a newly switched-on workplace goes to the end of the staffing order */
    w.priority=Math.min(MAX_WORKPLACES,
      Math.max(0,...workplacesAll().filter(x=>x.active).map(x=>x.priority||0))+1);
    saveConfig(); resyncDays(); render(); reopen("workplaces");
  };
  document.querySelectorAll("[data-wpremove]").forEach(b=>b.onclick=()=>{
    readWps();
    const w=workplacesAll().find(x=>x.id===b.dataset.wpremove); if(!w) return;
    w.active=false;
    saveConfig(); resyncDays(); render(); reopen("workplaces");
  });
  /* ↑↓ swap a workplace with its neighbour in staffing order */
  const moveWp=(id,delta)=>{
    readWps();
    const order=activeWorkplaces();
    const i=order.findIndex(w=>w.id===id), j=i+delta;
    if(i<0||j<0||j>=order.length) return;
    const a=order[i], b=order[j], pa=a.priority, pb=b.priority;
    a.priority=pb; b.priority=pa;
    if(pa===pb) a.priority=Math.max(1,Math.min(MAX_WORKPLACES,pb+delta));
    saveConfig(); render(); reopen("workplaces");
  };
  document.querySelectorAll("[data-wpup]").forEach(b=>b.onclick=()=>moveWp(b.dataset.wpup,-1));
  document.querySelectorAll("[data-wpdn]").forEach(b=>b.onclick=()=>moveWp(b.dataset.wpdn,+1));
  document.querySelectorAll("[data-scadd]").forEach(b=>b.onclick=()=>{
    readWps();
    const w=workplacesAll().find(x=>x.id===b.dataset.scadd); if(!w) return;
    const g=activeGroups()[0];
    w.sections=w.sections||[];
    w.sections.push({id:newId("s_"), name:"", group_id:g?g.id:"",
      row_key:newId("sec_"), max_workers:1, required:false});
    saveConfig(); resyncDays(); render(); reopen("workplaces");
  });
  document.querySelectorAll("[data-scremove]").forEach(b=>b.onclick=()=>{
    readWps();
    const w=workplacesAll().find(x=>x.id===b.dataset.wp); if(!w) return;
    w.sections=(w.sections||[]).filter(x=>x.id!==b.dataset.scremove);
    saveConfig(); resyncDays(); render(); reopen("workplaces");
  });
  /* ── working days ── */
  const wdCount=()=>document.querySelectorAll("[data-wd]:checked").length;
  const paintWd=()=>{ const w=$("wdWarn"); if(w) w.style.display=wdCount()?"none":"block"; };
  document.querySelectorAll("[data-wd]").forEach(cb=>cb.onchange=paintWd);
  paintWd();
  if($("saveWorkDays")) $("saveWorkDays").onclick=()=>{
    const days=[...document.querySelectorAll("[data-wd]:checked")].map(cb=>cb.dataset.wd);
    if(!days.length){ toast(t("wd_none")); return; }
    const labels={};
    document.querySelectorAll("[data-wdlbl]").forEach(inp=>{ labels[inp.dataset.wdlbl]=inp.value.trim()||t(inp.dataset.wdlbl); });
    CFG.work_days={
      days:DOW_ORDER.filter(d=>days.includes(d)), labels,
      hour_options:$("wdHours").value.split("\n").map(x=>x.trim()).filter(Boolean)
    };
    saveConfig(); resyncDays(); render(); reopen("workdays");
  };
  /* ── extra tasks ── */
  const readExtras=()=>{
    const val=(attr,id)=>{ const el=document.querySelector(`[data-${attr}="${id}"]`);
      return el?el.value:null; };
    const lines=(attr,id)=>{ const v=val(attr,id);
      return v==null?null:v.split("\n").map(x=>x.trim()).filter(Boolean); };
    extrasAll().forEach(et=>{
      if(!et.active) return;
      if(val("ethe",et.id)!=null){
        const he=(val("ethe",et.id)||"").trim();
        et.label={he:he||et.id, en:(val("eten",et.id)||"").trim()||he||et.id,
                  es:(val("etes",et.id)||"").trim()||he||et.id};
      }
      const o=lines("etopts",et.id); if(o) et.options=o;
      const m=lines("etm",et.id);    if(m) et.morning_values=m;
      const n=lines("etn",et.id);    if(n) et.noon_values=n;
      const tm=val("ettgm",et.id);   if(tm!=null) et.target_morning=+tm||0;
      const tn=val("ettgn",et.id);   if(tn!=null) et.target_noon=+tn||0;
    });
  };
  if($("saveExtra")) $("saveExtra").onclick=()=>{
    readExtras(); saveConfig(); resyncDays(); render(); reopen("extra"); };
  if($("addExtra")) $("addExtra").onclick=()=>{
    readExtras();
    const et=extrasAll().find(e=>!e.active);
    if(!et){ toast("⚠️ "+t("et_max")); return; }
    et.active=true;
    if(!(et.label&&et.label.he)){ const n=et.id.toUpperCase();
      et.label={he:n,en:n,es:n}; }
    saveConfig(); resyncDays(); render(); reopen("extra");
  };
  document.querySelectorAll("[data-etremove]").forEach(b=>b.onclick=()=>{
    readExtras();
    const et=extrasAll().find(e=>e.id===b.dataset.etremove); if(!et) return;
    et.active=false;                     // switched off; its values are kept
    saveConfig(); resyncDays(); render(); reopen("extra");
  });
  /* ── free-text assignment notes ── */
  if($("saveNotes")) $("saveNotes").onclick=()=>{
    CFG.assign_notes=$("assignNotes").value;
    saveConfig(); render(); reopen("notes");
  };
  /* row order: up/down buttons */
  document.querySelectorAll("[data-up],[data-dn]").forEach(b=>b.onclick=()=>{
    const order=reorderableKeys();
    const i=parseInt(b.dataset.up!=null?b.dataset.up:b.dataset.dn,10);
    const j=b.dataset.up!=null?i-1:i+1;
    if(j<0||j>=order.length) return;
    [order[i],order[j]]=[order[j],order[i]];
    CFG.row_order=order; saveConfig(); render();
    reopen("order");
  });
  /* row order: pointer drag (move/up listeners live on document so the drop
     is caught wherever the finger/cursor is released) */
  const list=document.getElementById("orderList");
  if(list){
    list.querySelectorAll(".handle").forEach(hd=>{
      hd.addEventListener("pointerdown",ev=>{
        ev.preventDefault();
        window.__dragEl=hd.closest("li");
        window.__dragEl.classList.add("dragging");
      });
    });
    if(!window.__orderDragWired){
      window.__orderDragWired=true;
      document.addEventListener("pointermove",ev=>{
        const el=window.__dragEl, lst=document.getElementById("orderList");
        if(!el||!lst) return;
        ev.preventDefault();
        const els=[...lst.querySelectorAll("li:not(.dragging)")];
        const after=els.find(x=>{ const r=x.getBoundingClientRect(); return ev.clientY<r.top+r.height/2; });
        if(after) lst.insertBefore(el,after); else lst.appendChild(el);
      },{passive:false});
      const finish=()=>{
        const el=window.__dragEl, lst=document.getElementById("orderList");
        if(!el) return;
        window.__dragEl=null; el.classList.remove("dragging");
        if(!lst) return;
        CFG.row_order=[...lst.querySelectorAll("li")].map(li=>li.dataset.key);
        saveConfig(); render();
        reopen("order");
      };
      document.addEventListener("pointerup",finish);
      document.addEventListener("pointercancel",finish);
    }
  }
  $("saveLabels").onclick=()=>{
    CFG.row_labels=CFG.row_labels||{};
    document.querySelectorAll("[data-lbl]").forEach(inp=>{
      const k=inp.dataset.lbl, lg=inp.dataset.lang;
      /* a custom row owns its labels directly; everything else uses overrides */
      const cr=customRows().find(r=>r.key===k);
      if(cr){ cr.labels=cr.labels||{}; cr.labels[lg]=inp.value.trim(); return; }
      CFG.row_labels[k]=CFG.row_labels[k]||{};
      CFG.row_labels[k][lg]=inp.value.trim();
    });
    document.querySelectorAll("[data-cre-opts]").forEach(ta=>{
      const cr=customRows().find(r=>r.key===ta.dataset.creOpts);
      if(cr) cr.options=ta.value.split("\n").map(x=>x.trim()).filter(Boolean);
    });
    saveConfig(); render(); reopen("labels");
  };
  $("saveOpts").onclick=()=>{
    document.querySelectorAll("[data-opt]").forEach(ta=>{
      CFG.options[ta.dataset.opt]=ta.value.split("\n").map(s=>s.trim()).filter(Boolean);
    });
    CFG.special_values={
      holiday:$("svHoliday").value.trim(),
      vehicle_special:$("svVehicle").value.trim()
    };
    saveConfig(); render(); reopen("options");
  };
  /* ── change log ── */
  if($("logExport")) $("logExport").onclick=()=>{
    const blob=new Blob([logCsv()],{type:"text/csv;charset=utf-8"});
    const a=document.createElement("a");
    a.href=URL.createObjectURL(blob);
    a.download=`agenda_log_${new Date().toISOString().slice(0,10)}.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),3000);
  };
  if($("logClear")) $("logClear").onclick=()=>{ S.pendingConfirm="clearlog"; render(); reopen("log"); };
  if($("logClearYes")) $("logClearYes").onclick=()=>{
    saveLog([]); S.pendingConfirm=null; toast("🗑 "+t("log_cleared"));
    render(); reopen("log"); };
  /* ── weekly quotas ── */
  const readTargets=()=>{
    const out=[];
    document.querySelectorAll("[data-tgfield]").forEach(sel=>{
      const i=sel.dataset.tgfield;
      const v=document.querySelector(`[data-tgvalue="${i}"]`);
      const c=document.querySelector(`[data-tgcount="${i}"]`);
      out.push({field:sel.value, value:v?v.value:"", count:c?Math.max(0,parseInt(c.value,10)||0):0});
    });
    return out;
  };
  /* switching the row re-fills the value picker from that row's own options */
  document.querySelectorAll("[data-tgfield]").forEach(sel=>sel.onchange=()=>{
    const box=document.querySelector(`[data-tgvalue="${sel.dataset.tgfield}"]`);
    if(!box) return;
    box.innerHTML=`<option value="">${t("wt_any")}</option>`+
      targetFieldValues(sel.value).map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join("");
    box.value="";
  });
  if($("addTarget")) $("addTarget").onclick=()=>{
    const list=readTargets();
    const f=targetFields()[0];
    list.push({field:f?f.key:"theater", value:"", count:1});
    CFG.weekly_targets=list; saveConfig(); render(); reopen("targets");
  };
  document.querySelectorAll("[data-tgremove]").forEach(b=>b.onclick=()=>{
    const list=readTargets();
    list.splice(+b.dataset.tgremove,1);
    CFG.weekly_targets=list; saveConfig(); render(); reopen("targets");
  });
  if($("saveTargets")) $("saveTargets").onclick=()=>{
    CFG.weekly_targets=readTargets();
    saveConfig(); render(); reopen("targets");
  };
  /* ── target-% tables ── */
  const pctTotal=key=>{ let n=0;
    document.querySelectorAll(`[data-pct="${key}"]`).forEach(i=>n+=parseInt(i.value||0,10)||0);
    return n; };
  const paintTot=key=>{ const el=document.querySelector(`[data-pcttot="${key}"]`);
    if(!el) return; const n=pctTotal(key);
    el.textContent=n+"%"; el.className="pct-tot "+(n===100?"ok":"bad"); };
  document.querySelectorAll("[data-pct]").forEach(inp=>{
    inp.oninput=()=>paintTot(inp.dataset.pct); });
  document.querySelectorAll("[data-pctreset]").forEach(b=>b.onclick=()=>{
    const key=b.dataset.pctreset, d=defaultPcts(key);
    document.querySelectorAll(`[data-pct="${key}"]`).forEach(i=>i.value=d[i.dataset.val]||0);
    paintTot(key); });
  document.querySelectorAll("[data-pctsave]").forEach(b=>b.onclick=()=>{
    const key=b.dataset.pctsave;
    if(pctTotal(key)!==100){ toast(t("pct_err_100")); return; }
    /* merge, never replace: a value later deleted from the option list keeps
       its saved percentage in CFG in case it comes back */
    CFG.targets.field_pcts=CFG.targets.field_pcts||{};
    const o={...(CFG.targets.field_pcts[key]||{})};
    document.querySelectorAll(`[data-pct="${key}"]`).forEach(i=>o[i.dataset.val]=parseInt(i.value||0,10)||0);
    CFG.targets.field_pcts[key]=o;
    saveConfig(); render();
    reopen("targets"); });
  /* ── axes: each one's U/D split ── */
  const axTot=id=>{
    const u=document.querySelector(`[data-axu="${id}"]`), dd=document.querySelector(`[data-axd="${id}"]`);
    return (u?parseInt(u.value,10)||0:0)+(dd?parseInt(dd.value,10)||0:0);
  };
  const paintAx=id=>{
    const el=document.querySelector(`[data-axtot="${id}"]`); if(!el) return;
    const n=axTot(id); el.textContent=n+"%"; el.className="pct-tot "+(n===100?"ok":"bad");
  };
  document.querySelectorAll("[data-axu],[data-axd]").forEach(inp=>{
    inp.oninput=()=>paintAx(inp.dataset.axu||inp.dataset.axd); });
  const readAxes=()=>{
    document.querySelectorAll("[data-axlabel]").forEach(inp=>{
      const a=axisById(inp.dataset.axlabel); if(a) a.label=inp.value.trim()||a.id; });
    document.querySelectorAll("[data-axu]").forEach(inp=>{
      const a=axisById(inp.dataset.axu);
      if(a) a.pct_u=Math.max(0,Math.min(100,parseInt(inp.value,10)||0)); });
    document.querySelectorAll("[data-axd]").forEach(inp=>{
      const a=axisById(inp.dataset.axd);
      if(a) a.pct_d=Math.max(0,Math.min(100,parseInt(inp.value,10)||0)); });
  };
  if($("saveAxes")) $("saveAxes").onclick=()=>{
    readAxes();
    const bad=activeAxes().find(a=>((+a.pct_u||0)+(+a.pct_d||0))!==100);
    if(bad){ toast("⚠️ "+t("err_axis_ud",{a:axisLabel(bad),n:(+bad.pct_u||0)+(+bad.pct_d||0)})); return; }
    saveConfig(); render(); reopen("axes");
  };
  if($("addAxis")) $("addAxis").onclick=()=>{
    readAxes();
    const used=new Set(axesAll().map(a=>a.id));
    /* reactivate a retired letter before minting a new one */
    let slot=axesAll().find(a=>!a.active);
    if(!slot){
      const next="ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("").find(L=>!used.has(L));
      if(!next||activeAxes().length>=MAX_AXES){ toast("⚠️ "+t("ax_max")); return; }
      slot={id:next, label:next, pct_u:50, pct_d:50, active:false};
      CFG.axes=axesAll().concat([slot]);
    }
    slot.active=true;
    saveConfig(); render(); reopen("axes");
  };
  document.querySelectorAll("[data-axremove]").forEach(b=>b.onclick=()=>{
    readAxes();
    const a=axisById(b.dataset.axremove); if(!a) return;
    a.active=false;                       // retired, its split is kept
    saveConfig(); render(); reopen("axes");
  });
  /* ── entry/exit → axis rules ── */
  const arTot=(kind,val)=>{
    let n=0;
    document.querySelectorAll(`[data-arax="${kind}"][data-val="${val}"]:checked`).forEach(cb=>{
      const p=document.querySelector(
        `[data-arpct="${kind}"][data-val="${val}"][data-letter="${cb.dataset.letter}"]`);
      n+=p?parseInt(p.value,10)||0:0; });
    return n;
  };
  const paintAr=(kind,val)=>{
    const el=document.querySelector(`[data-artot="${kind}"][data-val="${val}"]`);
    if(!el) return;
    const any=document.querySelector(`[data-arax="${kind}"][data-val="${val}"]:checked`);
    const n=arTot(kind,val);
    el.textContent=n+"%"; el.className="pct-tot "+(any&&n===100?"ok":"bad");
  };
  document.querySelectorAll("[data-arax]").forEach(cb=>cb.onchange=()=>{
    const p=document.querySelector(
      `[data-arpct="${cb.dataset.arax}"][data-val="${cb.dataset.val}"][data-letter="${cb.dataset.letter}"]`);
    if(p){ p.disabled=!cb.checked; if(!cb.checked) p.value=0; }
    paintAr(cb.dataset.arax, cb.dataset.val);
  });
  document.querySelectorAll("[data-arpct]").forEach(inp=>{
    inp.oninput=()=>paintAr(inp.dataset.arpct, inp.dataset.val); });
  document.querySelectorAll("[data-arsave]").forEach(b=>b.onclick=()=>{
    const kind=b.dataset.arsave, out={};
    const vals=new Set();
    document.querySelectorAll(`[data-arax="${kind}"]`).forEach(cb=>vals.add(cb.dataset.val));
    for(const v of vals){
      const ids=[], pcts={};
      document.querySelectorAll(`[data-arax="${kind}"][data-val="${v}"]:checked`).forEach(cb=>{
        const L=cb.dataset.letter;
        const p=document.querySelector(`[data-arpct="${kind}"][data-val="${v}"][data-letter="${L}"]`);
        ids.push(L); pcts[L]=p?Math.max(0,Math.min(100,parseInt(p.value,10)||0)):0;
      });
      if(!ids.length) continue;               // no axes ticked ⇒ no rule, any axis
      const sum=ids.reduce((x,L)=>x+pcts[L],0);
      if(sum!==100){ toast("⚠️ "+t("err_axis_rule_pct",{f:rowLabel(kind), v, n:sum})); return; }
      out[v]={axes:ids, pcts};
    }
    CFG[AXIS_RULE_KEY[kind]]=out;
    saveConfig(); render(); reopen("axes");
  });
  /* ── add a row ── */
  const syncCrType=()=>{
    const w=$("crOptsWrap");
    if(w) w.style.display=$("crType").value==="select"?"":"none";
  };
  if($("crType")){ $("crType").onchange=syncCrType; syncCrType(); }
  if($("addRow")) $("addRow").onclick=()=>{
    const he=$("crHe").value.trim();
    if(!he){ toast("⚠️ "+t("name_required")); return; }
    const key=normalizeRowKey($("crKey").value);
    if(!key||!/^[a-z][a-z0-9_]*$/.test(key)){ toast("⚠️ "+t("key_invalid")); return; }
    if(takenRowKeys().has(key)){ toast("⚠️ "+t("key_taken")); return; }
    const type=$("crType").value;
    CFG.custom_rows=(CFG.custom_rows||[]).concat([{ key,
      labels:{he, en:$("crEn").value.trim()||he, es:$("crEs").value.trim()||he},
      input:type,
      options:type==="select"
        ? $("crOpts").value.split("\n").map(x=>x.trim()).filter(Boolean) : [] }]);
    if(S.days) Object.values(S.days).forEach(d=>{ if(d[key]==null) d[key]=""; });
    logNext("add_row","log_add_row",{r:he});
    saveConfig(); saveDraft(); toast("✅ "+t("row_added")); render();
    reopen("labels");
  };
  document.querySelectorAll("[data-delrow]").forEach(b=>b.onclick=()=>{
    S.pendingConfirm="delrow_"+b.dataset.delrow; render(); reopen("labels"); });
  document.querySelectorAll("[data-delrow-yes]").forEach(b=>b.onclick=()=>{
    const key=b.dataset.delrowYes, kind=rowKind(key);
    logNext("delete_row","log_del_row",{r:rowLabel(key)});
    /* Remove the row at its source so the tab that owns it agrees:
       a section leaves its workplace, an extra task is switched off, a custom
       row is dropped, and a built-in is recorded in removed_rows. */
    if(kind==="custom"){
      CFG.custom_rows=customRows().filter(r=>r.key!==key);
    } else if(kind==="section"){
      workplacesAll().forEach(w=>{
        w.sections=(w.sections||[]).filter(sec=>sec.row_key!==key); });
    } else if(kind==="extra"){
      const et=extraByRow(key); if(et) et.active=false;
    } else {
      CFG.removed_rows=(CFG.removed_rows||[]).concat([key]);
    }
    /* and everything that pointed at it goes too */
    CFG.row_order=(CFG.row_order||[]).filter(k=>k!==key);
    CFG.weekly_targets=(CFG.weekly_targets||[]).filter(q=>q.field!==key);
    if(CFG.row_labels) delete CFG.row_labels[key];
    if(CFG.targets&&CFG.targets.field_pcts) delete CFG.targets.field_pcts[key];
    if(S.days){ Object.values(S.days).forEach(d=>{ delete d[key]; }); saveDraft(); }
    S.pendingConfirm=null; saveConfig(); toast("🗑 "+t("row_deleted")); render();
    reopen("labels"); });
}

/* ═══════════════ boot ═══════════════ */
render();
if("serviceWorker" in navigator && location.protocol.startsWith("http")){
  navigator.serviceWorker.register("service-worker.js").then(()=>{
    if(!localStorage.getItem("agenda_sw_toasted")){
      localStorage.setItem("agenda_sw_toasted","1"); toast("✅ "+t("offline_ready"));
    }
  }).catch(()=>{});
}
</script>
</body>
</html>
